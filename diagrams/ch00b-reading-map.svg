<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="105" font-size="48" font-weight="800" fill="#0D1117">Four readers, one ledger: start where you touch the money</text>

  <g text-anchor="middle">
    <rect x="80" y="160" width="200" height="120" rx="16" fill="#E9ECEF"/>
    <text x="180" y="200" font-size="22" font-weight="700" fill="#5B6470" letter-spacing="2">PART I</text>
    <text x="180" y="234" font-size="26" font-weight="700" fill="#0D1117">The problem</text>
    <text x="180" y="264" font-size="22" fill="#5B6470">Ch 1 to 3</text>

    <g font-size="30" font-weight="800" fill="#0D1117">
      <rect x="300" y="160" width="150" height="120" rx="16" fill="#61D8FE"/>
      <text x="375" y="218">Map</text>
      <rect x="460" y="160" width="150" height="120" rx="16" fill="#61D8FE"/>
      <text x="535" y="218">Sort</text>
      <rect x="620" y="160" width="150" height="120" rx="16" fill="#61D8FE"/>
      <text x="695" y="218">Size</text>
      <rect x="780" y="160" width="150" height="120" rx="16" fill="#61D8FE"/>
      <text x="855" y="218">Ship</text>
    </g>
    <g font-size="30" font-weight="800" fill="#FFFFFF">
      <rect x="940" y="160" width="150" height="120" rx="16" fill="#544AE9"/>
      <text x="1015" y="218">Bank</text>
      <rect x="1100" y="160" width="150" height="120" rx="16" fill="#544AE9"/>
      <text x="1175" y="218">Prove</text>
    </g>
    <g font-size="22" fill="#333333">
      <text x="375" y="256">Ch 4</text><text x="535" y="256">Ch 5</text><text x="695" y="256">Ch 6</text><text x="855" y="256">Ch 7</text>
    </g>
    <g font-size="22" fill="#FFFFFF">
      <text x="1015" y="256">Ch 8</text><text x="1175" y="256">Ch 9</text>
    </g>
    <rect x="1270" y="160" width="250" height="120" rx="16" fill="#E9ECEF"/>
    <text x="1395" y="200" font-size="22" font-weight="700" fill="#5B6470" letter-spacing="2">PART III</text>
    <text x="1395" y="234" font-size="26" font-weight="700" fill="#0D1117">Leading the shift</text>
    <text x="1395" y="264" font-size="22" fill="#5B6470">Ch 10 to 13</text>
    <text x="775" y="318" font-size="22" fill="#5B6470">PART II: THE SIX MOVES</text>
  </g>

  <g>
    <rect x="80" y="350" width="345" height="370" rx="20" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="3"/>
    <rect x="445" y="350" width="345" height="370" rx="20" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="3"/>
    <rect x="810" y="350" width="345" height="370" rx="20" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="3"/>
    <rect x="1175" y="350" width="345" height="370" rx="20" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="3"/>
    <g font-size="36" font-weight="800" fill="#0D1117">
      <text x="112" y="410">CEO</text><text x="477" y="410">CFO</text><text x="842" y="410">Manager</text><text x="1207" y="410">Data scientist</text>
    </g>
    <g font-size="22" fill="#5B6470">
      <text x="112" y="452">Your question</text><text x="477" y="452">Your question</text><text x="842" y="452">Your question</text><text x="1207" y="452">Your question</text>
      <text x="112" y="590">Read first</text><text x="477" y="590">Read first</text><text x="842" y="590">Read first</text><text x="1207" y="590">Read first</text>
    </g>
    <g font-size="27" font-weight="600" fill="#333333">
      <text x="112" y="492">Is AI changing</text><text x="112" y="526">how we compete?</text>
      <text x="477" y="492">Where is the</text><text x="477" y="526">money, exactly?</text>
      <text x="842" y="492">Where do my</text><text x="842" y="526">team's hours go?</text>
      <text x="1207" y="492">What do I build, and</text><text x="1207" y="526">how will it be judged?</text>
    </g>
    <g fill="#544AE9">
      <circle cx="140" cy="652" r="30"/><circle cx="210" cy="652" r="30"/><circle cx="280" cy="652" r="30"/>
      <circle cx="505" cy="652" r="30"/><circle cx="575" cy="652" r="30"/><circle cx="645" cy="652" r="30"/><circle cx="715" cy="652" r="30"/>
      <circle cx="870" cy="652" r="30"/><circle cx="940" cy="652" r="30"/><circle cx="1010" cy="652" r="30"/><circle cx="1080" cy="652" r="30"/>
      <circle cx="1235" cy="652" r="30"/><circle cx="1305" cy="652" r="30"/><circle cx="1375" cy="652" r="30"/><circle cx="1445" cy="652" r="30"/>
    </g>
    <g font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <text x="140" y="661">1</text><text x="210" y="661">11</text><text x="280" y="661">13</text>
      <text x="505" y="661">2</text><text x="575" y="661">6</text><text x="645" y="661">8</text><text x="715" y="661">9</text>
      <text x="870" y="661">3</text><text x="940" y="661">4</text><text x="1010" y="661">8</text><text x="1080" y="661">10</text>
      <text x="1235" y="661">5</text><text x="1305" y="661">6</text><text x="1375" y="661">7</text><text x="1445" y="661">12</text>
    </g>
  </g>

  <rect x="80" y="768" width="8" height="56" fill="#61D8FE"/>
  <text x="110" y="806" font-size="34" font-weight="700" fill="#0D1117">Everyone reads Part I. Then follow the money from your own seat.</text>
  <text x="1520" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
