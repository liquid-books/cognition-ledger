<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="105" font-size="46" font-weight="800" fill="#0D1117">Every step looks fine. Together, most quotes need fixing.</text>
  <text x="80" y="150" font-size="26" fill="#5B6470">100 Brightwater quotes through four handoffs. %C&amp;A: share passed on usable as is.</text>

  <g font-size="26" font-weight="700" fill="#0D1117">
    <text x="80" y="232">100 quotes start</text>
    <text x="80" y="317">Request complete: 60%</text>
    <text x="80" y="402">Pricing usable: 85%</text>
    <text x="80" y="487">Approval usable: 90%</text>
    <text x="80" y="572">Quote right: 92%</text>
  </g>
  <g fill="#E9ECEF">
    <rect x="470" y="198" width="1000" height="52" rx="8"/>
    <rect x="470" y="283" width="1000" height="52" rx="8"/>
    <rect x="470" y="368" width="1000" height="52" rx="8"/>
    <rect x="470" y="453" width="1000" height="52" rx="8"/>
    <rect x="470" y="538" width="1000" height="52" rx="8"/>
  </g>
  <g fill="#61D8FE">
    <rect x="470" y="198" width="1000" height="52" rx="8"/>
    <rect x="470" y="283" width="600" height="52" rx="8"/>
    <rect x="470" y="368" width="510" height="52" rx="8"/>
    <rect x="470" y="453" width="459" height="52" rx="8"/>
  </g>
  <rect x="470" y="538" width="422" height="52" rx="8" fill="#544AE9"/>
  <g font-size="26" font-weight="800" fill="#0D1117">
    <text x="495" y="233">100</text><text x="495" y="318">60 clean</text><text x="495" y="403">51 clean</text><text x="495" y="488">46 clean</text>
  </g>
  <text x="495" y="573" font-size="26" font-weight="800" fill="#FFFFFF">42 clean, start to finish</text>
  <g font-size="22" fill="#5B6470">
    <text x="1450" y="318" text-anchor="end">40 need fixing</text>
    <text x="1450" y="573" text-anchor="end">58 touched again somewhere</text>
  </g>

  <text x="80" y="665" font-size="30" font-weight="800" fill="#544AE9">Rolled %C&amp;A = 0.60 × 0.85 × 0.90 × 0.92 = 42%</text>
  <text x="80" y="705" font-size="24" fill="#333333">Multiply each step's %C&amp;A to see how often a unit gets through the whole stream with no rework.</text>

  <rect x="80" y="768" width="8" height="56" fill="#61D8FE"/>
  <text x="110" y="806" font-size="34" font-weight="700" fill="#0D1117">Rework doesn't look like rework. It looks like waiting.</text>
  <text x="1520" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
