<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="60" y="95" font-size="48" font-weight="800" fill="#0D1117">Climb only as high as the work demands</text>
  <text x="60" y="140" font-size="26" fill="#5B6470">Four answers to "how should this work get done?", from cheapest and safest to most autonomous</text>

  <!-- rising arrow -->
  <line x1="90" y1="330" x2="1050" y2="215" stroke="#ADB5BD" stroke-width="4" stroke-dasharray="12 10"/>
  <polygon points="1050,200 1085,211 1054,232" fill="#ADB5BD"/>
  <text x="90" y="300" font-size="23" fill="#5B6470" transform="rotate(-6.8 90 300)">cost, risk and oversight rise with every step up</text>

  <!-- step 1 -->
  <rect x="60" y="560" width="330" height="170" rx="16" fill="#E9ECEF"/>
  <text x="85" y="605" font-size="30" font-weight="800" fill="#0D1117">Workflow</text>
  <text x="85" y="640" font-size="30" font-weight="800" fill="#0D1117">automation</text>
  <text x="85" y="680" font-size="22" fill="#333333">Rules on clean data.</text>
  <text x="85" y="708" font-size="22" fill="#333333">No AI needed.</text>

  <!-- step 2 -->
  <rect x="410" y="440" width="330" height="290" rx="16" fill="#61D8FE"/>
  <text x="435" y="485" font-size="30" font-weight="800" fill="#0D1117">Packaged</text>
  <text x="435" y="520" font-size="30" font-weight="800" fill="#0D1117">expertise</text>
  <text x="435" y="555" font-size="23" font-weight="700" fill="#0D1117">today: a Skill</text>
  <text x="435" y="605" font-size="22" fill="#0D1117">A person starts it.</text>
  <text x="435" y="633" font-size="22" fill="#0D1117">AI does one thinking task</text>
  <text x="435" y="661" font-size="22" fill="#0D1117">the house way.</text>
  <text x="435" y="689" font-size="22" fill="#0D1117">A person reviews it.</text>

  <!-- step 3 -->
  <rect x="760" y="320" width="330" height="410" rx="16" fill="#61D8FE"/>
  <text x="785" y="365" font-size="30" font-weight="800" fill="#0D1117">Autonomous</text>
  <text x="785" y="400" font-size="30" font-weight="800" fill="#0D1117">cognition</text>
  <text x="785" y="435" font-size="23" font-weight="700" fill="#0D1117">today: an agent</text>
  <text x="785" y="485" font-size="22" fill="#0D1117">An event starts it.</text>
  <text x="785" y="513" font-size="22" fill="#0D1117">AI chooses its own steps</text>
  <text x="785" y="541" font-size="22" fill="#0D1117">across several systems.</text>
  <text x="785" y="569" font-size="22" fill="#0D1117">People approve at the</text>
  <text x="785" y="597" font-size="22" fill="#0D1117">checkpoints that matter.</text>

  <!-- keep human, separate -->
  <rect x="1150" y="230" width="390" height="500" rx="16" fill="#FF5CAD"/>
  <text x="1175" y="280" font-size="23" font-weight="700" fill="#0D1117">OFF THE LADDER</text>
  <text x="1175" y="330" font-size="30" font-weight="800" fill="#0D1117">Keep human,</text>
  <text x="1175" y="365" font-size="30" font-weight="800" fill="#0D1117">AI assists</text>
  <text x="1175" y="420" font-size="22" fill="#0D1117">When a wrong answer is too</text>
  <text x="1175" y="448" font-size="22" fill="#0D1117">costly or too permanent to</text>
  <text x="1175" y="476" font-size="22" fill="#0D1117">hand over.</text>
  <text x="1175" y="526" font-size="22" fill="#0D1117">AI researches and drafts.</text>
  <text x="1175" y="554" font-size="22" fill="#0D1117">A person decides and acts.</text>

  <text x="1175" y="650" font-size="22" font-weight="700" fill="#0D1117">At Brightwater: none of</text><text x="1175" y="678" font-size="22" font-weight="700" fill="#0D1117">the seven scored ideas.</text>
  <line x1="60" y1="730" x2="1100" y2="730" stroke="#ADB5BD" stroke-width="3"/>

  <rect x="60" y="770" width="8" height="54" fill="#61D8FE"/>
  <text x="90" y="808" font-size="32" font-weight="700" fill="#0D1117">Use the simplest thing that works, then earn your way to autonomy.</text>
  <text x="1540" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
