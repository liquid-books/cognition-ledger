<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6470"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#61D8FE"/></marker></defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="80" y="100" font-size="48" font-weight="800" fill="#0D1117" text-anchor="start" >Stop timing tasks. Measure the stream.</text>
<text x="80" y="146" font-size="26" font-weight="400" fill="#5B6470" text-anchor="start" >When many Skills and agents share one value stream, five numbers replace the minutes-per-task scorecard.</text>
<rect x="80" y="190" width="460" height="540" rx="18" fill="#E9ECEF" />
<text x="110" y="240" font-size="30" font-weight="700" fill="#5B6470" text-anchor="start" >Task view</text>
<text x="110" y="276" font-size="22" font-weight="400" fill="#5B6470" text-anchor="start" >what most AI programs track</text>
<text x="110" y="350" font-size="26" font-weight="600" fill="#5B6470" text-anchor="start" >Minutes saved per task</text>
<text x="110" y="430" font-size="26" font-weight="600" fill="#5B6470" text-anchor="start" >Error rate of one tool</text>
<text x="110" y="510" font-size="26" font-weight="600" fill="#5B6470" text-anchor="start" >Hours freed per tool</text>
<text x="110" y="590" font-size="26" font-weight="600" fill="#5B6470" text-anchor="start" >Number of tools live</text>
<text x="560" y="470" font-size="60" font-weight="700" fill="#ADB5BD" text-anchor="start" >→</text>
<rect x="620" y="190" width="900" height="540" rx="18" fill="#FFFFFF" stroke="#544AE9" stroke-width="4"/>
<text x="650" y="240" font-size="30" font-weight="700" fill="#544AE9" text-anchor="start" >Stream view</text>
<text x="650" y="276" font-size="22" font-weight="400" fill="#5B6470" text-anchor="start" >what the business actually feels</text>
<rect x="650" y="302" width="12" height="52" rx="3" fill="#61D8FE" />
<text x="680" y="328" font-size="26" font-weight="700" fill="#0D1117" text-anchor="start" >End-to-end lead time</text>
<text x="680" y="356" font-size="22" font-weight="400" fill="#333333" text-anchor="start" >How long from request to cash?</text>
<rect x="650" y="382" width="12" height="52" rx="3" fill="#61D8FE" />
<text x="680" y="408" font-size="26" font-weight="700" fill="#0D1117" text-anchor="start" >Handoffs per unit</text>
<text x="680" y="436" font-size="22" font-weight="400" fill="#333333" text-anchor="start" >How many times does work change hands?</text>
<rect x="650" y="462" width="12" height="52" rx="3" fill="#61D8FE" />
<text x="680" y="488" font-size="26" font-weight="700" fill="#0D1117" text-anchor="start" >Checkpoint load</text>
<text x="680" y="516" font-size="22" font-weight="400" fill="#333333" text-anchor="start" >How many human hours, and how long a queue?</text>
<rect x="650" y="542" width="12" height="52" rx="3" fill="#61D8FE" />
<text x="680" y="568" font-size="26" font-weight="700" fill="#0D1117" text-anchor="start" >Compounded first-pass yield</text>
<text x="680" y="596" font-size="22" font-weight="400" fill="#333333" text-anchor="start" >How many units get through with no rework?</text>
<rect x="650" y="622" width="12" height="52" rx="3" fill="#544AE9" />
<text x="680" y="648" font-size="26" font-weight="700" fill="#0D1117" text-anchor="start" >Cost per correct outcome</text>
<text x="680" y="676" font-size="22" font-weight="400" fill="#333333" text-anchor="start" >What does one clean order-to-cash cost?</text>
<rect x="80" y="750" width="8" height="52" rx="0" fill="#61D8FE" />
<text x="110" y="786" font-size="30" font-weight="700" fill="#0D1117" text-anchor="start" >A faster step that doesn't shorten the stream is a hobby, not a result.</text>
<text x="1520" y="866" font-size="22" font-weight="400" fill="#5B6470" text-anchor="end" >The Cognition Ledger · DrLee.ai</text>
