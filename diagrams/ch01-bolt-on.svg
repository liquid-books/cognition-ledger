<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="105" font-size="46" font-weight="800" fill="#0D1117">AI on every desk speeds up the steps, not the work</text>
  <text x="80" y="150" font-size="26" fill="#5B6470">Wave one makes each step faster. Wave two removes the waits between the steps.</text>

  <text x="80" y="212" font-size="24" font-weight="800" fill="#5B6470" letter-spacing="2">WAVE ONE: BOLT AI ONTO THE OLD ORG CHART</text>
  <g fill="#FFFFFF" stroke="#ADB5BD" stroke-width="3">
    <rect x="80" y="240" width="170" height="90" rx="14"/><rect x="330" y="240" width="170" height="90" rx="14"/>
    <rect x="580" y="240" width="170" height="90" rx="14"/><rect x="830" y="240" width="170" height="90" rx="14"/>
    <rect x="1080" y="240" width="170" height="90" rx="14"/>
  </g>
  <g fill="#61D8FE">
    <rect x="200" y="226" width="58" height="32" rx="8"/><rect x="450" y="226" width="58" height="32" rx="8"/>
    <rect x="700" y="226" width="58" height="32" rx="8"/><rect x="950" y="226" width="58" height="32" rx="8"/>
    <rect x="1200" y="226" width="58" height="32" rx="8"/>
  </g>
  <g font-size="22" font-weight="800" fill="#0D1117" text-anchor="middle">
    <text x="229" y="250">AI</text><text x="479" y="250">AI</text><text x="729" y="250">AI</text><text x="979" y="250">AI</text><text x="1229" y="250">AI</text>
  </g>
  <g font-size="28" font-weight="700" fill="#0D1117" text-anchor="middle">
    <text x="165" y="296">Quote</text><text x="415" y="296">Order</text><text x="665" y="296">Credit</text><text x="915" y="296">Invoice</text><text x="1165" y="296">Collect</text>
  </g>
  <g fill="#ADB5BD">
    <rect x="268" y="262" width="44" height="11" rx="3"/><rect x="268" y="279" width="44" height="11" rx="3"/><rect x="268" y="296" width="44" height="11" rx="3"/>
    <rect x="518" y="262" width="44" height="11" rx="3"/><rect x="518" y="279" width="44" height="11" rx="3"/><rect x="518" y="296" width="44" height="11" rx="3"/>
    <rect x="768" y="262" width="44" height="11" rx="3"/><rect x="768" y="279" width="44" height="11" rx="3"/><rect x="768" y="296" width="44" height="11" rx="3"/>
    <rect x="1018" y="262" width="44" height="11" rx="3"/><rect x="1018" y="279" width="44" height="11" rx="3"/><rect x="1018" y="296" width="44" height="11" rx="3"/>
  </g>
  <g font-size="22" fill="#5B6470" text-anchor="middle">
    <text x="290" y="358">wait</text><text x="540" y="358">wait</text><text x="790" y="358">wait</text><text x="1040" y="358">wait</text>
  </g>
  <rect x="1300" y="240" width="220" height="90" rx="14" fill="#E9ECEF"/>
  <text x="1410" y="278" font-size="24" fill="#333333" text-anchor="middle">Customer waits</text>
  <text x="1410" y="312" font-size="28" font-weight="800" fill="#0D1117" text-anchor="middle">days</text>
  <text x="80" y="408" font-size="26" fill="#333333">Each desk gets faster. The work still sits in a queue between every desk.</text>

  <line x1="80" y1="445" x2="1520" y2="445" stroke="#E9ECEF" stroke-width="3"/>

  <text x="80" y="492" font-size="24" font-weight="800" fill="#544AE9" letter-spacing="2">WAVE TWO: REDESIGN THE STREAM AROUND CHEAP THINKING</text>
  <rect x="80" y="530" width="1170" height="90" rx="16" fill="#61D8FE"/>
  <g stroke="#FFFFFF" stroke-width="3">
    <line x1="290" y1="540" x2="290" y2="610"/><line x1="540" y1="540" x2="540" y2="610"/>
    <line x1="790" y1="540" x2="790" y2="610"/><line x1="1040" y1="540" x2="1040" y2="610"/>
  </g>
  <g font-size="28" font-weight="700" fill="#0D1117" text-anchor="middle">
    <text x="165" y="586">Quote</text><text x="415" y="586">Order</text><text x="665" y="586">Credit</text><text x="915" y="586">Invoice</text><text x="1165" y="586">Collect</text>
  </g>
  <g fill="#FF5CAD" stroke="#FFFFFF" stroke-width="4">
    <circle cx="665" cy="530" r="22"/><circle cx="1165" cy="530" r="22"/>
  </g>
  <rect x="1300" y="530" width="220" height="90" rx="14" fill="#544AE9"/>
  <text x="1410" y="568" font-size="24" fill="#FFFFFF" text-anchor="middle">Customer waits</text>
  <text x="1410" y="602" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">hours</text>
  <text x="80" y="672" font-size="26" fill="#333333">Skills and agents carry the work end to end. A person decides at each pink checkpoint.</text>

  <rect x="80" y="768" width="8" height="56" fill="#61D8FE"/>
  <text x="110" y="806" font-size="34" font-weight="700" fill="#0D1117">Faster steps are wave one. A faster stream is wave two.</text>
  <text x="1520" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
