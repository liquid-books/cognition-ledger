<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="100" font-size="48" font-weight="800" fill="#0D1117">A Skill stays small until the work calls for it</text>
  <text x="80" y="148" font-size="26" fill="#5B6470">Three layers of packaged expertise, shown with Brightwater's quote builder</text>

  <!-- Level 1 -->
  <rect x="80" y="190" width="1440" height="130" rx="18" fill="#FFFFFF" stroke="#61D8FE" stroke-width="3"/>
  <rect x="80" y="190" width="470" height="130" rx="18" fill="#61D8FE"/>
  <text x="110" y="240" font-size="30" font-weight="800" fill="#0D1117">1  Name + description</text>
  <text x="110" y="285" font-size="24" fill="#0D1117">Always visible</text>
  <text x="590" y="240" font-size="26" font-weight="700" fill="#0D1117">brightwater-quote-builder</text>
  <text x="590" y="280" font-size="24" fill="#333333">"Drafts a quote from a request email. Use when a rep</text>
  <text x="590" y="310" font-size="24" fill="#333333">forwards a quote request and asks for a quote."</text>

  <!-- Level 2 -->
  <rect x="80" y="340" width="1440" height="130" rx="18" fill="#FFFFFF" stroke="#61D8FE" stroke-width="3"/>
  <rect x="80" y="340" width="470" height="130" rx="18" fill="#61D8FE" fill-opacity="0.55"/>
  <text x="110" y="390" font-size="30" font-weight="800" fill="#0D1117">2  Instructions</text>
  <text x="110" y="435" font-size="24" fill="#0D1117">Load when a task matches</text>
  <text x="590" y="385" font-size="24" fill="#333333">Extract the request · match parts · apply discount tier</text>
  <text x="590" y="420" font-size="24" fill="#333333">Flag any line under the 18% margin floor</text>
  <text x="590" y="455" font-size="24" fill="#333333">List every doubt at the top · never invent a price</text>

  <!-- Level 3 -->
  <rect x="80" y="490" width="1440" height="130" rx="18" fill="#FFFFFF" stroke="#61D8FE" stroke-width="3"/>
  <rect x="80" y="490" width="470" height="130" rx="18" fill="#61D8FE" fill-opacity="0.25"/>
  <text x="110" y="540" font-size="30" font-weight="800" fill="#0D1117">3  Files and scripts</text>
  <text x="110" y="585" font-size="24" fill="#0D1117">Load only when reached for</text>
  <text x="590" y="545" font-size="24" fill="#333333">price-file.csv · discount-rules.md · quote-template.docx</text>
  <text x="590" y="585" font-size="24" fill="#333333">A script's answer comes back; its code never does</text>

  <!-- Human -->
  <rect x="80" y="645" width="1440" height="80" rx="18" fill="#FF5CAD"/>
  <text x="800" y="696" font-size="28" font-weight="700" fill="#0D1117" text-anchor="middle">A person starts it. A person reviews the draft and sends it.</text>

  <rect x="80" y="768" width="8" height="52" fill="#61D8FE"/>
  <text x="110" y="804" font-size="30" font-weight="700" fill="#0D1117">The description is the trigger: say what it does and when to use it.</text>
  <text x="1520" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
