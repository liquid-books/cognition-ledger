<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60" y="95" font-size="44" font-weight="800" fill="#0D1117">Seven wastes call for AI. One calls for the delete key.</text>
<text x="60" y="140" font-size="26" fill="#5B6470">The eight cognitive wastes of knowledge work, and how strongly AI can help with each</text>
<rect x="60" y="185" width="355" height="250" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
<text x="84" y="229" font-size="24" font-weight="700" fill="#5B6470">01</text>
<text x="84" y="267" font-size="30" font-weight="800" fill="#0D1117">Re-keying</text>
<text x="84" y="337" font-size="22" fill="#333333">Typing data from emails</text>
<text x="84" y="365" font-size="22" fill="#333333">and PDFs into systems</text>
<rect x="80" y="381" width="315" height="40" rx="20" fill="#61D8FE"/><text x="237" y="409" font-size="22" font-weight="700" fill="#0D1117" text-anchor="middle">AI signal: strong</text>
<rect x="435" y="185" width="355" height="250" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
<text x="459" y="229" font-size="24" font-weight="700" fill="#5B6470">02</text>
<text x="459" y="267" font-size="30" font-weight="800" fill="#0D1117">Searching</text>
<text x="459" y="337" font-size="22" fill="#333333">Hunting for the contract,</text>
<text x="459" y="365" font-size="22" fill="#333333">the proof, the last email</text>
<rect x="455" y="381" width="315" height="40" rx="20" fill="#61D8FE"/><text x="612" y="409" font-size="22" font-weight="700" fill="#0D1117" text-anchor="middle">AI signal: strong</text>
<rect x="810" y="185" width="355" height="250" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
<text x="834" y="229" font-size="24" font-weight="700" fill="#5B6470">03</text>
<text x="834" y="267" font-size="30" font-weight="800" fill="#0D1117">Waiting on</text>
<text x="834" y="301" font-size="30" font-weight="800" fill="#0D1117">decisions</text>
<text x="834" y="337" font-size="22" fill="#333333">Work parked until a</text>
<text x="834" y="365" font-size="22" fill="#333333">manager looks at it</text>
<rect x="830" y="381" width="315" height="40" rx="20" fill="#FFFFFF" stroke="#61D8FE" stroke-width="3"/><text x="987" y="409" font-size="22" font-weight="700" fill="#0D1117" text-anchor="middle">AI signal: medium</text>
<rect x="1185" y="185" width="355" height="250" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
<text x="1209" y="229" font-size="24" font-weight="700" fill="#5B6470">04</text>
<text x="1209" y="267" font-size="30" font-weight="800" fill="#0D1117">Handoffs</text>
<text x="1209" y="337" font-size="22" fill="#333333">Each person re-reads</text>
<text x="1209" y="365" font-size="22" fill="#333333">the whole context</text>
<rect x="1205" y="381" width="315" height="40" rx="20" fill="#61D8FE"/><text x="1362" y="409" font-size="22" font-weight="700" fill="#0D1117" text-anchor="middle">AI signal: strong</text>
<rect x="60" y="455" width="355" height="250" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
<text x="84" y="499" font-size="24" font-weight="700" fill="#5B6470">05</text>
<text x="84" y="537" font-size="30" font-weight="800" fill="#0D1117">Incomplete</text>
<text x="84" y="571" font-size="30" font-weight="800" fill="#0D1117">inputs</text>
<text x="84" y="607" font-size="22" fill="#333333">Chasing what's missing,</text>
<text x="84" y="635" font-size="22" fill="#333333">then redoing the work</text>
<rect x="80" y="651" width="315" height="40" rx="20" fill="#61D8FE"/><text x="237" y="679" font-size="22" font-weight="700" fill="#0D1117" text-anchor="middle">AI signal: strong</text>
<rect x="435" y="455" width="355" height="250" rx="18" fill="#E9ECEF" stroke="#E9ECEF" stroke-width="3"/>
<text x="459" y="499" font-size="24" font-weight="700" fill="#5B6470">06</text>
<text x="459" y="537" font-size="30" font-weight="800" fill="#0D1117">Over-processing</text>
<text x="459" y="607" font-size="22" fill="#333333">Unread reports, triple</text>
<text x="459" y="635" font-size="22" fill="#333333">reviews, polished memos</text>
<rect x="455" y="651" width="315" height="40" rx="20" fill="#1A184C"/><text x="612" y="679" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Delete it first</text>
<rect x="810" y="455" width="355" height="250" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
<text x="834" y="499" font-size="24" font-weight="700" fill="#5B6470">07</text>
<text x="834" y="537" font-size="30" font-weight="800" fill="#0D1117">Context</text>
<text x="834" y="571" font-size="30" font-weight="800" fill="#0D1117">switching</text>
<text x="834" y="607" font-size="22" fill="#333333">Ten queues open at once,</text>
<text x="834" y="635" font-size="22" fill="#333333">attention in pieces</text>
<rect x="830" y="651" width="315" height="40" rx="20" fill="#FFFFFF" stroke="#61D8FE" stroke-width="3"/><text x="987" y="679" font-size="22" font-weight="700" fill="#0D1117" text-anchor="middle">AI signal: medium</text>
<rect x="1185" y="455" width="355" height="250" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
<text x="1209" y="499" font-size="24" font-weight="700" fill="#5B6470">08</text>
<text x="1209" y="537" font-size="30" font-weight="800" fill="#0D1117">Unused</text>
<text x="1209" y="571" font-size="30" font-weight="800" fill="#0D1117">judgment</text>
<text x="1209" y="607" font-size="22" fill="#333333">Experts spending the week</text>
<text x="1209" y="635" font-size="22" fill="#333333">on clerical work</text>
<rect x="1205" y="651" width="315" height="40" rx="20" fill="#544AE9"/><text x="1362" y="679" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">The prize: free the expert</text>
<rect x="60" y="760" width="8" height="56" fill="#61D8FE"/>
<text x="90" y="798" font-size="32" font-weight="700" fill="#0D1117">Automate over-processing and you don't remove waste. You make it faster.</text>
<text x="1540" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>