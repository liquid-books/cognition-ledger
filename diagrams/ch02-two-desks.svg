<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="105" font-size="44" font-weight="800" fill="#0D1117">The hours land on one desk; the money sits on another</text>
  <text x="80" y="150" font-size="26" fill="#5B6470">Why AI savings vanish in organizations full of capable people</text>

  <rect x="80" y="200" width="480" height="440" rx="22" fill="#FF5CAD"/>
  <text x="115" y="250" font-size="22" font-weight="800" fill="#0D1117" letter-spacing="2">WHO GETS THE TIME</text>
  <text x="115" y="305" font-size="40" font-weight="800" fill="#0D1117">The employee</text>
  <g font-size="26" fill="#0D1117">
    <text x="115" y="380">Feels a lighter week</text>
    <text x="115" y="440">Can't cancel a contract</text>
    <text x="115" y="490">Can't drop a planned hire</text>
    <text x="115" y="540">Can't change a budget</text>
  </g>

  <rect x="600" y="200" width="400" height="440" rx="22" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="3" stroke-dasharray="12 10"/>
  <g text-anchor="middle">
    <text x="800" y="250" font-size="22" font-weight="800" fill="#5B6470" letter-spacing="2">THE GAP</text>
    <text x="800" y="320" font-size="34" font-weight="800" fill="#0D1117">Nobody owns</text>
    <text x="800" y="362" font-size="34" font-weight="800" fill="#0D1117">the translation</text>
    <text x="800" y="450" font-size="24" fill="#5B6470">Vendor surveys</text>
    <text x="800" y="482" font-size="24" fill="#5B6470">measure the left.</text>
    <text x="800" y="550" font-size="24" fill="#5B6470">Finance audits</text>
    <text x="800" y="582" font-size="24" fill="#5B6470">the right.</text>
  </g>

  <rect x="1040" y="200" width="480" height="440" rx="22" fill="#544AE9"/>
  <text x="1075" y="250" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="2">WHO OWNS THE MONEY</text>
  <text x="1075" y="305" font-size="40" font-weight="800" fill="#FFFFFF">The budget owner</text>
  <g font-size="26" fill="#FFFFFF">
    <text x="1075" y="380">Sees the same payroll</text>
    <text x="1075" y="440">Can end overtime and temps</text>
    <text x="1075" y="490">Can drop a planned hire</text>
    <text x="1075" y="540">Can move hours to revenue</text>
  </g>

  <text x="800" y="700" font-size="26" fill="#333333" text-anchor="middle">The bridge is a decision: every freed hour gets a destination, an owner and a date.</text>

  <rect x="80" y="768" width="8" height="56" fill="#61D8FE"/>
  <text x="110" y="806" font-size="34" font-weight="700" fill="#0D1117">Only someone who owns a budget line can turn an hour into money.</text>
  <text x="1520" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
