<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="1600" height="1200" fill="#FFFFFF"/>
<text x="80" y="100" font-size="48" font-weight="800" fill="#0D1117">Ten principles, one idea: every hour needs a decision</text>
<text x="80" y="150" font-size="26" fill="#5B6470">The rules of the Cognition Ledger, in the order a ticket meets them. None names a tool.</text>
<rect x="80" y="190" width="700" height="140" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
<rect x="80" y="190" width="96" height="140" rx="18" fill="#1A184C"/><rect x="140" y="190" width="36" height="140" fill="#1A184C"/>
<text x="128" y="276" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="760" y="226" font-size="22" font-weight="700" fill="#5B6470" text-anchor="end" letter-spacing="1.5">EVERY MOVE</text>
<text x="202" y="266" font-size="29" font-weight="800" fill="#0D1117">Decisions turn time into money.</text>
<text x="202" y="306" font-size="23" fill="#333333">AI frees hours. Only a decision banks them.</text>
<rect x="80" y="348" width="700" height="140" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
<rect x="80" y="348" width="96" height="140" rx="18" fill="#61D8FE"/><rect x="140" y="348" width="36" height="140" fill="#61D8FE"/>
<text x="128" y="434" font-size="44" font-weight="800" fill="#0D1117" text-anchor="middle">2</text>
<text x="760" y="384" font-size="22" font-weight="700" fill="#5B6470" text-anchor="end" letter-spacing="1.5">MAP</text>
<text x="202" y="424" font-size="29" font-weight="800" fill="#0D1117">See the work before you speed it.</text>
<text x="202" y="464" font-size="23" fill="#333333">Delete, simplify, then automate.</text>
<rect x="80" y="506" width="700" height="140" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
<rect x="80" y="506" width="96" height="140" rx="18" fill="#61D8FE"/><rect x="140" y="506" width="36" height="140" fill="#61D8FE"/>
<text x="128" y="592" font-size="44" font-weight="800" fill="#0D1117" text-anchor="middle">3</text>
<text x="760" y="542" font-size="22" font-weight="700" fill="#5B6470" text-anchor="end" letter-spacing="1.5">SORT</text>
<text x="202" y="582" font-size="29" font-weight="800" fill="#0D1117">Earn your way to autonomy.</text>
<text x="202" y="622" font-size="23" fill="#333333">Rules, then packaged expertise, then agents.</text>
<rect x="80" y="664" width="700" height="140" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
<rect x="80" y="664" width="96" height="140" rx="18" fill="#FF5CAD"/><rect x="140" y="664" width="36" height="140" fill="#FF5CAD"/>
<text x="128" y="750" font-size="44" font-weight="800" fill="#0D1117" text-anchor="middle">4</text>
<text x="760" y="700" font-size="22" font-weight="700" fill="#5B6470" text-anchor="end" letter-spacing="1.5">SIZE</text>
<text x="202" y="740" font-size="29" font-weight="800" fill="#0D1117">Measure the work, not the memory.</text>
<text x="202" y="780" font-size="23" fill="#333333">Time at least 20 real units.</text>
<rect x="80" y="822" width="700" height="140" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
<rect x="80" y="822" width="96" height="140" rx="18" fill="#FF5CAD"/><rect x="140" y="822" width="36" height="140" fill="#FF5CAD"/>
<text x="128" y="908" font-size="44" font-weight="800" fill="#0D1117" text-anchor="middle">5</text>
<text x="760" y="858" font-size="22" font-weight="700" fill="#5B6470" text-anchor="end" letter-spacing="1.5">SIZE · SHIP</text>
<text x="202" y="898" font-size="29" font-weight="800" fill="#0D1117">The reviewer's minutes count.</text>
<text x="202" y="938" font-size="23" fill="#333333">Review and oversight belong in the new time.</text>
<rect x="820" y="190" width="700" height="140" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
<rect x="820" y="190" width="96" height="140" rx="18" fill="#544AE9"/><rect x="880" y="190" width="36" height="140" fill="#544AE9"/>
<text x="868" y="276" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="1500" y="226" font-size="22" font-weight="700" fill="#5B6470" text-anchor="end" letter-spacing="1.5">SIZE</text>
<text x="942" y="266" font-size="29" font-weight="800" fill="#0D1117">A possibility is not a payment.</text>
<text x="942" y="306" font-size="23" fill="#333333">Theoretical value is never called savings.</text>
<rect x="820" y="348" width="700" height="140" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
<rect x="820" y="348" width="96" height="140" rx="18" fill="#544AE9"/><rect x="880" y="348" width="36" height="140" fill="#544AE9"/>
<text x="868" y="434" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle">7</text>
<text x="1500" y="384" font-size="22" font-weight="700" fill="#5B6470" text-anchor="end" letter-spacing="1.5">BANK</text>
<text x="942" y="424" font-size="29" font-weight="800" fill="#0D1117">Every hour gets a job, or a red flag.</text>
<text x="942" y="464" font-size="23" fill="#333333">Lever, owner and date, or it shows as Leak.</text>
<rect x="820" y="506" width="700" height="140" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
<rect x="820" y="506" width="96" height="140" rx="18" fill="#544AE9"/><rect x="880" y="506" width="36" height="140" fill="#544AE9"/>
<text x="868" y="592" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle">8</text>
<text x="1500" y="542" font-size="22" font-weight="700" fill="#5B6470" text-anchor="end" letter-spacing="1.5">BANK</text>
<text x="942" y="582" font-size="29" font-weight="800" fill="#0D1117">Whoever's budget moves signs first.</text>
<text x="942" y="622" font-size="23" fill="#333333">The Hour Budget is signed before build.</text>
<rect x="820" y="664" width="700" height="140" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
<rect x="820" y="664" width="96" height="140" rx="18" fill="#544AE9"/><rect x="880" y="664" width="36" height="140" fill="#544AE9"/>
<text x="868" y="750" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle">9</text>
<text x="1500" y="700" font-size="22" font-weight="700" fill="#5B6470" text-anchor="end" letter-spacing="1.5">PROVE</text>
<text x="942" y="740" font-size="29" font-weight="800" fill="#0D1117">Finance holds the pen.</text>
<text x="942" y="780" font-size="23" fill="#333333">Only CFO-verified value counts as realized.</text>
<rect x="820" y="822" width="700" height="140" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
<rect x="820" y="822" width="96" height="140" rx="18" fill="#544AE9"/><rect x="880" y="822" width="36" height="140" fill="#544AE9"/>
<text x="868" y="908" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle">10</text>
<text x="1500" y="858" font-size="22" font-weight="700" fill="#5B6470" text-anchor="end" letter-spacing="1.5">PROVE</text>
<text x="942" y="898" font-size="29" font-weight="800" fill="#0D1117">Three numbers, side by side, always.</text>
<text x="942" y="938" font-size="23" fill="#333333">Theoretical, projected, realized. Never added.</text>
<rect x="80" y="1018" width="8" height="56" fill="#61D8FE"/>
<text x="110" y="1056" font-size="32" font-weight="700" fill="#0D1117">Every principle is a decision with a name on it.</text>
<text x="1520" y="1160" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>