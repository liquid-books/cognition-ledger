<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6470"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#61D8FE"/></marker></defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="80" y="100" font-size="48" font-weight="800" fill="#0D1117" text-anchor="start" >Bank the hours in this order, and cuts come last</text>
<text x="80" y="146" font-size="26" font-weight="400" fill="#5B6470" text-anchor="start" >Most organizations that bank AI time well work down this list before anyone's role is at risk.</text>
<rect x="80" y="200" width="1440" height="92" rx="14" fill="#61D8FE" />
<text x="110" y="258" font-size="40" font-weight="800" fill="#0D1117" text-anchor="start" >1</text>
<text x="170" y="240" font-size="28" font-weight="700" fill="#0D1117" text-anchor="start" >Avoid</text>
<text x="170" y="274" font-size="22" font-weight="400" fill="#0D1117" text-anchor="start" >Absorb growth and attrition without the planned hires</text>
<text x="1490" y="258" font-size="24" font-weight="700" fill="#0D1117" text-anchor="end" >Nobody leaves. The hiring plan shrinks.</text>
<rect x="140" y="306" width="1380" height="92" rx="14" fill="#61D8FE" />
<text x="170" y="364" font-size="40" font-weight="800" fill="#0D1117" text-anchor="start" >2</text>
<text x="230" y="346" font-size="28" font-weight="700" fill="#0D1117" text-anchor="start" >Cut external spend</text>
<text x="230" y="380" font-size="22" font-weight="400" fill="#0D1117" text-anchor="start" >Overtime, temps, contractors, outsourced services</text>
<text x="1490" y="364" font-size="24" font-weight="700" fill="#0D1117" text-anchor="end" >Spend leaves. Your people stay.</text>
<rect x="200" y="412" width="1320" height="92" rx="14" fill="#544AE9" />
<text x="230" y="470" font-size="40" font-weight="800" fill="#FFFFFF" text-anchor="start" >3</text>
<text x="290" y="452" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start" >Grow</text>
<text x="290" y="486" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="start" >Move hours to selling, retention and new offers</text>
<text x="1490" y="470" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="end" >People do more valuable work.</text>
<rect x="260" y="518" width="1260" height="92" rx="14" fill="#544AE9" />
<text x="290" y="576" font-size="40" font-weight="800" fill="#FFFFFF" text-anchor="start" >4</text>
<text x="350" y="558" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start" >Fix, Speed, Invest</text>
<text x="350" y="592" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="start" >Fewer errors, faster cash, funded strategic projects</text>
<text x="1490" y="576" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="end" >Value that doesn't need anyone to go.</text>
<rect x="320" y="624" width="1200" height="92" rx="14" fill="#FFFFFF" stroke="#FF5CAD" stroke-width="4"/>
<text x="350" y="682" font-size="40" font-weight="800" fill="#0D1117" text-anchor="start" >5</text>
<text x="410" y="664" font-size="28" font-weight="700" fill="#0D1117" text-anchor="start" >Only then: fewer roles</text>
<text x="410" y="698" font-size="22" font-weight="400" fill="#0D1117" text-anchor="start" >Decided openly, with notice, retraining and fair terms</text>
<text x="1490" y="682" font-size="24" font-weight="700" fill="#0D1117" text-anchor="end" >A last resort, never a hidden default.</text>
<rect x="80" y="750" width="8" height="52" rx="0" fill="#61D8FE" />
<text x="110" y="786" font-size="30" font-weight="700" fill="#0D1117" text-anchor="start" >Start at the top and most of your people's jobs change instead of disappearing.</text>
<text x="1520" y="866" font-size="22" font-weight="400" fill="#5B6470" text-anchor="end" >The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
