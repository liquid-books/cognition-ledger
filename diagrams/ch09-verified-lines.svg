<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#E9ECEF"/><line x1="0" y1="0" x2="0" y2="14" stroke="#ADB5BD" stroke-width="5"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="100" font-size="48" font-weight="800" fill="#0D1117">Every verified dollar has a name and a document</text>
  <text x="80" y="146" font-size="26" fill="#5B6470">How Brightwater's $288,463 of realized value was built, line by line</text>

  <!-- stacked bar: 160..1260, scale 0.003813 -->
  <rect x="160" y="195" width="615" height="90" fill="#544AE9"/>
  <rect x="775" y="195" width="254" height="90" fill="#544AE9" fill-opacity="0.8"/>
  <rect x="1029" y="195" width="35" height="90" fill="#544AE9" fill-opacity="0.6"/>
  <rect x="1064" y="195" width="81" height="90" fill="#1A184C"/>
  <rect x="1145" y="195" width="115" height="90" fill="#544AE9" fill-opacity="0.45"/>
  <g stroke="#FFFFFF" stroke-width="3"><line x1="775" y1="195" x2="775" y2="285"/><line x1="1029" y1="195" x2="1029" y2="285"/><line x1="1064" y1="195" x2="1064" y2="285"/><line x1="1145" y1="195" x2="1145" y2="285"/></g>
  <text x="467" y="252" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">$161,192</text>
  <text x="902" y="252" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">$66,552</text>
  <text x="1280" y="235" font-size="22" fill="#5B6470">realized</text>
  <text x="1280" y="270" font-size="34" font-weight="800" fill="#544AE9">$288,463</text>

  <!-- legend rows -->
  <g font-size="24" fill="#333333">
    <rect x="160" y="335" width="34" height="28" rx="4" fill="#544AE9"/>
    <text x="210" y="358"><tspan font-weight="800" fill="#0D1117">Quote builder · Avoid</tspan> · four requisitions struck (two quarters)</text>
    <text x="1260" y="358" text-anchor="end" font-weight="800" fill="#544AE9">$161,192</text>

    <rect x="160" y="385" width="34" height="28" rx="4" fill="#544AE9" fill-opacity="0.8"/>
    <text x="210" y="408"><tspan font-weight="800" fill="#0D1117">PO intake agent · Cut</tspan> · two temp contracts ended (two quarters)</text>
    <text x="1260" y="408" text-anchor="end" font-weight="800" fill="#544AE9">$66,552</text>

    <rect x="160" y="435" width="34" height="28" rx="4" fill="#544AE9" fill-opacity="0.6"/>
    <text x="210" y="458"><tspan font-weight="800" fill="#0D1117">PO intake agent · Cut</tspan> · overtime vs the same months last year</text>
    <text x="1260" y="458" text-anchor="end" font-weight="800" fill="#544AE9">$9,300</text>

    <rect x="160" y="485" width="34" height="28" rx="4" fill="#1A184C"/>
    <text x="210" y="508"><tspan font-weight="800" fill="#0D1117">Dispute agent · Cut</tspan> · contractor not renewed (one quarter)</text>
    <text x="1260" y="508" text-anchor="end" font-weight="800" fill="#544AE9">$21,319</text>

    <rect x="160" y="535" width="34" height="28" rx="4" fill="#544AE9" fill-opacity="0.45"/>
    <text x="210" y="558"><tspan font-weight="800" fill="#0D1117">Dispute agent · Fix</tspan> · credit-memo totals vs baseline (one quarter)</text>
    <text x="1260" y="558" text-anchor="end" font-weight="800" fill="#544AE9">$30,100</text>
  </g>

  <line x1="160" y1="595" x2="1520" y2="595" stroke="#E9ECEF" stroke-width="3"/>

  <!-- believed but not counted -->
  <rect x="160" y="625" width="132" height="60" rx="6" fill="url(#hatch)"/>
  <text x="310" y="650" font-size="24" font-weight="800" fill="#0D1117">Quote builder · Grow · $33,500 recorded</text>
  <text x="310" y="682" font-size="22" fill="#5B6470">Lapsed customers ordering again, but no control comparison yet</text>
  <text x="1520" y="650" font-size="24" font-weight="800" fill="#0D1117" text-anchor="end">$0 counted</text>

  <rect x="80" y="760" width="8" height="52" fill="#544AE9"/>
  <text x="110" y="796" font-size="28" font-weight="700" fill="#0D1117">$33,500 the company believes in and can't count: the protocol working, not failing.</text>
  <text x="1520" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
