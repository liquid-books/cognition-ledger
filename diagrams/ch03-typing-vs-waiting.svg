<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="105" font-size="46" font-weight="800" fill="#0D1117">Cut the typing by 57% and the customer notices 2%</text>
  <text x="80" y="150" font-size="26" fill="#5B6470">Lead time for one Brightwater quote, in working minutes, drawn to the same scale</text>

  <text x="80" y="215" font-size="26" font-weight="800" fill="#0D1117">Today</text>
  <rect x="80" y="232" width="1440" height="70" rx="10" fill="#E9ECEF"/>
  <rect x="80" y="232" width="52" height="70" rx="6" fill="#FF5CAD"/>
  <text x="150" y="276" font-size="24" fill="#333333">35 min of work</text>
  <text x="1495" y="276" font-size="26" font-weight="800" fill="#333333" text-anchor="end">960 min (two days)</text>

  <text x="80" y="360" font-size="26" font-weight="800" fill="#0D1117">Quote Skill on the typing only: 35 minutes down to 15</text>
  <rect x="80" y="377" width="1410" height="70" rx="10" fill="#E9ECEF"/>
  <rect x="80" y="377" width="23" height="70" rx="6" fill="#61D8FE"/>
  <text x="120" y="421" font-size="24" fill="#333333">15 min of work, review included</text>
  <text x="1465" y="421" font-size="26" font-weight="800" fill="#333333" text-anchor="end">940 min: 2% faster</text>

  <text x="80" y="505" font-size="26" font-weight="800" fill="#0D1117">Skill plus a redesign of the waits</text>
  <rect x="80" y="522" width="180" height="70" rx="10" fill="#E9ECEF"/>
  <rect x="80" y="522" width="23" height="70" rx="6" fill="#61D8FE"/>
  <text x="285" y="566" font-size="30" font-weight="800" fill="#544AE9">120 min (two hours): 88% faster</text>
  <g font-size="24" fill="#333333">
    <text x="80" y="645">Completeness checked the moment a request lands · picked up within the hour</text>
    <text x="80" y="680">Pricing rules inside the Skill, so only true exceptions wait for a manager</text>
  </g>

  <rect x="80" y="768" width="8" height="56" fill="#61D8FE"/>
  <text x="110" y="806" font-size="34" font-weight="700" fill="#0D1117">AI's biggest prize is often the waiting, not the typing.</text>
  <text x="1520" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
