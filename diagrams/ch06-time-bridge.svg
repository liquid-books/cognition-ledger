<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="60" y="95" font-size="46" font-weight="800" fill="#0D1117">From 35 minutes to 10,246 hours, review left in</text>
  <text x="60" y="140" font-size="26" fill="#5B6470">Net hours freed per year for Brightwater's quote Skill, one honest step at a time</text>

  <!-- bars: scale 12px per minute, baseline 680 -->
  <text x="60" y="215" font-size="22" font-weight="700" fill="#5B6470">MINUTES PER QUOTE</text>
  <rect x="80" y="260" width="170" height="420" fill="#ADB5BD"/>
  <text x="165" y="320" font-size="48" font-weight="800" fill="#0D1117" text-anchor="middle">35</text>
  <text x="165" y="715" font-size="22" font-weight="700" fill="#0D1117" text-anchor="middle">Before</text>
  <text x="165" y="743" font-size="21" fill="#5B6470" text-anchor="middle">24 quotes timed</text>

  <rect x="300" y="500" width="170" height="180" fill="#61D8FE"/>
  <text x="385" y="560" font-size="48" font-weight="800" fill="#0D1117" text-anchor="middle">15</text>
  <text x="385" y="610" font-size="21" font-weight="700" fill="#0D1117" text-anchor="middle">AI draft</text><text x="385" y="640" font-size="21" font-weight="700" fill="#0D1117" text-anchor="middle">+ review</text>
  <text x="385" y="715" font-size="22" font-weight="700" fill="#0D1117" text-anchor="middle">After</text>
  <text x="385" y="743" font-size="21" fill="#5B6470" text-anchor="middle">20 pilot quotes</text>

  <rect x="300" y="260" width="170" height="240" fill="none" stroke="#61D8FE" stroke-width="4" stroke-dasharray="12 8"/>
  <text x="385" y="370" font-size="40" font-weight="800" fill="#0D1117" text-anchor="middle">20</text>
  <text x="385" y="405" font-size="22" fill="#0D1117" text-anchor="middle">saved</text>
  <line x1="60" y1="680" x2="500" y2="680" stroke="#5B6470" stroke-width="3"/>

  <!-- chain -->
  <g font-size="26">
    <rect x="580" y="215" width="960" height="110" rx="18" fill="#F2FCFF" stroke="#61D8FE" stroke-width="3"/>
    <text x="610" y="262" font-weight="700" fill="#0D1117">20 minutes saved ÷ 60 × 660 quotes a week</text>
    <text x="610" y="302" font-size="22" fill="#5B6470">Volume is a four-week median, not a hopeful forecast</text>
    <text x="1510" y="285" font-size="36" font-weight="800" fill="#0D1117" text-anchor="end">220 h/wk</text>

    <rect x="580" y="345" width="960" height="110" rx="18" fill="#FFFFFF" stroke="#FF5CAD" stroke-width="3"/>
    <text x="610" y="392" font-weight="700" fill="#0D1117">minus 2 hours a week of oversight</text>
    <text x="610" y="432" font-size="22" fill="#5B6470">Someone keeps the price file the Skill reads up to date</text>
    <text x="1510" y="415" font-size="36" font-weight="800" fill="#0D1117" text-anchor="end">218 h/wk</text>

    <rect x="580" y="475" width="960" height="110" rx="18" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="3"/>
    <text x="610" y="522" font-weight="700" fill="#0D1117">× 47 working weeks</text>
    <text x="610" y="562" font-size="22" fill="#5B6470">Holidays and vacation are already out</text>
    <text x="1510" y="545" font-size="36" font-weight="800" fill="#0D1117" text-anchor="end">× 47</text>

    <rect x="580" y="605" width="960" height="120" rx="18" fill="#61D8FE"/>
    <text x="610" y="657" font-size="28" font-weight="800" fill="#0D1117">Net hours freed per year</text>
    <text x="610" y="697" font-size="22" fill="#0D1117">Capacity, not cash. Not one dollar yet.</text>
    <text x="1510" y="685" font-size="56" font-weight="800" fill="#0D1117" text-anchor="end">10,246</text>
  </g>

  <rect x="60" y="780" width="8" height="54" fill="#61D8FE"/>
  <text x="90" y="818" font-size="30" font-weight="700" fill="#0D1117">Leave out the review or the upkeep and the number grows, until the CFO checks.</text>
  <text x="1540" y="875" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
