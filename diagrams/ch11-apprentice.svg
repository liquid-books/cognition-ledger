<text x="990" y="293" font-size="22" font-weight="400" fill="#0D1117" text-anchor="middle" >spots patterns</text>
<line x1="1154" y1="265" x2="1186" y2="265" stroke="#5B6470" stroke-width="4" marker-end="url(#ah)"/><rect x="1190" y="205" width="320" height="120" rx="14" fill="#FF5CAD" />
<text x="1350" y="257" font-size="28" font-weight="700" fill="#0D1117" text-anchor="middle" >Expert</text>
<text x="1350" y="293" font-size="22" font-weight="400" fill="#0D1117" text-anchor="middle" >judges the hard cases</text>
<text x="80" y="427" font-size="30" font-weight="700" fill="#0D1117" text-anchor="start" >The trap</text>
<text x="80" y="461" font-size="22" font-weight="400" fill="#5B6470" text-anchor="start" >Automate the routine</text>
<text x="80" y="489" font-size="22" font-weight="400" fill="#5B6470" text-anchor="start" >and stop there</text>
