<text x="630" y="293" font-size="22" font-weight="400" fill="#0D1117" text-anchor="middle" >does routine cases</text>
<line x1="794" y1="265" x2="826" y2="265" stroke="#5B6470" stroke-width="4" marker-end="url(#ah)"/><rect x="830" y="205" width="320" height="120" rx="14" fill="#E9ECEF" />
