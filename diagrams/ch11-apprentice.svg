<text x="80" y="100" font-size="48" font-weight="800" fill="#0D1117" text-anchor="start" >Automate the apprentice work, lose your next experts</text>
<text x="80" y="146" font-size="26" font-weight="400" fill="#5B6470" text-anchor="start" >Clerical work was never just clerical. It was how juniors learned the judgment you now need to check the AI.</text>
