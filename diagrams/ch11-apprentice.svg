<text x="990" y="463" font-size="22" font-weight="400" fill="#5B6470" text-anchor="middle" >never forms</text>
<text x="1170" y="447" font-size="32" font-weight="800" fill="#5B6470" text-anchor="middle" >x</text>
<rect x="1190" y="375" width="320" height="120" rx="14" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="3" stroke-dasharray="10 8"/>
<text x="1350" y="427" font-size="28" font-weight="700" fill="#5B6470" text-anchor="middle" >Expert</text>
<text x="1350" y="463" font-size="22" font-weight="400" fill="#5B6470" text-anchor="middle" >retires. Who checks the AI?</text>
<text x="80" y="597" font-size="30" font-weight="700" fill="#0D1117" text-anchor="start" >The redesign</text>
<text x="80" y="631" font-size="22" font-weight="400" fill="#5B6470" text-anchor="start" >Juniors learn by</text>
