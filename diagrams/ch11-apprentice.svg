<text x="80" y="291" font-size="22" font-weight="400" fill="#5B6470" text-anchor="start" >Juniors learn by doing</text>
<text x="80" y="319" font-size="22" font-weight="400" fill="#5B6470" text-anchor="start" >the clerical work</text>
