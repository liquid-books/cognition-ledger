<text x="630" y="463" font-size="22" font-weight="400" fill="#5B6470" text-anchor="middle" >no routine left to learn on</text>
<text x="810" y="447" font-size="32" font-weight="800" fill="#5B6470" text-anchor="middle" >x</text>
