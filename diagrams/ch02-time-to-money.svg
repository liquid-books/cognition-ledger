<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="105" font-size="46" font-weight="800" fill="#0D1117">AI takes the first step. Management takes the rest.</text>
  <text x="80" y="150" font-size="26" fill="#5B6470">How an hour freed by AI becomes money a CFO can find</text>

  <g text-anchor="middle">
    <rect x="80" y="240" width="300" height="200" rx="20" fill="#61D8FE"/>
    <text x="230" y="320" font-size="34" font-weight="800" fill="#0D1117">Hours freed</text>
    <text x="230" y="362" font-size="24" fill="#0D1117">A Skill or agent</text>
    <text x="230" y="394" font-size="24" fill="#0D1117">does the work faster</text>

    <rect x="460" y="240" width="300" height="200" rx="20" fill="#FF5CAD"/>
    <text x="610" y="320" font-size="34" font-weight="800" fill="#0D1117">A decision</text>
    <text x="610" y="362" font-size="24" fill="#0D1117">An owner names</text>
    <text x="610" y="394" font-size="24" fill="#0D1117">where the hours go</text>

    <rect x="840" y="240" width="300" height="200" rx="20" fill="#FFFFFF" stroke="#544AE9" stroke-width="4"/>
    <text x="990" y="320" font-size="34" font-weight="800" fill="#0D1117">A book change</text>
    <text x="990" y="362" font-size="24" fill="#333333">A contract ends, a hire</text>
    <text x="990" y="394" font-size="24" fill="#333333">is dropped, sales rise</text>

    <rect x="1220" y="240" width="300" height="200" rx="20" fill="#544AE9"/>
    <text x="1370" y="320" font-size="34" font-weight="800" fill="#FFFFFF">Verified money</text>
    <text x="1370" y="362" font-size="24" fill="#FFFFFF">Finance checks the</text>
    <text x="1370" y="394" font-size="24" fill="#FFFFFF">evidence and signs</text>
  </g>
  <g stroke="#5B6470" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M390 340 H450 M436 326 L450 340 L436 354"/>
    <path d="M770 340 H830 M816 326 L830 340 L816 354"/>
    <path d="M1150 340 H1210 M1196 326 L1210 340 L1196 354"/>
  </g>

  <path d="M80 490 V510 H380 V490" stroke="#61D8FE" stroke-width="5" fill="none"/>
  <text x="230" y="555" font-size="26" font-weight="800" fill="#0D1117" text-anchor="middle">What the tool does</text>
  <path d="M460 490 V510 H1520 V490" stroke="#544AE9" stroke-width="5" fill="none"/>
  <text x="990" y="555" font-size="26" font-weight="800" fill="#544AE9" text-anchor="middle">What management does</text>

  <text x="80" y="650" font-size="26" fill="#333333">Most AI programs measure the first box, report it as the fourth, and skip the two in between.</text>

  <rect x="80" y="768" width="8" height="56" fill="#61D8FE"/>
  <text x="110" y="806" font-size="34" font-weight="700" fill="#0D1117">Time turns into money only through a decision and a change on the books.</text>
  <text x="1520" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
