<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B6470"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="100" font-size="44" font-weight="800" fill="#0D1117">Closing disputes 3 days sooner frees $3.45 million</text>
  <text x="80" y="146" font-size="26" fill="#5B6470">Brightwater's dispute triage agent (OTC-04), priced through the Speed lever</text>

  <!-- four blocks: w 290, gaps 93 -->
  <rect x="80" y="210" width="290" height="210" rx="18" fill="#E9ECEF"/>
  <text x="225" y="300" font-size="44" font-weight="800" fill="#0D1117" text-anchor="middle">$420M</text>
  <text x="225" y="345" font-size="24" fill="#333333" text-anchor="middle">revenue a year</text>

  <rect x="463" y="210" width="290" height="210" rx="18" fill="#E9ECEF"/>
  <text x="608" y="300" font-size="44" font-weight="800" fill="#0D1117" text-anchor="middle">$1.15M</text>
  <text x="608" y="345" font-size="24" fill="#333333" text-anchor="middle">of sales per day</text>

  <rect x="846" y="210" width="290" height="210" rx="18" fill="#544AE9"/>
  <text x="991" y="300" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle">$3.45M</text>
  <text x="991" y="345" font-size="24" fill="#FFFFFF" text-anchor="middle">cash in the bank,</text>
  <text x="991" y="377" font-size="24" fill="#FFFFFF" text-anchor="middle">released once</text>

  <rect x="1229" y="210" width="291" height="210" rx="18" fill="#1A184C"/>
  <text x="1374" y="300" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle">$241,644</text>
  <text x="1374" y="345" font-size="24" fill="#FFFFFF" text-anchor="middle">a year, every year</text>

  <!-- operators -->
  <g font-size="28" font-weight="800" fill="#0D1117" text-anchor="middle">
    <text x="416" y="290">÷ 365</text>
    <text x="799" y="290">× 3</text>
    <text x="1182" y="290">× 7%</text>
  </g>
  <g font-size="22" fill="#5B6470" text-anchor="middle">
    <text x="416" y="368">days</text>
    <text x="799" y="368">days</text>
    <text x="1182" y="368">cost of</text>
    <text x="1182" y="394">capital</text>
  </g>
  <g stroke="#5B6470" stroke-width="3">
    <line x1="380" y1="318" x2="452" y2="318" marker-end="url(#ah)"/>
    <line x1="763" y1="318" x2="835" y2="318" marker-end="url(#ah)"/>
    <line x1="1146" y1="318" x2="1218" y2="318" marker-end="url(#ah)"/>
  </g>

  <!-- zero hours band -->
  <rect x="80" y="475" width="560" height="230" rx="18" fill="#FFFFFF" stroke="#61D8FE" stroke-width="4"/>
  <text x="110" y="530" font-size="26" font-weight="700" fill="#333333">Hours saved by this line</text>
  <text x="110" y="640" font-size="110" font-weight="800" fill="#0D1117">0</text>
  <text x="200" y="640" font-size="24" fill="#5B6470">The value came from</text>
  <text x="200" y="672" font-size="24" fill="#5B6470">wait time, not typing time</text>

  <rect x="680" y="475" width="840" height="230" rx="18" fill="#E9ECEF"/>
  <text x="710" y="528" font-size="26" font-weight="800" fill="#0D1117">How finance reads it</text>
  <text x="710" y="572" font-size="24" fill="#333333">DSO (days sales outstanding): days of sales still waiting</text>
  <text x="710" y="604" font-size="24" fill="#333333">to be collected. Disputed invoices are the slowest.</text>
  <text x="710" y="648" font-size="24" fill="#333333">Priced at the cost of capital, never the loaded rate.</text>
  <text x="710" y="680" font-size="24" fill="#333333">Only the $241,644 goes in the Hour Budget.</text>

  <rect x="80" y="760" width="8" height="52" fill="#544AE9"/>
  <text x="110" y="796" font-size="30" font-weight="700" fill="#0D1117">The most valuable thing AI gives you may not be an hour at all.</text>
  <text x="1520" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
