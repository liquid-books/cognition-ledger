<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="60" y="95" font-size="48" font-weight="800" fill="#0D1117">Quality cuts both ways, and the ledger shows both</text>
  <text x="60" y="140" font-size="26" fill="#5B6470">Brightwater's dispute triage agent (OTC-04): cost of poor quality avoided, depending on the new error rate</text>

  <!-- formula -->
  <rect x="60" y="180" width="1480" height="90" rx="16" fill="#F1F3F5"/>
  <text x="800" y="238" font-size="28" font-weight="700" fill="#0D1117" text-anchor="middle">225 disputes a week × 47 weeks × (6% before − new error rate) × $310 per wrong credit</text>

  <!-- zero axis at x=800 ; scale: 131,130 -> 560px -->
  <line x1="800" y1="320" x2="800" y2="720" stroke="#0D1117" stroke-width="3"/>
  <text x="800" y="750" font-size="22" font-weight="700" fill="#5B6470" text-anchor="middle">$0</text>

  <!-- positive -->
  <rect x="800" y="345" width="560" height="140" fill="#544AE9"/>
  <text x="830" y="410" font-size="44" font-weight="800" fill="#FFFFFF">+$131,130 a year</text>
  <text x="830" y="455" font-size="24" fill="#FFFFFF">New error rate 2%, measured in the pilot</text>
  <text x="1380" y="400" font-size="24" font-weight="700" fill="#0D1117">Better</text>
  <text x="1380" y="430" font-size="22" fill="#5B6470">than the</text>
  <text x="1380" y="458" font-size="22" fill="#5B6470">person</text>

  <!-- negative (hypothetical) -->
  <rect x="520" y="545" width="280" height="140" fill="#ADB5BD"/>
  <text x="780" y="610" font-size="40" font-weight="800" fill="#0D1117" text-anchor="end">−$65,565</text>
  <text x="780" y="652" font-size="22" fill="#0D1117" text-anchor="end">if it were 8%</text>
  <text x="500" y="600" font-size="24" font-weight="700" fill="#0D1117" text-anchor="end">Worse than the person</text>
  <text x="500" y="630" font-size="22" fill="#5B6470" text-anchor="end">a what-if, not Brightwater's result:</text>
  <text x="500" y="658" font-size="22" fill="#5B6470" text-anchor="end">the same formula turns negative</text>

  <rect x="60" y="780" width="8" height="54" fill="#61D8FE"/>
  <text x="90" y="818" font-size="30" font-weight="700" fill="#0D1117">A faster process that makes more mistakes can cost more than it saves.</text>
  <text x="1540" y="875" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
