<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60" y="92" font-size="46" font-weight="800" fill="#0D1117">A Skill waits to be asked. An agent answers the door.</text>
<text x="60" y="135" font-size="26" fill="#5B6470">The two lasting ideas behind today's AI tools, side by side</text>
<rect x="380" y="170" width="570" height="600" rx="20" fill="#FFFFFF" stroke="#61D8FE" stroke-width="4"/>
<rect x="970" y="170" width="570" height="600" rx="20" fill="#61D8FE"/>
<text x="410" y="222" font-size="36" font-weight="800" fill="#0D1117">Packaged expertise</text>
<text x="410" y="258" font-size="24" font-weight="700" fill="#5B6470">today: a Skill</text>
<text x="1000" y="222" font-size="36" font-weight="800" fill="#0D1117">Autonomous cognition</text>
<text x="1000" y="258" font-size="24" font-weight="700" fill="#0D1117">today: an agent</text>
<line x1="60" y1="292" x2="1540" y2="292" stroke="#E9ECEF" stroke-width="2"/>
<text x="60" y="334" font-size="22" font-weight="700" fill="#5B6470">STARTED BY</text>
<text x="410" y="334" font-size="24" fill="#333333">A person who asks for it</text>
<text x="1000" y="334" font-size="24" fill="#0D1117">An event: an email lands,</text>
<text x="1000" y="364" font-size="24" fill="#0D1117">an invoice turns 60 days</text>
<line x1="60" y1="384" x2="1540" y2="384" stroke="#E9ECEF" stroke-width="2"/>
<text x="60" y="426" font-size="22" font-weight="700" fill="#5B6470">WORKS ON</text>
<text x="410" y="426" font-size="24" fill="#333333">One task, in one document</text>
<text x="410" y="456" font-size="24" fill="#333333">or conversation</text>
<text x="1000" y="426" font-size="24" fill="#0D1117">A whole job, across</text>
<text x="1000" y="456" font-size="24" fill="#0D1117">several systems, taking actions</text>
<line x1="60" y1="476" x2="1540" y2="476" stroke="#E9ECEF" stroke-width="2"/>
<text x="60" y="518" font-size="22" font-weight="700" fill="#5B6470">THE STEPS</text>
<text x="410" y="518" font-size="24" fill="#333333">Guided by written</text>
<text x="410" y="548" font-size="24" fill="#333333">instructions, the house way</text>
<text x="1000" y="518" font-size="24" fill="#0D1117">Chosen by the model,</text>
<text x="1000" y="548" font-size="24" fill="#0D1117">inside limits you set</text>
<line x1="60" y1="568" x2="1540" y2="568" stroke="#E9ECEF" stroke-width="2"/>
<text x="60" y="610" font-size="22" font-weight="700" fill="#5B6470">REVIEWED</text>
<text x="410" y="610" font-size="24" fill="#333333">A person checks</text>
<text x="410" y="640" font-size="24" fill="#333333">every output</text>
<text x="1000" y="610" font-size="24" fill="#0D1117">People approve at the</text>
<text x="1000" y="640" font-size="24" fill="#0D1117">checkpoints where risk is high</text>
<line x1="60" y1="660" x2="1540" y2="660" stroke="#E9ECEF" stroke-width="2"/>
<text x="60" y="702" font-size="22" font-weight="700" fill="#5B6470">THINK OF IT AS</text>
<text x="410" y="702" font-size="24" font-weight="700" fill="#333333">Your best person's know-how,</text>
<text x="410" y="732" font-size="24" font-weight="700" fill="#333333">written down once</text>
<text x="1000" y="702" font-size="24" font-weight="700" fill="#0D1117">A digital worker</text>
<text x="1000" y="732" font-size="24" font-weight="700" fill="#0D1117">for a whole job</text>
<rect x="60" y="800" width="8" height="54" fill="#61D8FE"/>
<text x="90" y="838" font-size="29" font-weight="700" fill="#0D1117">Whatever the names become, you'll still choose between these two.</text>
<text x="1540" y="885" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>