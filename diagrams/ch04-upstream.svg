<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="60" y="95" font-size="48" font-weight="800" fill="#0D1117">Disputes are born upstream</text>
  <text x="60" y="140" font-size="26" fill="#5B6470">Brightwater: errors made early in Order-to-Cash arrive later as disputes someone must untangle</text>

  <!-- upstream boxes -->
  <rect x="60" y="210" width="560" height="200" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
  <text x="95" y="262" font-size="32" font-weight="800" fill="#0D1117">Build quote</text>
  <text x="95" y="300" font-size="23" fill="#5B6470">660 quotes a week</text>
  <text x="95" y="368" font-size="54" font-weight="800" fill="#0D1117">8%</text>
  <text x="200" y="352" font-size="23" fill="#333333">revised after</text>
  <text x="200" y="380" font-size="23" fill="#333333">being sent</text>
  <rect x="405" y="330" width="185" height="50" rx="25" fill="#61D8FE"/>
  <text x="497" y="363" font-size="23" font-weight="700" fill="#0D1117" text-anchor="middle">pilot: 3%</text>

  <rect x="60" y="450" width="560" height="200" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
  <text x="95" y="502" font-size="32" font-weight="800" fill="#0D1117">Enter order from PO</text>
  <text x="95" y="540" font-size="23" fill="#5B6470">1,800 orders a week</text>
  <text x="95" y="608" font-size="54" font-weight="800" fill="#0D1117">4%</text>
  <text x="200" y="592" font-size="23" fill="#333333">need correcting</text>
  <text x="200" y="620" font-size="23" fill="#333333">downstream</text>
  <rect x="405" y="570" width="185" height="50" rx="25" fill="#61D8FE"/>
  <text x="497" y="603" font-size="23" font-weight="700" fill="#0D1117" text-anchor="middle">pilot: 1%</text>

  <!-- arrows converge -->
  <path d="M630,310 C760,310 760,430 880,430" fill="none" stroke="#ADB5BD" stroke-width="10"/>
  <path d="M630,550 C760,550 760,450 880,450" fill="none" stroke="#ADB5BD" stroke-width="10"/>
  <polygon points="880,418 915,440 880,462" fill="#ADB5BD"/>

  <!-- dispute pool -->
  <rect x="930" y="230" width="610" height="420" rx="22" fill="#1A184C"/>
  <text x="970" y="295" font-size="30" font-weight="700" fill="#FFFFFF">Resolve disputes</text>
  <text x="970" y="390" font-size="84" font-weight="800" fill="#FFFFFF">225</text>
  <text x="1150" y="372" font-size="26" fill="#FFFFFF">disputes</text>
  <text x="1150" y="402" font-size="26" fill="#FFFFFF">every week</text>
  <text x="970" y="470" font-size="26" fill="#FFFFFF">45 minutes of work each</text>
  <text x="970" y="512" font-size="26" fill="#FFFFFF">12 days waiting before anyone starts</text>
  <text x="970" y="554" font-size="26" fill="#FFFFFF">only 55% arrive with what's needed</text>
  <text x="970" y="612" font-size="22" fill="#ADB5BD">Mapped as pure waste: a dispute is rework.</text>

  <rect x="60" y="720" width="8" height="100" fill="#61D8FE"/>
  <text x="90" y="758" font-size="31" font-weight="700" fill="#0D1117">Every error removed upstream is a dispute nobody has to triage.</text>
  <text x="90" y="802" font-size="31" font-weight="700" fill="#0D1117">Fix the source before you automate the cleanup.</text>
  <text x="1540" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
