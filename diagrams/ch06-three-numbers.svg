<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="60" y="95" font-size="48" font-weight="800" fill="#0D1117">Every automation owes you three numbers</text>
  <text x="60" y="140" font-size="26" fill="#5B6470">Brightwater's quote Skill (OTC-01), measured on real quotes, the same way every use case is measured</text>

  <!-- TIME -->
  <rect x="60" y="190" width="460" height="520" rx="22" fill="#61D8FE"/>
  <text x="95" y="245" font-size="26" font-weight="700" fill="#0D1117">1 · TIME</text>
  <text x="95" y="350" font-size="76" font-weight="800" fill="#0D1117">10,246</text>
  <text x="95" y="395" font-size="28" font-weight="700" fill="#0D1117">hours freed a year</text>
  <text x="95" y="460" font-size="23" fill="#0D1117">35 → 15 minutes a quote,</text>
  <text x="95" y="490" font-size="23" fill="#0D1117">the person's review included,</text>
  <text x="95" y="520" font-size="23" fill="#0D1117">minus 2 hours a week of upkeep</text>
  <line x1="95" y1="570" x2="485" y2="570" stroke="#0D1117" stroke-width="2" opacity="0.3"/>
  <text x="95" y="615" font-size="23" fill="#0D1117">Lead time: 1.5 days → same day</text>
  <text x="95" y="665" font-size="22" font-weight="700" fill="#0D1117">Measured in hours</text>

  <!-- MONEY -->
  <rect x="570" y="190" width="460" height="520" rx="22" fill="#544AE9"/>
  <text x="605" y="245" font-size="26" font-weight="700" fill="#FFFFFF">2 · MONEY</text>
  <text x="605" y="350" font-size="76" font-weight="800" fill="#FFFFFF">$439,270</text>
  <text x="605" y="395" font-size="28" font-weight="700" fill="#FFFFFF">theoretical value a year</text>
  <text x="605" y="460" font-size="23" fill="#FFFFFF">10,246 hours × $42.87,</text>
  <text x="605" y="490" font-size="23" fill="#FFFFFF">the loaded hourly rate</text>
  <text x="605" y="520" font-size="23" fill="#FFFFFF">of the person doing it</text>
  <line x1="605" y1="570" x2="995" y2="570" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
  <text x="605" y="615" font-size="23" fill="#FFFFFF">Build $15,000 · run $9,000 a year</text>
  <text x="605" y="665" font-size="22" font-weight="700" fill="#FFFFFF">The size of the prize, not savings</text>

  <!-- QUALITY -->
  <rect x="1080" y="190" width="460" height="520" rx="22" fill="#1A184C"/>
  <text x="1115" y="245" font-size="26" font-weight="700" fill="#FFFFFF">3 · QUALITY</text>
  <text x="1115" y="350" font-size="76" font-weight="800" fill="#FFFFFF">8% → 3%</text>
  <text x="1115" y="395" font-size="28" font-weight="700" fill="#FFFFFF">quotes revised after sending</text>
  <text x="1115" y="460" font-size="23" fill="#FFFFFF">31,020 quotes a year × 5 points</text>
  <text x="1115" y="490" font-size="23" fill="#FFFFFF">× $120 to fix each error</text>
  <text x="1115" y="520" font-size="23" fill="#FFFFFF">= $186,120 poor quality avoided</text>
  <line x1="1115" y1="570" x2="1505" y2="570" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
  <text x="1115" y="615" font-size="23" fill="#FFFFFF">Measured where the work lands</text>
  <text x="1115" y="665" font-size="22" font-weight="700" fill="#FFFFFF">It can go up or down</text>

  <rect x="60" y="760" width="8" height="56" fill="#61D8FE"/>
  <text x="90" y="798" font-size="31" font-weight="700" fill="#0D1117">Same three numbers, same method, every time, or the portfolio can't be compared.</text>
  <text x="1540" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
