<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="100" font-size="48" font-weight="800" fill="#0D1117">Three numbers, three meanings. Never add them.</text>
  <text x="80" y="146" font-size="26" fill="#5B6470">Brightwater's Cognition Ledger, three quarters in (per year)</text>

  <line x1="120" y1="620" x2="1480" y2="620" stroke="#ADB5BD" stroke-width="2"/>
  <!-- scale: 1,292,292 = 400 px -->
  <rect x="160" y="244" width="300" height="376" rx="10" fill="#ADB5BD"/>
  <rect x="650" y="220" width="300" height="400" rx="10" fill="#FFFFFF" stroke="#544AE9" stroke-width="5"/>
  <rect x="1140" y="531" width="300" height="89" rx="10" fill="#544AE9"/>

  <g font-size="40" font-weight="800" text-anchor="middle">
    <text x="310" y="226" fill="#5B6470">$1,214,780</text>
    <text x="800" y="202" fill="#544AE9">$1,292,292</text>
    <text x="1290" y="510" fill="#544AE9">$288,463</text>
  </g>

  <g font-size="24" font-weight="700" fill="#ADB5BD" text-anchor="middle">
    <text x="555" y="430">not</text><text x="555" y="460">added</text>
    <text x="1045" y="430">not</text><text x="1045" y="460">added</text>
  </g>

  <g font-size="28" font-weight="800" fill="#0D1117" text-anchor="middle">
    <text x="310" y="664">Theoretical</text>
    <text x="800" y="664">Projected banked</text>
    <text x="1290" y="664">Realized</text>
  </g>
  <g font-size="22" fill="#333333" text-anchor="middle">
    <text x="310" y="698">hours × loaded rate</text>
    <text x="800" y="698">lever, owner and date</text>
    <text x="1290" y="698">verified by finance</text>
  </g>
  <g font-size="22" fill="#5B6470" text-anchor="middle" font-style="italic">
    <text x="310" y="730">the asking price</text>
    <text x="800" y="730">the accepted offer</text>
    <text x="1290" y="730">the closing price</text>
  </g>

  <rect x="80" y="770" width="8" height="52" fill="#544AE9"/>
  <text x="110" y="806" font-size="30" font-weight="700" fill="#0D1117">The only savings number is the one the CFO will sign.</text>
  <text x="1520" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
