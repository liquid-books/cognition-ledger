<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="1600" height="1200" fill="#FFFFFF"/>
<text x="80" y="96" font-size="46" font-weight="800" fill="#0D1117">Check three thresholds in order. Stop at the first yes.</text>
<text x="80" y="146" font-size="25" fill="#5B6470">Score nine questions from 1 to 5, average them into three indexes, then walk down the tree.</text>
<rect x="80" y="182" width="900" height="84" rx="16" fill="#1A184C"/>
<text x="530" y="217" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">Three indexes, each an average of 1 to 5 scores</text>
<text x="530" y="251" font-size="23" fill="#FFFFFF" text-anchor="middle">Cognition: C1 to C3 · Autonomy: A1 to A4 · Risk: R1 and R2</text>
<line x1="330" y1="266" x2="330" y2="278" stroke="#ADB5BD" stroke-width="4"/><polygon points="320,276 340,276 330,290" fill="#ADB5BD"/>
<polygon points="330,290 570,360 330,430 90,360" fill="#FFFFFF" stroke="#0D1117" stroke-width="3"/>
<text x="330" y="369" font-size="27" font-weight="800" fill="#0D1117" text-anchor="middle">Cognition below 2.0?</text>
<line x1="570" y1="360" x2="666" y2="360" stroke="#544AE9" stroke-width="4"/><polygon points="664,350 680,360 664,370" fill="#544AE9"/>
<text x="592" y="346" font-size="23" font-weight="700" fill="#544AE9">Yes</text>
<rect x="680" y="298" width="840" height="124" rx="18" fill="#E9ECEF"/>
<text x="710" y="354" font-size="30" font-weight="800" fill="#0D1117">Workflow automation, no AI needed</text>
<text x="710" y="394" font-size="23" fill="#0D1117">Brightwater OTC-06, the portal bot: Cognition 1.33</text>
<line x1="330" y1="430" x2="330" y2="458" stroke="#ADB5BD" stroke-width="4"/><polygon points="320,456 340,456 330,470" fill="#ADB5BD"/>
<text x="346" y="458" font-size="23" font-weight="700" fill="#5B6470">No</text>
<polygon points="330,470 570,540 330,610 90,540" fill="#FFFFFF" stroke="#0D1117" stroke-width="3"/>
<text x="330" y="549" font-size="27" font-weight="800" fill="#0D1117" text-anchor="middle">Risk 4.5 or higher?</text>
<line x1="570" y1="540" x2="666" y2="540" stroke="#544AE9" stroke-width="4"/><polygon points="664,530 680,540 664,550" fill="#544AE9"/>
<text x="592" y="526" font-size="23" font-weight="700" fill="#544AE9">Yes</text>
<rect x="680" y="478" width="840" height="124" rx="18" fill="#FF5CAD"/>
<text x="710" y="534" font-size="30" font-weight="800" fill="#0D1117">Keep human, AI assists</text>
<text x="710" y="574" font-size="23" fill="#0D1117">AI researches and drafts; a person decides and acts</text>
<line x1="330" y1="610" x2="330" y2="638" stroke="#ADB5BD" stroke-width="4"/><polygon points="320,636 340,636 330,650" fill="#ADB5BD"/>
<text x="346" y="638" font-size="23" font-weight="700" fill="#5B6470">No</text>
<polygon points="330,650 570,720 330,790 90,720" fill="#FFFFFF" stroke="#0D1117" stroke-width="3"/>
<text x="330" y="729" font-size="27" font-weight="800" fill="#0D1117" text-anchor="middle">Autonomy 3.0 or higher?</text>
<line x1="570" y1="720" x2="666" y2="720" stroke="#544AE9" stroke-width="4"/><polygon points="664,710 680,720 664,730" fill="#544AE9"/>
<text x="592" y="706" font-size="23" font-weight="700" fill="#544AE9">Yes</text>
<rect x="680" y="644" width="840" height="152" rx="18" fill="#61D8FE"/>
<text x="710" y="688" font-size="30" font-weight="800" fill="#0D1117">Agent</text>
<text x="710" y="726" font-size="23" fill="#0D1117">Add a human checkpoint if Risk is 3.0 or higher</text>
<text x="710" y="758" font-size="23" fill="#0D1117">OTC-02 Agent · OTC-04 and OTC-07 + checkpoint</text>
<line x1="330" y1="790" x2="330" y2="912" stroke="#ADB5BD" stroke-width="4"/><line x1="330" y1="912" x2="666" y2="912" stroke="#ADB5BD" stroke-width="4"/><polygon points="664,902 680,912 664,922" fill="#ADB5BD"/>
<text x="346" y="858" font-size="23" font-weight="700" fill="#5B6470">No</text>

<rect x="680" y="836" width="840" height="152" rx="18" fill="#61D8FE"/>
<text x="710" y="880" font-size="30" font-weight="800" fill="#0D1117">Skill</text>
<text x="710" y="918" font-size="23" fill="#0D1117">Add a second review if Risk is 3.0 or higher</text>
<text x="710" y="950" font-size="23" fill="#0D1117">OTC-01 and OTC-05 Skill · OTC-03 + second review</text>
<rect x="80" y="1046" width="8" height="56" fill="#61D8FE"/>
<text x="110" y="1084" font-size="32" font-weight="700" fill="#0D1117">The most exciting idea in the room often scores below the AI line.</text>
<text x="1520" y="1160" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>