<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="60" y="95" font-size="48" font-weight="800" fill="#0D1117">The bigger prize ranks lower, and that's the point</text>
  <text x="60" y="140" font-size="26" fill="#5B6470">Priority score = projected banked value × confidence ÷ effort in weeks</text>

  <!-- column headers -->
  <g font-size="22" font-weight="700" fill="#5B6470">
    <text x="60" y="215">USE CASE</text>
    <text x="420" y="215">BANKED VALUE / YEAR</text>
    <text x="830" y="215">× CONFIDENCE</text>
    <text x="1030" y="215">÷ EFFORT</text>
    <text x="1540" y="215" text-anchor="end">PRIORITY</text>
  </g>
  <line x1="60" y1="235" x2="1540" y2="235" stroke="#E9ECEF" stroke-width="3"/>

  <!-- OTC-04 row (bigger prize) -->
  <text x="60" y="300" font-size="30" font-weight="800" fill="#0D1117">OTC-04</text>
  <text x="60" y="334" font-size="22" fill="#5B6470">Dispute triage agent</text>
  <rect x="420" y="268" width="380" height="64" fill="#544AE9"/>
  <text x="440" y="311" font-size="30" font-weight="800" fill="#FFFFFF">$533,458</text>
  <text x="830" y="311" font-size="30" font-weight="800" fill="#0D1117">0.7</text>
  <text x="830" y="340" font-size="21" fill="#5B6470">medium</text>
  <text x="1030" y="311" font-size="30" font-weight="800" fill="#0D1117">12 wks</text>
  <rect x="1150" y="260" width="390" height="80" rx="12" fill="#E9ECEF"/>
  <text x="1520" y="315" font-size="42" font-weight="800" fill="#0D1117" text-anchor="end">31,118</text>
  <text x="1170" y="315" font-size="22" font-weight="700" fill="#5B6470">RANK 2</text>
  <text x="60" y="392" font-size="22" fill="#333333">Build $85,000 · run $42,000 a year · pays back in about 2 months</text>

  <line x1="60" y1="430" x2="1540" y2="430" stroke="#E9ECEF" stroke-width="3"/>

  <!-- OTC-01 row -->
  <text x="60" y="495" font-size="30" font-weight="800" fill="#0D1117">OTC-01</text>
  <text x="60" y="529" font-size="22" fill="#5B6470">Quote builder Skill</text>
  <rect x="420" y="463" width="279" height="64" fill="#544AE9"/>
  <text x="440" y="506" font-size="30" font-weight="800" fill="#FFFFFF">$392,382</text>
  <text x="830" y="506" font-size="30" font-weight="800" fill="#0D1117">0.9</text>
  <text x="830" y="535" font-size="21" fill="#5B6470">high</text>
  <text x="1030" y="506" font-size="30" font-weight="800" fill="#0D1117">4 wks</text>
      <text x="60" y="587" font-size="22" fill="#333333">Build $15,000 · run $9,000 a year · pays back in about 2 weeks</text>

  <!-- priority bars: scale 88,286 -> 300px; drawn right-aligned area -->
  <rect x="1150" y="455" width="390" height="80" rx="12" fill="#1A184C"/>
  <text x="1520" y="510" font-size="42" font-weight="800" fill="#FFFFFF" text-anchor="end">88,286</text>
  <text x="1170" y="510" font-size="22" font-weight="700" fill="#61D8FE">RANK 1</text>

  <!-- insight panel -->
  <rect x="60" y="625" width="1480" height="110" rx="18" fill="#F1F3F5"/>
  <text x="90" y="672" font-size="25" fill="#0D1117">The Skill ranks almost three times higher: less money, but surer, and a third of the effort.</text>
  <text x="90" y="710" font-size="25" fill="#0D1117">The score ranks money already planned, so a use case with no Hour Budget scores zero.</text>

  <rect x="60" y="775" width="8" height="56" fill="#61D8FE"/>
  <text x="90" y="813" font-size="30" font-weight="700" fill="#0D1117">Rank by money you can bank soon and believe in, not the biggest slide.</text>
  <text x="1540" y="875" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
