<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B6470"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="100" font-size="46" font-weight="800" fill="#0D1117">Twenty real cases replace the estimate, or say no</text>
  <text x="80" y="146" font-size="26" fill="#5B6470">The pilot loop, with Brightwater's quote builder Skill (OTC-01)</text>

  <!-- four steps -->
  <rect x="80" y="190" width="320" height="200" rx="18" fill="#E9ECEF"/>
  <text x="105" y="235" font-size="28" font-weight="800" fill="#0D1117">1  Baseline</text>
  <text x="105" y="278" font-size="24" fill="#333333">24 quotes timed</text>
  <text x="105" y="312" font-size="24" fill="#333333">35 min each</text>
  <text x="105" y="346" font-size="24" fill="#333333">8% revised later</text>

  <rect x="453" y="190" width="320" height="200" rx="18" fill="#61D8FE"/>
  <text x="478" y="235" font-size="28" font-weight="800" fill="#0D1117">2  Build</text>
  <text x="478" y="278" font-size="24" fill="#0D1117">Write the recipe or</text>
  <text x="478" y="312" font-size="24" fill="#0D1117">job description first,</text>
  <text x="478" y="346" font-size="24" fill="#0D1117">then build to it</text>

  <rect x="826" y="190" width="320" height="200" rx="18" fill="#61D8FE"/>
  <text x="851" y="235" font-size="28" font-weight="800" fill="#0D1117">3  Pilot on 20</text>
  <text x="851" y="278" font-size="24" fill="#0D1117">Real units from last</text>
  <text x="851" y="312" font-size="24" fill="#0D1117">month's queue, ugly</text>
  <text x="851" y="346" font-size="24" fill="#0D1117">ones included</text>

  <rect x="1199" y="190" width="321" height="200" rx="18" fill="#FF5CAD"/>
  <text x="1224" y="235" font-size="28" font-weight="800" fill="#0D1117">4  Measure</text>
  <text x="1224" y="278" font-size="24" fill="#0D1117">15 min each,</text>
  <text x="1224" y="312" font-size="24" fill="#0D1117">review included</text>
  <text x="1224" y="346" font-size="24" fill="#0D1117">3% revised later</text>

  <g stroke="#5B6470" stroke-width="4" fill="none">
    <line x1="402" y1="290" x2="449" y2="290" marker-end="url(#ah)"/>
    <line x1="775" y1="290" x2="822" y2="290" marker-end="url(#ah)"/>
    <line x1="1148" y1="290" x2="1195" y2="290" marker-end="url(#ah)"/>
    <line x1="1360" y1="392" x2="1360" y2="446" marker-end="url(#ah)"/>
  </g>

  <!-- decision -->
  <text x="1520" y="478" font-size="26" font-weight="800" fill="#0D1117" text-anchor="end">Decide</text>
  <rect x="80" y="500" width="460" height="170" rx="18" fill="#544AE9"/>
  <text x="110" y="550" font-size="32" font-weight="800" fill="#FFFFFF">Ship</text>
  <text x="110" y="594" font-size="24" fill="#FFFFFF">Measured numbers replace</text>
  <text x="110" y="628" font-size="24" fill="#FFFFFF">the estimates in the ledger</text>

  <rect x="570" y="500" width="460" height="170" rx="18" fill="#FFFFFF" stroke="#61D8FE" stroke-width="4"/>
  <text x="600" y="550" font-size="32" font-weight="800" fill="#0D1117">Fix</text>
  <text x="600" y="594" font-size="24" fill="#333333">Change instructions or</text>
  <text x="600" y="628" font-size="24" fill="#333333">tools, then pilot again</text>

  <rect x="1060" y="500" width="460" height="170" rx="18" fill="#E9ECEF"/>
  <text x="1090" y="550" font-size="32" font-weight="800" fill="#0D1117">Park</text>
  <text x="1090" y="594" font-size="24" fill="#333333">Gain too small, or errors</text>
  <text x="1090" y="628" font-size="24" fill="#333333">worse than the person's</text>

  <line x1="1360" y1="446" x2="1360" y2="460" stroke="#5B6470" stroke-width="4"/>
  <line x1="310" y1="460" x2="1360" y2="460" stroke="#5B6470" stroke-width="4"/>
  <g stroke="#5B6470" stroke-width="4" fill="none">
    <line x1="310" y1="460" x2="310" y2="496" marker-end="url(#ah)"/>
    <line x1="900" y1="460" x2="900" y2="496" marker-end="url(#ah)"/>
    <line x1="1290" y1="460" x2="1290" y2="496" marker-end="url(#ah)"/>
  </g>
  <!-- fix loops back to build -->
  <line x1="660" y1="498" x2="660" y2="398" stroke="#61D8FE" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#ah)"/>
  <text x="690" y="440" font-size="22" fill="#5B6470">Fix: back to Build</text>

  <rect x="80" y="770" width="8" height="52" fill="#61D8FE"/>
  <text x="110" y="806" font-size="30" font-weight="700" fill="#0D1117">A pilot that can't say no isn't a pilot. It's a launch party.</text>
  <text x="1520" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
