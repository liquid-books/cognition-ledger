<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="105" font-size="46" font-weight="800" fill="#0D1117">The customer pays for 22 minutes hidden inside two days</text>
  <text x="80" y="150" font-size="26" fill="#5B6470">The same Brightwater quote, drawn as an iceberg (areas roughly to scale)</text>

  <polygon points="380,345 700,345 800,470 740,640 500,712 240,660 200,520" fill="#E9ECEF" stroke="#ADB5BD" stroke-width="3"/>
  <polygon points="450,335 540,245 630,335" fill="#FF5CAD"/>
  <polygon points="483,335 540,276 597,335" fill="#544AE9"/>
  <line x1="80" y1="340" x2="830" y2="340" stroke="#5B6470" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="90" y="325" font-size="22" fill="#5B6470">what gets managed</text>
  <text x="90" y="372" font-size="22" fill="#5B6470">what customers feel</text>
  <text x="510" y="540" font-size="40" font-weight="800" fill="#5B6470" text-anchor="middle">925 min</text>
  <text x="510" y="580" font-size="24" fill="#5B6470" text-anchor="middle">waiting</text>

  <text x="860" y="230" font-size="22" font-weight="800" fill="#5B6470" letter-spacing="2">ABOVE THE WATERLINE</text>
  <rect x="860" y="252" width="28" height="28" rx="6" fill="#FF5CAD"/>
  <text x="904" y="276" font-size="30" font-weight="800" fill="#0D1117">35 minutes of touch time (3.6%)</text>
  <rect x="860" y="302" width="28" height="28" rx="6" fill="#544AE9"/>
  <text x="904" y="326" font-size="30" font-weight="800" fill="#0D1117">22 the customer would pay for (2.3%)</text>
  <text x="904" y="364" font-size="24" fill="#333333">The other 13: re-keying, hunting, approving</text>

  <text x="860" y="460" font-size="22" font-weight="800" fill="#5B6470" letter-spacing="2">BELOW THE WATERLINE</text>
  <rect x="860" y="482" width="28" height="28" rx="6" fill="#E9ECEF" stroke="#ADB5BD" stroke-width="2"/>
  <text x="904" y="506" font-size="30" font-weight="800" fill="#0D1117">925 minutes of waiting (96.4%)</text>
  <text x="904" y="544" font-size="24" fill="#333333">An inbox, a missing part number,</text>
  <text x="904" y="576" font-size="24" fill="#333333">an approval queue, an unsent draft</text>
  <text x="904" y="640" font-size="24" fill="#333333">On the customer's 48-hour clock,</text>
  <text x="904" y="672" font-size="24" fill="#333333">35 minutes is just 1.2%.</text>

  <rect x="80" y="768" width="8" height="56" fill="#61D8FE"/>
  <text x="110" y="806" font-size="31" font-weight="700" fill="#0D1117">Activity ratio = touch time ÷ lead time. In office work it's often 1% to 10%.</text>
  <text x="1520" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
