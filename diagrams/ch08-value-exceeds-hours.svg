<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="100" font-size="46" font-weight="800" fill="#0D1117">The dispute agent banks 3x what its hours are worth</text>
  <text x="80" y="146" font-size="26" fill="#5B6470">Brightwater OTC-04: 4,383 freed hours a year, and its signed Hour Budget</text>

  <!-- baseline 640, scale 0.000844 px per dollar -->
  <line x1="200" y1="640" x2="1080" y2="640" stroke="#ADB5BD" stroke-width="2"/>

  <!-- theoretical -->
  <rect x="280" y="505" width="260" height="135" rx="8" fill="#ADB5BD"/>
  <text x="410" y="485" font-size="36" font-weight="800" fill="#5B6470" text-anchor="middle">$175,776</text>
  <text x="410" y="682" font-size="26" font-weight="800" fill="#0D1117" text-anchor="middle">Theoretical value</text>
  <text x="410" y="714" font-size="22" fill="#5B6470" text-anchor="middle">4,383 hours × loaded rate</text>

  <!-- projected banked stack -->
  <rect x="760" y="582" width="260" height="58" fill="#544AE9"/>
  <rect x="760" y="516" width="260" height="66" fill="#544AE9"/>
  <rect x="760" y="415" width="260" height="101" fill="#1A184C"/>
  <rect x="760" y="229" width="260" height="186" fill="#1A184C"/>
  <g stroke="#FFFFFF" stroke-width="3"><line x1="760" y1="582" x2="1020" y2="582"/><line x1="760" y1="516" x2="1020" y2="516"/><line x1="760" y1="415" x2="1020" y2="415"/></g>
  <g font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">
    <text x="890" y="619">Avoid $75,407</text>
    <text x="890" y="557">Cut $85,277</text>
    <text x="890" y="474">Fix $131,130</text>
    <text x="890" y="330">Speed $241,644</text>
  </g>
  <text x="890" y="214" font-size="36" font-weight="800" fill="#544AE9" text-anchor="middle">$533,458</text>
  <text x="890" y="682" font-size="26" font-weight="800" fill="#0D1117" text-anchor="middle">Projected banked</text>
  <text x="890" y="714" font-size="22" fill="#5B6470" text-anchor="middle">four levers, owner and date on each</text>

  <!-- brackets -->
  <path d="M1040,229 L1060,229 L1060,516 L1040,516" stroke="#1A184C" stroke-width="3" fill="none"/>
  <text x="1085" y="340" font-size="26" font-weight="800" fill="#0D1117">$372,774 no timesheet shows</text>
  <text x="1085" y="376" font-size="22" fill="#333333">Fix: errors that never happen</text>
  <text x="1085" y="408" font-size="22" fill="#333333">Speed: cash that arrives sooner</text>
  <path d="M1040,516 L1060,516 L1060,640 L1040,640" stroke="#544AE9" stroke-width="3" fill="none"/>
  <text x="1085" y="570" font-size="26" font-weight="800" fill="#0D1117">$160,684 from hours</text>
  <text x="1085" y="600" font-size="22" fill="#333333">a contract ended, a retiree</text>
  <text x="1085" y="630" font-size="22" fill="#333333">not replaced</text>

  <rect x="80" y="760" width="8" height="52" fill="#61D8FE"/>
  <text x="110" y="796" font-size="30" font-weight="700" fill="#0D1117">Rank by banked value, not hours saved: value can exceed the hours.</text>
  <text x="1520" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
