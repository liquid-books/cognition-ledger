<text x="195" y="362" font-size="29" font-weight="800" fill="#FFFFFF" text-anchor="middle">CEO</text>
<text x="195" y="398" font-size="22" fill="#FFFFFF" text-anchor="middle">sets the rule</text>
<rect x="326" y="282" width="386" height="172" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
<text x="348" y="334" font-size="25" fill="#333333">Pick one painful value</text>
<text x="348" y="372" font-size="25" fill="#333333">stream. Name an owner</text>
<text x="348" y="410" font-size="25" fill="#333333">and a finance partner.</text>
<rect x="728" y="282" width="386" height="172" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
<text x="750" y="334" font-size="25" fill="#333333">Rule: nothing is built</text>
<text x="750" y="372" font-size="25" fill="#333333">without a draft Hour</text>
<text x="750" y="410" font-size="25" fill="#333333">Budget. Tell people early.</text>
<rect x="1130" y="282" width="386" height="172" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
<text x="1152" y="334" font-size="25" fill="#333333">Show the board all</text>
<text x="1152" y="372" font-size="25" fill="#333333">three numbers, Leak</text>
<text x="1152" y="410" font-size="25" fill="#333333">included.</text>
