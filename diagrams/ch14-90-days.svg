<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="1600" height="1200" fill="#FFFFFF"/>
<text x="80" y="100" font-size="48" font-weight="800" fill="#0D1117">90 days from first map to first verified dollar</text>
<text x="80" y="150" font-size="26" fill="#5B6470">Four roles, one value stream. Each column hands its numbers to the next.</text>
<text x="344" y="216" font-size="24" font-weight="800" fill="#0D1117" letter-spacing="1.5">DAYS 1 TO 30</text>
<text x="344" y="248" font-size="23" fill="#5B6470">See the work</text>
<text x="746" y="216" font-size="24" font-weight="800" fill="#0D1117" letter-spacing="1.5">DAYS 31 TO 60</text>
<text x="746" y="248" font-size="23" fill="#5B6470">Size, sort and sign</text>
<text x="1148" y="216" font-size="24" font-weight="800" fill="#0D1117" letter-spacing="1.5">DAYS 61 TO 90</text>
<text x="1148" y="248" font-size="23" fill="#5B6470">Run, bank and prove</text>
