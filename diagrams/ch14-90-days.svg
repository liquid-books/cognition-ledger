<text x="750" y="706" font-size="25" fill="#333333">Time 20 real units.</text>
<text x="750" y="744" font-size="25" fill="#333333">Sort Score the top three.</text>
<text x="750" y="782" font-size="25" fill="#333333">Get Hour Budgets signed.</text>
<rect x="1130" y="654" width="386" height="172" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
<text x="1152" y="706" font-size="25" fill="#333333">Run the board weekly,</text>
<text x="1152" y="744" font-size="25" fill="#333333">3 to 5 in Building.</text>
<text x="1152" y="782" font-size="25" fill="#333333">Send the leak monthly.</text>
<rect x="80" y="840" width="230" height="172" rx="18" fill="#61D8FE"/>
<text x="195" y="920" font-size="29" font-weight="800" fill="#0D1117" text-anchor="middle">Data scientist</text>
<text x="195" y="956" font-size="22" fill="#0D1117" text-anchor="middle">builds and measures</text>
<rect x="326" y="840" width="386" height="172" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
<text x="348" y="892" font-size="25" fill="#333333">Write the best expert's</text>
<text x="348" y="930" font-size="25" fill="#333333">know-how as a first</text>
<text x="348" y="968" font-size="25" fill="#333333">Skill. Pilot with five.</text>
<rect x="728" y="840" width="386" height="172" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
<text x="750" y="892" font-size="25" fill="#333333">Measure new minutes</text>
<text x="750" y="930" font-size="25" fill="#333333">and errors on 20 real</text>
<text x="750" y="968" font-size="25" fill="#333333">cases, review included.</text>
<rect x="1130" y="840" width="386" height="172" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
<text x="1152" y="892" font-size="25" fill="#333333">Write the first agent's</text>
<text x="1152" y="930" font-size="25" fill="#333333">job description. Build</text>
<text x="1152" y="968" font-size="25" fill="#333333">only what's banked.</text>
<rect x="1130" y="1062" width="386" height="50" rx="25" fill="#544AE9"/><text x="1323" y="1095" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">Day 90: one verified line</text>
<rect x="80" y="1060" width="8" height="56" fill="#61D8FE"/>
<text x="110" y="1098" font-size="32" font-weight="700" fill="#0D1117">The goal is one line finance will sign.</text>
<text x="1520" y="1160" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
