<text x="195" y="548" font-size="29" font-weight="800" fill="#FFFFFF" text-anchor="middle">CFO</text>
<text x="195" y="584" font-size="22" fill="#FFFFFF" text-anchor="middle">holds the pen</text>
<rect x="326" y="468" width="386" height="172" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
<text x="348" y="520" font-size="25" fill="#333333">Set house numbers:</text>
<text x="348" y="558" font-size="25" fill="#333333">30% load, 1,880 hours,</text>
<text x="348" y="596" font-size="25" fill="#333333">47 weeks, cost of capital.</text>
<rect x="728" y="468" width="386" height="172" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
<text x="750" y="520" font-size="25" fill="#333333">Publish the evidence</text>
<text x="750" y="558" font-size="25" fill="#333333">for each lever. Name</text>
<text x="750" y="596" font-size="25" fill="#333333">the verifier.</text>
<rect x="1130" y="468" width="386" height="172" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
<text x="1152" y="520" font-size="25" fill="#333333">Run the first verification.</text>
<text x="1152" y="558" font-size="25" fill="#333333">Sign only what's proven,</text>
<text x="1152" y="596" font-size="25" fill="#333333">with a date.</text>
