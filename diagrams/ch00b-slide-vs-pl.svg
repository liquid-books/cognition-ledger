<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="105" font-size="54" font-weight="800" fill="#0D1117">$1.5 million on the slide. $0 on the P&amp;L.</text>
  <text x="80" y="152" font-size="28" fill="#5B6470">Same company, same year, two documents. Only one of them gets audited.</text>

  <rect x="80" y="195" width="680" height="530" rx="22" fill="#1A184C"/>
  <text x="125" y="252" font-size="24" font-weight="700" fill="#ADB5BD" letter-spacing="3">THE BOARD SLIDE</text>
  <g font-size="28" fill="#FFFFFF">
    <rect x="125" y="292" width="12" height="40" fill="#61D8FE"/>
    <text x="160" y="322" font-weight="700">AI saves 4 hours a week per person</text>
    <rect x="125" y="357" width="12" height="40" fill="#61D8FE"/>
    <text x="160" y="387">4 hours × 200 people = 800 a week</text>
    <rect x="125" y="422" width="12" height="40" fill="#61D8FE"/>
    <text x="160" y="452">× 47 working weeks = 37,600 hours a year</text>
    <rect x="125" y="487" width="12" height="40" fill="#61D8FE"/>
    <text x="160" y="517">× $40 loaded cost per hour =</text>
  </g>
  <text x="125" y="640" font-size="96" font-weight="800" fill="#FFFFFF">$1,504,000</text>
  <text x="125" y="690" font-size="24" fill="#ADB5BD">"Annual productivity value"</text>

  <circle cx="800" cy="460" r="30" fill="#E9ECEF"/>
  <path d="M786 460 H812 M802 449 L814 460 L802 471" stroke="#5B6470" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="840" y="195" width="680" height="530" rx="22" fill="#E9ECEF"/>
  <text x="885" y="252" font-size="24" font-weight="700" fill="#5B6470" letter-spacing="3">NEXT YEAR'S P&amp;L</text>
  <g font-size="30" fill="#333333">
    <text x="885" y="322">Payroll</text><text x="1475" y="322" text-anchor="end" fill="#5B6470">no change</text>
    <line x1="885" y1="345" x2="1475" y2="345" stroke="#ADB5BD" stroke-width="2"/>
    <text x="885" y="392">Headcount</text><text x="1475" y="392" text-anchor="end" fill="#5B6470">no change</text>
    <line x1="885" y1="415" x2="1475" y2="415" stroke="#ADB5BD" stroke-width="2"/>
    <text x="885" y="462">Overtime</text><text x="1475" y="462" text-anchor="end" fill="#5B6470">no change</text>
    <line x1="885" y1="485" x2="1475" y2="485" stroke="#ADB5BD" stroke-width="2"/>
    <text x="885" y="532">Temps and contractors</text><text x="1475" y="532" text-anchor="end" fill="#5B6470">no change</text>
  </g>
  <text x="885" y="640" font-size="96" font-weight="800" fill="#544AE9">$0</text>
  <text x="885" y="690" font-size="24" fill="#5B6470">Savings anyone can point to</text>

  <rect x="80" y="768" width="8" height="56" fill="#61D8FE"/>
  <text x="110" y="806" font-size="34" font-weight="700" fill="#0D1117">AI didn't fail. Nobody gave the hours a job.</text>
  <text x="1520" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
