<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6470"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#61D8FE"/></marker></defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="80" y="100" font-size="48" font-weight="800" fill="#0D1117" text-anchor="start" >Three business models cheap cognition makes possible</text>
<text x="80" y="146" font-size="26" font-weight="400" fill="#5B6470" text-anchor="start" >Each one sells what the machine and your experts produce together, not the hours behind it.</text>
<rect x="80" y="190" width="455" height="90" rx="16" fill="#61D8FE" />
<text x="308" y="232" font-size="28" font-weight="800" fill="#0D1117" text-anchor="middle" >Outcome pricing</text>
<text x="308" y="266" font-size="22" font-weight="400" fill="#0D1117" text-anchor="middle" >Sell the result</text>
<rect x="80" y="295" width="455" height="115" rx="14" fill="#E9ECEF" />
<text x="104" y="330" font-size="20" font-weight="700" fill="#5B6470" text-anchor="start" >HOW IT PAYS</text>
<text x="104" y="364" font-size="24" font-weight="700" fill="#544AE9" text-anchor="start" >Paid per result,</text>
<text x="104" y="395" font-size="24" font-weight="700" fill="#544AE9" text-anchor="start" >not per hour</text>
<rect x="80" y="425" width="455" height="150" rx="14" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="2"/>
<text x="104" y="460" font-size="20" font-weight="700" fill="#5B6470" text-anchor="start" >BRIGHTWATER COULD</text>
<text x="104" y="494" font-size="24" font-weight="400" fill="#333333" text-anchor="start" >A share of the billing</text>
<text x="104" y="525" font-size="24" font-weight="400" fill="#333333" text-anchor="start" >errors it recovers</text>
<text x="104" y="556" font-size="24" font-weight="400" fill="#333333" text-anchor="start" >for customers</text>
<rect x="80" y="590" width="455" height="120" rx="14" fill="#FFFFFF" stroke="#FF5CAD" stroke-width="3"/>
<text x="104" y="625" font-size="20" font-weight="700" fill="#1A184C" text-anchor="start" >WATCH OUT</text>
<text x="104" y="659" font-size="24" font-weight="400" fill="#333333" text-anchor="start" >Define the result so</text>
<text x="104" y="690" font-size="24" font-weight="400" fill="#333333" text-anchor="start" >both sides can count it</text>
<rect x="565" y="190" width="455" height="90" rx="16" fill="#61D8FE" />
<text x="793" y="232" font-size="28" font-weight="800" fill="#0D1117" text-anchor="middle" >Productised service</text>
<text x="793" y="266" font-size="22" font-weight="400" fill="#0D1117" text-anchor="middle" >Sell a fixed package</text>
<rect x="565" y="295" width="455" height="115" rx="14" fill="#E9ECEF" />
<text x="589" y="330" font-size="20" font-weight="700" fill="#5B6470" text-anchor="start" >HOW IT PAYS</text>
<text x="589" y="364" font-size="24" font-weight="700" fill="#544AE9" text-anchor="start" >One scope,</text>
<text x="589" y="395" font-size="24" font-weight="700" fill="#544AE9" text-anchor="start" >one monthly price</text>
<rect x="565" y="425" width="455" height="150" rx="14" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="2"/>
<text x="589" y="460" font-size="20" font-weight="700" fill="#5B6470" text-anchor="start" >BRIGHTWATER COULD</text>
<text x="589" y="494" font-size="24" font-weight="400" fill="#333333" text-anchor="start" >Runs order entry for</text>
<text x="589" y="525" font-size="24" font-weight="400" fill="#333333" text-anchor="start" >small dealers in its</text>
<text x="589" y="556" font-size="24" font-weight="400" fill="#333333" text-anchor="start" >buying group</text>
<rect x="565" y="590" width="455" height="120" rx="14" fill="#FFFFFF" stroke="#FF5CAD" stroke-width="3"/>
<text x="589" y="625" font-size="20" font-weight="700" fill="#1A184C" text-anchor="start" >WATCH OUT</text>
<text x="589" y="659" font-size="24" font-weight="400" fill="#333333" text-anchor="start" >Scope creep turns it</text>
<text x="589" y="690" font-size="24" font-weight="400" fill="#333333" text-anchor="start" >back into hours</text>
<rect x="1050" y="190" width="455" height="90" rx="16" fill="#61D8FE" />
<text x="1278" y="232" font-size="28" font-weight="800" fill="#0D1117" text-anchor="middle" >Your Skills and agents</text>
<text x="1278" y="266" font-size="22" font-weight="400" fill="#0D1117" text-anchor="middle" >Sell your know-how</text>
<rect x="1050" y="295" width="455" height="115" rx="14" fill="#E9ECEF" />
<text x="1074" y="330" font-size="20" font-weight="700" fill="#5B6470" text-anchor="start" >HOW IT PAYS</text>
<text x="1074" y="364" font-size="24" font-weight="700" fill="#544AE9" text-anchor="start" >License or</text>
<text x="1074" y="395" font-size="24" font-weight="700" fill="#544AE9" text-anchor="start" >subscription</text>
<rect x="1050" y="425" width="455" height="150" rx="14" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="2"/>
<text x="1074" y="460" font-size="20" font-weight="700" fill="#5B6470" text-anchor="start" >BRIGHTWATER COULD</text>
<text x="1074" y="494" font-size="24" font-weight="400" fill="#333333" text-anchor="start" >Licenses its dispute</text>
<text x="1074" y="525" font-size="24" font-weight="400" fill="#333333" text-anchor="start" >triage agent to other</text>
<text x="1074" y="556" font-size="24" font-weight="400" fill="#333333" text-anchor="start" >distributors</text>
<rect x="1050" y="590" width="455" height="120" rx="14" fill="#FFFFFF" stroke="#FF5CAD" stroke-width="3"/>
<text x="1074" y="625" font-size="20" font-weight="700" fill="#1A184C" text-anchor="start" >WATCH OUT</text>
<text x="1074" y="659" font-size="24" font-weight="400" fill="#333333" text-anchor="start" >Never sell the</text>
<text x="1074" y="690" font-size="24" font-weight="400" fill="#333333" text-anchor="start" >thing that is your edge</text>
<rect x="80" y="750" width="8" height="52" rx="0" fill="#61D8FE" />
<text x="110" y="786" font-size="30" font-weight="700" fill="#0D1117" text-anchor="start" >Test one model as a ledger ticket before you bet the company on it.</text>
<text x="1520" y="866" font-size="22" font-weight="400" fill="#5B6470" text-anchor="end" >The Cognition Ledger · DrLee.ai</text>
