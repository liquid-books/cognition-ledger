  <text x="1471" y="385" font-size="22" font-weight="700" fill="#5B6470" text-anchor="middle">$0</text>

  <text x="80" y="445" font-size="24" font-weight="800" fill="#5B6470" letter-spacing="2">WHAT IT'S WORTH</text>
