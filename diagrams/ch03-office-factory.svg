<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="105" font-size="48" font-weight="800" fill="#0D1117">Your office has inventory. It just lives in inboxes.</text>
  <text x="80" y="150" font-size="26" fill="#5B6470">Lean's factory ideas translate one for one into knowledge work</text>

  <text x="80" y="208" font-size="22" font-weight="800" fill="#5B6470" letter-spacing="2">ON THE FACTORY FLOOR: YOU CAN SEE IT</text>
  <text x="860" y="208" font-size="22" font-weight="800" fill="#544AE9" letter-spacing="2">IN THE OFFICE: YOU HAVE TO GO LOOKING</text>
  <g fill="#E9ECEF">
    <rect x="80" y="228" width="660" height="76" rx="14"/><rect x="80" y="318" width="660" height="76" rx="14"/>
    <rect x="80" y="408" width="660" height="76" rx="14"/><rect x="80" y="498" width="660" height="76" rx="14"/>
    <rect x="80" y="588" width="660" height="76" rx="14"/>
  </g>
  <g fill="#FFFFFF" stroke="#544AE9" stroke-width="3">
    <rect x="860" y="228" width="660" height="76" rx="14"/><rect x="860" y="318" width="660" height="76" rx="14"/>
    <rect x="860" y="408" width="660" height="76" rx="14"/><rect x="860" y="498" width="660" height="76" rx="14"/>
    <rect x="860" y="588" width="660" height="76" rx="14"/>
  </g>
  <g stroke="#5B6470" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M760 266 H840 M828 256 L840 266 L828 276"/><path d="M760 356 H840 M828 346 L840 356 L828 366"/>
    <path d="M760 446 H840 M828 436 L840 446 L828 456"/><path d="M760 536 H840 M828 526 L840 536 L828 546"/>
    <path d="M760 626 H840 M828 616 L840 626 L828 636"/>
  </g>
  <g font-size="26" fill="#333333">
    <text x="110" y="275">Parts piled between machines</text>
    <text x="110" y="365">Time a machine works a part</text>
    <text x="110" y="455">Parts waiting for the next machine</text>
    <text x="110" y="545">Defective parts sent back</text>
    <text x="110" y="635">Walk the floor, follow one part</text>
  </g>
  <g font-size="26" font-weight="700" fill="#0D1117">
    <text x="890" y="275">Requests sitting in inboxes</text>
    <text x="890" y="365">Touch time: minutes of real work</text>
    <text x="890" y="455">Wait time: days in queues</text>
    <text x="890" y="545">Incomplete requests sent back</text>
    <text x="890" y="635">Follow one quote, request to reply</text>
  </g>

  <rect x="80" y="768" width="8" height="56" fill="#61D8FE"/>
  <text x="110" y="806" font-size="34" font-weight="700" fill="#0D1117">The waste is the same. In the office, it's invisible until you map it.</text>
  <text x="1520" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
