<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="100" font-size="48" font-weight="800" fill="#0D1117">Your new minutes are review minutes</text>
  <text x="80" y="148" font-size="26" fill="#5B6470">One Brightwater quote, before and after the Skill, timed in the pilot</text>

  <!-- scale: 35 min = 1200 px, 34.29 px/min, bars start x=300 -->
  <text x="80" y="262" font-size="30" font-weight="800" fill="#0D1117">Before</text>
  <text x="80" y="296" font-size="22" fill="#5B6470">all by hand</text>
  <rect x="300" y="215" width="1200" height="100" rx="12" fill="#E9ECEF"/>
  <text x="330" y="276" font-size="28" font-weight="700" fill="#333333">Rep reads, looks up, prices, types, checks</text>
  <text x="1480" y="276" font-size="32" font-weight="800" fill="#0D1117" text-anchor="end">35 min</text>

  <text x="80" y="432" font-size="30" font-weight="800" fill="#0D1117">After</text>
  <text x="80" y="466" font-size="22" fill="#5B6470">review included</text>
  <rect x="300" y="385" width="514" height="100" rx="12" fill="#FF5CAD"/>
  <rect x="300" y="385" width="62" height="100" rx="12" fill="#61D8FE"/>
  <text x="845" y="446" font-size="32" font-weight="800" fill="#0D1117">15 min</text>

  <!-- callouts -->
  <line x1="331" y1="490" x2="331" y2="545" stroke="#61D8FE" stroke-width="4"/>
  <text x="300" y="578" font-size="24" font-weight="700" fill="#0D1117">Machine drafts</text>
  <text x="300" y="610" font-size="24" fill="#333333">under 2 min</text>
  <line x1="600" y1="490" x2="600" y2="545" stroke="#FF5CAD" stroke-width="4"/>
  <text x="560" y="578" font-size="24" font-weight="700" fill="#0D1117">Rep checks and sends</text>
  <text x="560" y="610" font-size="24" fill="#333333">about 13 min</text>

  <!-- design for trust panel -->
  <rect x="1000" y="530" width="520" height="190" rx="18" fill="#1A184C"/>
  <text x="1030" y="578" font-size="26" font-weight="800" fill="#FFFFFF">Shrink the pink bar:</text>
  <text x="1030" y="618" font-size="24" fill="#FFFFFF">list doubts at the top</text>
  <text x="1030" y="652" font-size="24" fill="#FFFFFF">show where each number came from</text>
  <text x="1030" y="686" font-size="24" fill="#FFFFFF">put exceptions first</text>

  <rect x="80" y="770" width="8" height="52" fill="#61D8FE"/>
  <text x="110" y="806" font-size="30" font-weight="700" fill="#0D1117">You aren't building an AI. You're building a review.</text>
  <text x="1520" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
