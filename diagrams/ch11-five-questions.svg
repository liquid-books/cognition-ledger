<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6470"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#61D8FE"/></marker></defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="80" y="100" font-size="48" font-weight="800" fill="#0D1117" text-anchor="start" >Five questions every person is asking in silence</text>
<text x="80" y="146" font-size="26" font-weight="400" fill="#5B6470" text-anchor="start" >Answer them early and plainly, or the rumor mill will answer them for you.</text>
<text x="80" y="214" font-size="22" font-weight="700" fill="#5B6470" text-anchor="start" >WHAT THEY ARE ASKING (OFTEN SILENTLY)</text>
<text x="820" y="214" font-size="22" font-weight="700" fill="#5B6470" text-anchor="start" >WHAT A GOOD LEADER SAYS</text>
<rect x="80" y="232" width="700" height="80" rx="14" fill="#FF5CAD" />
<text x="110" y="282" font-size="28" font-weight="700" fill="#0D1117" text-anchor="start" >Is my job going away?</text>
<line x1="784" y1="272" x2="812" y2="272" stroke="#5B6470" stroke-width="3" marker-end="url(#ah)"/><rect x="820" y="232" width="700" height="80" rx="14" fill="#FFFFFF" stroke="#544AE9" stroke-width="3"/>
<text x="850" y="282" font-size="24" font-weight="600" fill="#0D1117" text-anchor="start" >Say what you know now, and when you'll know more.</text>
<rect x="80" y="328" width="700" height="80" rx="14" fill="#FF5CAD" />
<text x="110" y="378" font-size="28" font-weight="700" fill="#0D1117" text-anchor="start" >What will I do instead?</text>
<line x1="784" y1="368" x2="812" y2="368" stroke="#5B6470" stroke-width="3" marker-end="url(#ah)"/><rect x="820" y="328" width="700" height="80" rx="14" fill="#FFFFFF" stroke="#544AE9" stroke-width="3"/>
<text x="850" y="378" font-size="24" font-weight="600" fill="#0D1117" text-anchor="start" >Name the work the freed hours go to, team by team.</text>
<rect x="80" y="424" width="700" height="80" rx="14" fill="#FF5CAD" />
<text x="110" y="474" font-size="28" font-weight="700" fill="#0D1117" text-anchor="start" >Who decides?</text>
<line x1="784" y1="464" x2="812" y2="464" stroke="#5B6470" stroke-width="3" marker-end="url(#ah)"/><rect x="820" y="424" width="700" height="80" rx="14" fill="#FFFFFF" stroke="#544AE9" stroke-width="3"/>
<text x="850" y="474" font-size="24" font-weight="600" fill="#0D1117" text-anchor="start" >The budget owner signs the Hour Budget. Show it.</text>
<rect x="80" y="520" width="700" height="80" rx="14" fill="#FF5CAD" />
<text x="110" y="570" font-size="28" font-weight="700" fill="#0D1117" text-anchor="start" >What will I learn?</text>
<line x1="784" y1="560" x2="812" y2="560" stroke="#5B6470" stroke-width="3" marker-end="url(#ah)"/><rect x="820" y="520" width="700" height="80" rx="14" fill="#FFFFFF" stroke="#544AE9" stroke-width="3"/>
<text x="850" y="570" font-size="24" font-weight="600" fill="#0D1117" text-anchor="start" >A named path, on company time, with a start date.</text>
<rect x="80" y="616" width="700" height="80" rx="14" fill="#FF5CAD" />
<text x="110" y="666" font-size="28" font-weight="700" fill="#0D1117" text-anchor="start" >When will I hear more?</text>
<line x1="784" y1="656" x2="812" y2="656" stroke="#5B6470" stroke-width="3" marker-end="url(#ah)"/><rect x="820" y="616" width="700" height="80" rx="14" fill="#FFFFFF" stroke="#544AE9" stroke-width="3"/>
<text x="850" y="666" font-size="24" font-weight="600" fill="#0D1117" text-anchor="start" >Give a date. Then keep it.</text>
<rect x="80" y="750" width="8" height="52" rx="0" fill="#61D8FE" />
<text x="110" y="786" font-size="30" font-weight="700" fill="#0D1117" text-anchor="start" >Silence doesn't protect people. It hands the message to whoever tells the worst story.</text>
<text x="1520" y="866" font-size="22" font-weight="400" fill="#5B6470" text-anchor="end" >The Cognition Ledger · DrLee.ai</text>
