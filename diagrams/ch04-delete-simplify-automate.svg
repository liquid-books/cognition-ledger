<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="60" y="95" font-size="46" font-weight="800" fill="#0D1117">Only what survives the delete key earns a machine</text>
  <text x="60" y="140" font-size="26" fill="#5B6470">Classify every step the lean way, then work in this order, never the reverse</text>

  <!-- input label -->
  <text x="60" y="230" font-size="24" font-weight="700" fill="#5B6470">EVERY STEP</text>
  <text x="60" y="260" font-size="24" font-weight="700" fill="#5B6470">ON THE MAP</text>

  <!-- funnel sections -->
  <polygon points="60,290 520,330 520,690 60,730" fill="#E9ECEF"/>
  <polygon points="545,340 1005,370 1005,650 545,680" fill="#ADB5BD"/>
  <polygon points="1030,380 1540,400 1540,620 1030,640" fill="#61D8FE"/>

  <!-- section 1 -->
  <text x="95" y="395" font-size="30" font-weight="700" fill="#5B6470">STEP 1</text>
  <text x="95" y="455" font-size="54" font-weight="800" fill="#0D1117">Delete</text>
  <text x="95" y="500" font-size="28" font-weight="700" fill="#0D1117">pure waste</text>
  <text x="95" y="560" font-size="23" fill="#333333">The customer wouldn't</text>
  <text x="95" y="590" font-size="23" fill="#333333">notice if it stopped.</text>
  <text x="95" y="640" font-size="23" fill="#333333">Unread reports, extra</text>
  <text x="95" y="670" font-size="23" fill="#333333">reviews, duplicate logs</text>

  <!-- section 2 -->
  <text x="575" y="415" font-size="30" font-weight="700" fill="#0D1117">STEP 2</text>
  <text x="575" y="475" font-size="54" font-weight="800" fill="#0D1117">Simplify</text>
  <text x="575" y="520" font-size="28" font-weight="700" fill="#0D1117">necessary work</text>
  <text x="575" y="575" font-size="23" fill="#0D1117">Required by a rule, a control</text>
  <text x="575" y="605" font-size="23" fill="#0D1117">or today's systems. Shrink</text>
  <text x="575" y="635" font-size="23" fill="#0D1117">its effort; don't polish it.</text>

  <!-- section 3 -->
  <text x="1065" y="445" font-size="30" font-weight="700" fill="#0D1117">STEP 3</text>
  <text x="1065" y="505" font-size="54" font-weight="800" fill="#0D1117">Automate</text>
  <text x="1065" y="550" font-size="28" font-weight="700" fill="#0D1117">what's left</text>
  <text x="1065" y="595" font-size="23" fill="#0D1117">Now, and only now, go to Sort.</text>

  <!-- falling waste blocks under section 1 -->
  <rect x="150" y="745" width="46" height="30" rx="4" fill="#ADB5BD" transform="rotate(-12 173 760)"/>
  <rect x="250" y="752" width="46" height="30" rx="4" fill="#ADB5BD" transform="rotate(9 273 767)"/>
  <rect x="350" y="744" width="46" height="30" rx="4" fill="#ADB5BD" transform="rotate(-6 373 759)"/>
  <text x="430" y="770" font-size="22" fill="#5B6470">never built, never run</text>

  <rect x="60" y="800" width="8" height="50" fill="#61D8FE"/>
  <text x="90" y="835" font-size="30" font-weight="700" fill="#0D1117">Every step you delete is a step you never have to build, check or pay to run.</text>
  <text x="1540" y="885" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
