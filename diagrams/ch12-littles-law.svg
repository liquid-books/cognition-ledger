<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6470"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#61D8FE"/></marker></defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="80" y="100" font-size="48" font-weight="800" fill="#0D1117" text-anchor="start" >Lead time is the pile divided by the pace</text>
<text x="80" y="146" font-size="26" font-weight="400" fill="#5B6470" text-anchor="start" >Little's law (1961): open work equals throughput times lead time. It holds for any stable queue.</text>
<text x="580" y="215" font-size="22" font-weight="700" fill="#5B6470" text-anchor="middle" >OPEN WORK</text>
<text x="970" y="215" font-size="22" font-weight="700" fill="#5B6470" text-anchor="middle" >THROUGHPUT</text>
<text x="1365" y="215" font-size="22" font-weight="700" fill="#5B6470" text-anchor="middle" >LEAD TIME</text>
<text x="80" y="293" font-size="26" font-weight="700" fill="#0D1117" text-anchor="start" >Disputes today</text>
<rect x="430" y="235" width="300" height="100" rx="14" fill="#ADB5BD" />
<text x="580" y="285" font-size="40" font-weight="800" fill="#0D1117" text-anchor="middle" >about 450</text>
<text x="580" y="319" font-size="22" font-weight="400" fill="#0D1117" text-anchor="middle" >open at any moment</text>
<text x="780" y="297" font-size="44" font-weight="700" fill="#5B6470" text-anchor="middle" >=</text>
<rect x="830" y="235" width="280" height="100" rx="14" fill="#E9ECEF" />
<text x="970" y="285" font-size="36" font-weight="800" fill="#0D1117" text-anchor="middle" >32 a day</text>
<text x="970" y="319" font-size="22" font-weight="400" fill="#5B6470" text-anchor="middle" >225 a week</text>
<text x="1160" y="297" font-size="44" font-weight="700" fill="#5B6470" text-anchor="middle" >×</text>
<rect x="1210" y="235" width="310" height="100" rx="14" fill="#E9ECEF" />
<text x="1365" y="285" font-size="36" font-weight="800" fill="#0D1117" text-anchor="middle" >14 days</text>
<text x="1365" y="319" font-size="22" font-weight="400" fill="#5B6470" text-anchor="middle" >request to resolution</text>
<text x="80" y="423" font-size="26" font-weight="700" fill="#0D1117" text-anchor="start" >Three days faster</text>
<rect x="430" y="365" width="300" height="100" rx="14" fill="#61D8FE" />
<text x="580" y="415" font-size="40" font-weight="800" fill="#0D1117" text-anchor="middle" >about 354</text>
<text x="580" y="449" font-size="22" font-weight="400" fill="#0D1117" text-anchor="middle" >about 96 fewer open</text>
<text x="780" y="427" font-size="44" font-weight="700" fill="#5B6470" text-anchor="middle" >=</text>
<rect x="830" y="365" width="280" height="100" rx="14" fill="#E9ECEF" />
<text x="970" y="415" font-size="36" font-weight="800" fill="#0D1117" text-anchor="middle" >32 a day</text>
<text x="970" y="449" font-size="22" font-weight="400" fill="#5B6470" text-anchor="middle" >same volume</text>
<text x="1160" y="427" font-size="44" font-weight="700" fill="#5B6470" text-anchor="middle" >×</text>
<rect x="1210" y="365" width="310" height="100" rx="14" fill="#E9ECEF" />
<text x="1365" y="415" font-size="36" font-weight="800" fill="#0D1117" text-anchor="middle" >11 days</text>
<text x="1365" y="449" font-size="22" font-weight="400" fill="#5B6470" text-anchor="middle" >3 days sooner</text>
<rect x="80" y="505" width="1440" height="4" rx="0" fill="#E9ECEF" />
<text x="80" y="560" font-size="26" font-weight="700" fill="#0D1117" text-anchor="start" >The same law at a human checkpoint</text>
<rect x="430" y="580" width="300" height="100" rx="14" fill="#FF5CAD" />
<text x="580" y="630" font-size="40" font-weight="800" fill="#0D1117" text-anchor="middle" >5 days</text>
<text x="580" y="664" font-size="22" font-weight="400" fill="#0D1117" text-anchor="middle" >wait at the checkpoint</text>
<text x="780" y="642" font-size="44" font-weight="700" fill="#5B6470" text-anchor="middle" >=</text>
<rect x="830" y="580" width="280" height="100" rx="14" fill="#E9ECEF" />
<text x="970" y="630" font-size="36" font-weight="800" fill="#0D1117" text-anchor="middle" >300</text>
<text x="970" y="664" font-size="22" font-weight="400" fill="#5B6470" text-anchor="middle" >items in the queue</text>
<text x="1160" y="642" font-size="44" font-weight="700" fill="#5B6470" text-anchor="middle" >÷</text>
<rect x="1210" y="580" width="310" height="100" rx="14" fill="#E9ECEF" />
<text x="1365" y="630" font-size="36" font-weight="800" fill="#0D1117" text-anchor="middle" >60 a day</text>
<text x="1365" y="664" font-size="22" font-weight="400" fill="#5B6470" text-anchor="middle" >approved by people</text>
<rect x="80" y="750" width="8" height="52" rx="0" fill="#61D8FE" />
<text x="110" y="786" font-size="30" font-weight="700" fill="#0D1117" text-anchor="start" >Speed up the agents all you like. If the human queue stays the same, so does the wait.</text>
<text x="1520" y="866" font-size="22" font-weight="400" fill="#5B6470" text-anchor="end" >The Cognition Ledger · DrLee.ai</text>
