<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="105" font-size="46" font-weight="800" fill="#0D1117">Same electricity. Only the new floor plan paid off.</text>
  <text x="80" y="152" font-size="28" fill="#5B6470">Seen from above: how power reached the machines</text>

  <rect x="80" y="190" width="690" height="530" rx="22" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="3"/>
  <text x="120" y="240" font-size="24" font-weight="800" fill="#5B6470" letter-spacing="2">BEFORE: SHAFTS AND BELTS</text>
  <rect x="120" y="270" width="110" height="80" rx="10" fill="#ADB5BD"/>
  <text x="175" y="303" font-size="22" font-weight="700" fill="#0D1117" text-anchor="middle">One big</text>
  <text x="175" y="331" font-size="22" font-weight="700" fill="#0D1117" text-anchor="middle">motor</text>
  <rect x="230" y="303" width="510" height="14" rx="7" fill="#5B6470"/>
  <text x="485" y="290" font-size="22" fill="#5B6470" text-anchor="middle">line shaft turning all day</text>
  <g stroke="#ADB5BD" stroke-width="4">
    <line x1="290" y1="317" x2="290" y2="430"/><line x1="380" y1="317" x2="380" y2="430"/>
    <line x1="470" y1="317" x2="470" y2="430"/><line x1="560" y1="317" x2="560" y2="430"/>
    <line x1="650" y1="317" x2="650" y2="430"/>
  </g>
  <g fill="#E9ECEF" stroke="#ADB5BD" stroke-width="3">
    <rect x="260" y="430" width="60" height="60" rx="8"/><rect x="350" y="430" width="60" height="60" rx="8"/>
    <rect x="440" y="430" width="60" height="60" rx="8"/><rect x="530" y="430" width="60" height="60" rx="8"/>
    <rect x="620" y="430" width="60" height="60" rx="8"/>
  </g>
  <text x="470" y="525" font-size="22" fill="#5B6470" text-anchor="middle">machines lined up under the shaft</text>
  <g font-size="26" fill="#333333">
    <text x="120" y="590">Machines sit where the shaft runs</text>
    <text x="120" y="632">One broken shaft stops the room</text>
    <text x="120" y="674">Power burned turning idle belts</text>
  </g>

  <rect x="830" y="190" width="690" height="530" rx="22" fill="#FFFFFF" stroke="#544AE9" stroke-width="4"/>
  <text x="870" y="240" font-size="24" font-weight="800" fill="#544AE9" letter-spacing="2">AFTER: A MOTOR IN EVERY MACHINE</text>
  <g fill="#E9ECEF" stroke="#ADB5BD" stroke-width="3">
    <rect x="900" y="400" width="60" height="60" rx="8"/><rect x="1010" y="360" width="60" height="60" rx="8"/>
    <rect x="1120" y="400" width="60" height="60" rx="8"/><rect x="1230" y="360" width="60" height="60" rx="8"/>
    <rect x="1340" y="400" width="60" height="60" rx="8"/>
  </g>
  <g fill="#61D8FE">
    <circle cx="930" cy="430" r="15"/><circle cx="1040" cy="390" r="15"/>
    <circle cx="1150" cy="430" r="15"/><circle cx="1260" cy="390" r="15"/><circle cx="1370" cy="430" r="15"/>
  </g>
  <path d="M870 500 H1470" stroke="#544AE9" stroke-width="5"/>
  <path d="M1456 488 L1474 500 L1456 512" stroke="#544AE9" stroke-width="5" fill="none"/>
  <text x="870" y="320" font-size="22" fill="#5B6470">no shafts, open single-story floor</text>
  <text x="1170" y="535" font-size="22" fill="#5B6470" text-anchor="middle">machines placed in the order work flows</text>
  <g font-size="26" fill="#333333">
    <text x="870" y="590">Each machine carries its own motor</text>
    <text x="870" y="632">One broken motor stops one machine</text>
    <text x="870" y="674">Layout follows the work, not the power</text>
  </g>

  <rect x="80" y="768" width="8" height="56" fill="#61D8FE"/>
  <text x="110" y="806" font-size="32" font-weight="700" fill="#0D1117">Electricity paid off when the layout changed, not when the motor arrived.</text>
  <text x="1520" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
