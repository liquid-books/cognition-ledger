<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="1200" fill="#FFFFFF"/>
  <text x="80" y="100" font-size="48" font-weight="800" fill="#0D1117">Tool names change. The ledger's questions don't.</text>
  <text x="80" y="152" font-size="26" fill="#5B6470">Learn the lasting kinds of work and the six questions. Then slot each new tool in.</text>

  <text x="80" y="228" font-size="22" font-weight="700" fill="#5B6470" letter-spacing="1.5">TODAY'S NAMES · THESE WILL CHANGE</text>
  <g font-size="26" fill="#5B6470" text-anchor="middle">
    <rect x="80" y="248" width="330" height="104" rx="16" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="3" stroke-dasharray="12 9"/>
    <text x="245" y="292">Scripts, RPA,</text><text x="245" y="326">integrations</text>
    <rect x="450" y="248" width="330" height="104" rx="16" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="3" stroke-dasharray="12 9"/>
    <text x="615" y="310">A Skill</text>
    <rect x="820" y="248" width="330" height="104" rx="16" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="3" stroke-dasharray="12 9"/>
    <text x="985" y="310">An agent</text>
    <rect x="1190" y="248" width="330" height="104" rx="16" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="3" stroke-dasharray="12 9"/>
    <text x="1355" y="292">A person with an</text><text x="1355" y="326">AI assistant</text>
  </g>
  <g stroke="#ADB5BD" stroke-width="4" fill="#ADB5BD">
    <line x1="245" y1="358" x2="245" y2="410"/><polygon points="235,406 255,406 245,422" stroke="none"/>
    <line x1="615" y1="358" x2="615" y2="410"/><polygon points="605,406 625,406 615,422" stroke="none"/>
    <line x1="985" y1="358" x2="985" y2="410"/><polygon points="975,406 995,406 985,422" stroke="none"/>
    <line x1="1355" y1="358" x2="1355" y2="410"/><polygon points="1345,406 1365,406 1355,422" stroke="none"/>
  </g>

  <text x="80" y="462" font-size="22" font-weight="700" fill="#5B6470" letter-spacing="1.5">LASTING KINDS OF WORK · THESE WON'T</text>
  <g text-anchor="middle" fill="#0D1117">
    <rect x="80" y="482" width="330" height="170" rx="18" fill="#61D8FE"/>
    <text x="245" y="540" font-size="28" font-weight="800">Plain automation</text>
    <text x="245" y="586" font-size="24">Fixed rules on</text><text x="245" y="618" font-size="24">clean inputs</text>
    <rect x="450" y="482" width="330" height="170" rx="18" fill="#61D8FE"/>
    <text x="615" y="540" font-size="28" font-weight="800">Packaged expertise</text>
    <text x="615" y="586" font-size="24">Your best person's</text><text x="615" y="618" font-size="24">know-how, written once</text>
    <rect x="820" y="482" width="330" height="170" rx="18" fill="#61D8FE"/>
    <text x="985" y="540" font-size="26" font-weight="800">Autonomous cognition</text>
    <text x="985" y="586" font-size="24">A digital worker</text><text x="985" y="618" font-size="24">for a whole job</text>
    <rect x="1190" y="482" width="330" height="170" rx="18" fill="#FF5CAD"/>
    <text x="1355" y="540" font-size="28" font-weight="800">Human judgment</text>
    <text x="1355" y="586" font-size="24">AI drafts and researches;</text><text x="1355" y="618" font-size="24">a person decides</text>
  </g>

  <text x="80" y="722" font-size="22" font-weight="700" fill="#5B6470" letter-spacing="1.5">SIX QUESTIONS · ASKED OF EVERY ONE OF THEM, FOREVER</text>
  <g fill="#FFFFFF" text-anchor="middle">
    <rect x="80" y="742" width="228" height="200" rx="18" fill="#544AE9"/>
    <text x="194" y="790" font-size="24" font-weight="800" letter-spacing="2">MAP</text>
    <text x="194" y="838" font-size="25">Where is the</text><text x="194" y="872" font-size="25">waste?</text>
    <rect x="322" y="742" width="228" height="200" rx="18" fill="#544AE9"/>
    <text x="436" y="790" font-size="24" font-weight="800" letter-spacing="2">SORT</text>
    <text x="436" y="838" font-size="25">Which kind of</text><text x="436" y="872" font-size="25">work is it?</text>
    <rect x="564" y="742" width="228" height="200" rx="18" fill="#544AE9"/>
    <text x="678" y="790" font-size="24" font-weight="800" letter-spacing="2">SIZE</text>
    <text x="678" y="838" font-size="25">What changes in</text><text x="678" y="872" font-size="25">time, money</text><text x="678" y="906" font-size="25">and quality?</text>
    <rect x="806" y="742" width="228" height="200" rx="18" fill="#544AE9"/>
    <text x="920" y="790" font-size="24" font-weight="800" letter-spacing="2">SHIP</text>
    <text x="920" y="838" font-size="25">Does it work on</text><text x="920" y="872" font-size="25">20 real cases?</text>
    <rect x="1048" y="742" width="228" height="200" rx="18" fill="#544AE9"/>
    <text x="1162" y="790" font-size="24" font-weight="800" letter-spacing="2">BANK</text>
    <text x="1162" y="838" font-size="25">Where does</text><text x="1162" y="872" font-size="25">every hour go?</text>
    <rect x="1290" y="742" width="230" height="200" rx="18" fill="#544AE9"/>
    <text x="1405" y="790" font-size="24" font-weight="800" letter-spacing="2">PROVE</text>
    <text x="1405" y="838" font-size="25">Did finance</text><text x="1405" y="872" font-size="25">verify it?</text>
  </g>

  <rect x="80" y="1010" width="8" height="56" fill="#61D8FE"/>
  <text x="110" y="1048" font-size="32" font-weight="700" fill="#0D1117">Learn the questions, and every new tool fits the same ledger.</text>
  <text x="1520" y="1160" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
