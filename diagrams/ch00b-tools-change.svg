<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="105" font-size="52" font-weight="800" fill="#0D1117">Tool names change. The two ideas underneath don't.</text>
  <text x="80" y="152" font-size="28" fill="#5B6470">Learn the idea and you'll recognize it under any brand name.</text>

  <g font-size="28" fill="#5B6470" text-anchor="middle">
    <rect x="80" y="190" width="690" height="74" rx="16" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="425" y="237">Today's name: a Skill</text>
    <rect x="830" y="190" width="690" height="74" rx="16" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="1175" y="237">Today's name: an agent</text>
  </g>

  <rect x="80" y="284" width="690" height="170" rx="20" fill="#1A184C"/>
  <text x="425" y="342" font-size="38" font-weight="800" fill="#FFFFFF" text-anchor="middle">PACKAGED EXPERTISE</text>
  <text x="425" y="388" font-size="26" fill="#FFFFFF" text-anchor="middle">Your best person's know-how,</text>
  <text x="425" y="424" font-size="26" fill="#FFFFFF" text-anchor="middle">written down once, used by everyone</text>

  <rect x="830" y="284" width="690" height="170" rx="20" fill="#1A184C"/>
  <text x="1175" y="342" font-size="38" font-weight="800" fill="#FFFFFF" text-anchor="middle">AUTONOMOUS COGNITION</text>
  <text x="1175" y="388" font-size="26" fill="#FFFFFF" text-anchor="middle">A digital worker that runs a whole job,</text>
  <text x="1175" y="424" font-size="26" fill="#FFFFFF" text-anchor="middle">choosing its own steps toward a goal</text>

  <g font-size="25" font-weight="600" fill="#0D1117" text-anchor="middle">
    <rect x="80" y="490" width="200" height="120" rx="16" fill="#FF5CAD"/>
    <text x="180" y="543">A person</text><text x="180" y="575">starts it</text>
    <rect x="325" y="490" width="200" height="120" rx="16" fill="#61D8FE"/>
    <text x="425" y="543">AI does it</text><text x="425" y="575">the house way</text>
    <rect x="570" y="490" width="200" height="120" rx="16" fill="#FF5CAD"/>
    <text x="670" y="543">A person</text><text x="670" y="575">reviews</text>

    <rect x="830" y="490" width="200" height="120" rx="16" fill="#E9ECEF"/>
    <text x="930" y="543">An event</text><text x="930" y="575">starts it</text>
    <rect x="1075" y="490" width="200" height="120" rx="16" fill="#61D8FE"/>
    <text x="1175" y="543">AI picks steps</text><text x="1175" y="575">and tools</text>
    <rect x="1320" y="490" width="200" height="120" rx="16" fill="#FF5CAD"/>
    <text x="1420" y="543">A person</text><text x="1420" y="575">approves</text>
  </g>
  <g stroke="#5B6470" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M287 550 H318 M308 540 L318 550 L308 560"/>
    <path d="M532 550 H563 M553 540 L563 550 L553 560"/>
    <path d="M1037 550 H1068 M1058 540 L1068 550 L1058 560"/>
    <path d="M1282 550 H1313 M1303 540 L1313 550 L1303 560"/>
  </g>
  <g font-size="24" fill="#5B6470" text-anchor="middle">
    <text x="425" y="660">Example: Brightwater's quote builder</text>
    <text x="425" y="694">One task, done the house way, every time</text>
    <text x="1175" y="660">Example: Brightwater's PO intake agent</text>
    <text x="1175" y="694">An email lands; the order gets keyed</text>
  </g>

  <rect x="80" y="768" width="8" height="56" fill="#61D8FE"/>
  <text x="110" y="806" font-size="31" font-weight="700" fill="#0D1117">In ten years you'll still be choosing: packaged expertise or autonomous cognition.</text>
  <text x="1520" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
