<text x="710" y="669" font-size="22" font-weight="400" fill="#0D1117" text-anchor="middle" >Workforce plan,</text>
<text x="710" y="695" font-size="22" font-weight="400" fill="#0D1117" text-anchor="middle" >reskilling, the message.</text>
