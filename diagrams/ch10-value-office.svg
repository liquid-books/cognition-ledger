<text x="820" y="387" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Finance partner</text>
<text x="820" y="419" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle" >Prices levers.</text>
<text x="820" y="445" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle" >Verifies realized value.</text>
<rect x="560" y="597" width="300" height="116" rx="16" fill="#FF5CAD" />
