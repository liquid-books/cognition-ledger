<text x="220" y="387" font-size="24" font-weight="700" fill="#0D1117" text-anchor="middle" >Value stream owners</text>
<text x="220" y="419" font-size="22" font-weight="400" fill="#0D1117" text-anchor="middle" >Run the board weekly.</text>
<text x="220" y="445" font-size="22" font-weight="400" fill="#0D1117" text-anchor="middle" >Own the Hour Budgets.</text>
<rect x="1060" y="200" width="460" height="500" rx="18" fill="#E9ECEF" />
<text x="1090" y="250" font-size="28" font-weight="700" fill="#0D1117" text-anchor="start" >What it is not</text>
<text x="1090" y="310" font-size="24" font-weight="700" fill="#0D1117" text-anchor="start" >Not IT's backlog.</text>
<text x="1090" y="342" font-size="22" font-weight="400" fill="#333333" text-anchor="start" >It decides what is worth building.</text>
<text x="1090" y="406" font-size="24" font-weight="700" fill="#0D1117" text-anchor="start" >Not a demo lab.</text>
<text x="1090" y="438" font-size="22" font-weight="400" fill="#333333" text-anchor="start" >Pilots answer to the ledger.</text>
<text x="1090" y="502" font-size="24" font-weight="700" fill="#0D1117" text-anchor="start" >Not a tool committee.</text>
<text x="1090" y="534" font-size="22" font-weight="400" fill="#333333" text-anchor="start" >It funds outcomes, not licences.</text>
<text x="1090" y="598" font-size="24" font-weight="700" fill="#0D1117" text-anchor="start" >Not a big department.</text>
<text x="1090" y="630" font-size="22" font-weight="400" fill="#333333" text-anchor="start" >Five chairs, a few hours a week.</text>
<rect x="80" y="750" width="8" height="52" rx="0" fill="#61D8FE" />
<text x="110" y="786" font-size="30" font-weight="700" fill="#0D1117" text-anchor="start" >Its product isn't AI. Its product is verified value on the P&amp;L.</text>
<text x="1520" y="866" font-size="22" font-weight="400" fill="#5B6470" text-anchor="end" >The Cognition Ledger · DrLee.ai</text>
