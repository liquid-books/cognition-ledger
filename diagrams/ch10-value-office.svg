<text x="330" y="637" font-size="24" font-weight="700" fill="#0D1117" text-anchor="middle" >Builder lead</text>
<text x="330" y="669" font-size="22" font-weight="400" fill="#0D1117" text-anchor="middle" >Builds Skills and agents.</text>
<text x="330" y="695" font-size="22" font-weight="400" fill="#0D1117" text-anchor="middle" >Reports minutes, errors.</text>
