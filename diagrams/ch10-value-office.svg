<text x="520" y="227" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Executive sponsor</text>
<text x="520" y="259" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle" >Chairs it. Breaks ties.</text>
<text x="520" y="285" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle" >Makes kill calls.</text>
