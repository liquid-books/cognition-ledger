<text x="80" y="100" font-size="48" font-weight="800" fill="#0D1117" text-anchor="start" >The AI Value Office is five chairs, not a department</text>
<text x="80" y="146" font-size="26" font-weight="400" fill="#5B6470" text-anchor="start" >A small standing group that runs the ledger across every value stream.</text>
