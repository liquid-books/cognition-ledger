<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="60" y="92" font-size="46" font-weight="800" fill="#0D1117">A Skill stays out of the way until the work needs it</text>
  <text x="60" y="135" font-size="26" fill="#5B6470">Progressive disclosure: one folder, loaded in three layers, shown here with Brightwater's quote Skill</text>

  <!-- folder -->
  <rect x="60" y="190" width="480" height="560" rx="20" fill="#F1F3F5"/>
  <path d="M60,210 a20,20 0 0 1 20,-20 h150 l30,30 h-200 z" fill="#ADB5BD"/>
  <text x="90" y="265" font-size="28" font-weight="800" fill="#0D1117">quote-builder/</text>
  <rect x="90" y="295" width="420" height="210" rx="12" fill="#FFFFFF" stroke="#61D8FE" stroke-width="3"/>
  <text x="115" y="335" font-size="25" font-weight="800" fill="#0D1117">SKILL.md</text>
  <rect x="115" y="352" width="370" height="64" rx="8" fill="#61D8FE"/>
  <text x="130" y="380" font-size="21" font-weight="700" fill="#0D1117">name: quote-builder</text>
  <text x="130" y="406" font-size="21" fill="#0D1117">description: what it does, when</text>
  <text x="115" y="452" font-size="22" fill="#333333">Instructions: how Brightwater</text>
  <text x="115" y="480" font-size="22" fill="#333333">builds a quote, step by step</text>
  <rect x="90" y="525" width="420" height="58" rx="12" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="115" y="562" font-size="22" fill="#333333">pricing-rules.md</text>
  <rect x="90" y="598" width="420" height="58" rx="12" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="115" y="635" font-size="22" fill="#333333">quote-template.docx</text>
  <rect x="90" y="671" width="420" height="58" rx="12" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="115" y="708" font-size="22" fill="#333333">check_margin.py</text>

  <!-- layers -->
  <rect x="640" y="195" width="900" height="150" rx="18" fill="#61D8FE"/>
  <text x="670" y="240" font-size="23" font-weight="700" fill="#0D1117">LAYER 1 · ALWAYS LOADED</text>
  <text x="670" y="282" font-size="30" font-weight="800" fill="#0D1117">The name and description</text>
  <text x="670" y="320" font-size="22" fill="#0D1117">A sentence or two, so the AI knows every Skill on the shelf</text>

  <rect x="640" y="370" width="900" height="170" rx="18" fill="#FFFFFF" stroke="#61D8FE" stroke-width="5"/>
  <text x="670" y="415" font-size="23" font-weight="700" fill="#5B6470">LAYER 2 · LOADED WHEN A TASK MATCHES</text>
  <text x="670" y="457" font-size="30" font-weight="800" fill="#0D1117">The instructions</text>
  <text x="670" y="495" font-size="22" fill="#333333">The body of SKILL.md: the house way, read only when</text>
  <text x="670" y="523" font-size="22" fill="#333333">someone asks for a quote</text>

  <rect x="640" y="565" width="900" height="185" rx="18" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="670" y="610" font-size="23" font-weight="700" fill="#5B6470">LAYER 3 · LOADED ONLY WHEN NEEDED</text>
  <text x="670" y="652" font-size="30" font-weight="800" fill="#0D1117">Reference files, templates, scripts</text>
  <text x="670" y="690" font-size="22" fill="#333333">Opened on demand. A script runs and only its answer</text>
  <text x="670" y="718" font-size="22" fill="#333333">comes back, not its code.</text>

  <!-- connectors -->
  <line x1="490" y1="384" x2="640" y2="270" stroke="#61D8FE" stroke-width="4"/>
  <line x1="510" y1="466" x2="640" y2="455" stroke="#61D8FE" stroke-width="4"/>
  <line x1="510" y1="627" x2="640" y2="657" stroke="#ADB5BD" stroke-width="4"/>

  <rect x="60" y="785" width="8" height="54" fill="#61D8FE"/>
  <text x="90" y="823" font-size="29" font-weight="700" fill="#0D1117">Only names and descriptions are always loaded, so many Skills can sit ready without slowing anything.</text>
  <text x="1540" y="880" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
