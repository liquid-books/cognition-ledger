<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6470"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#61D8FE"/></marker></defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="80" y="100" font-size="48" font-weight="800" fill="#0D1117" text-anchor="start" >Cheap muscle invented businesses, not just savings</text>
<text x="80" y="146" font-size="26" font-weight="400" fill="#5B6470" text-anchor="start" >The winners of the last revolution didn't do old work cheaper. They built things that couldn't exist before.</text>
<rect x="80" y="190" width="1440" height="40" rx="0" fill="#FFFFFF" />
<text x="80" y="215" font-size="24" font-weight="700" fill="#5B6470" text-anchor="start" >CHEAP MUSCLE: steam, rail and electricity made moving and making things cheap</text>
<line x1="100" y1="330" x2="1500" y2="330" stroke="#ADB5BD" stroke-width="4"/><circle cx="175" cy="330" r="14" fill="#ADB5BD"/><text x="175" y="300" font-size="28" font-weight="800" fill="#0D1117" text-anchor="middle" >1830</text>
<text x="175" y="382" font-size="24" font-weight="700" fill="#0D1117" text-anchor="middle" >Inter-city</text>
<text x="175" y="412" font-size="24" font-weight="700" fill="#0D1117" text-anchor="middle" >steam railway</text>
<text x="175" y="442" font-size="20" font-weight="400" fill="#5B6470" text-anchor="middle" >Liverpool to Manchester</text>
<circle cx="425" cy="330" r="14" fill="#ADB5BD"/><text x="425" y="300" font-size="28" font-weight="800" fill="#0D1117" text-anchor="middle" >1852</text>
<text x="425" y="382" font-size="24" font-weight="700" fill="#0D1117" text-anchor="middle" >Department</text>
<text x="425" y="412" font-size="24" font-weight="700" fill="#0D1117" text-anchor="middle" >store</text>
<text x="425" y="442" font-size="20" font-weight="400" fill="#5B6470" text-anchor="middle" >Fixed prices, returns</text>
<circle cx="675" cy="330" r="14" fill="#ADB5BD"/><text x="675" y="300" font-size="28" font-weight="800" fill="#0D1117" text-anchor="middle" >1855</text>
<text x="675" y="382" font-size="24" font-weight="700" fill="#0D1117" text-anchor="middle" >The org chart</text>
<text x="675" y="412" font-size="20" font-weight="400" fill="#5B6470" text-anchor="middle" >A railroad invents managers</text>
<circle cx="925" cy="330" r="14" fill="#ADB5BD"/><text x="925" y="300" font-size="28" font-weight="800" fill="#0D1117" text-anchor="middle" >1872</text>
<text x="925" y="382" font-size="24" font-weight="700" fill="#0D1117" text-anchor="middle" >Mail-order</text>
<text x="925" y="412" font-size="24" font-weight="700" fill="#0D1117" text-anchor="middle" >catalog</text>
<text x="925" y="442" font-size="20" font-weight="400" fill="#5B6470" text-anchor="middle" >163 items on one sheet</text>
<circle cx="1175" cy="330" r="14" fill="#ADB5BD"/><text x="1175" y="300" font-size="28" font-weight="800" fill="#0D1117" text-anchor="middle" >1883</text>
<text x="1175" y="382" font-size="24" font-weight="700" fill="#0D1117" text-anchor="middle" >Standard</text>
<text x="1175" y="412" font-size="24" font-weight="700" fill="#0D1117" text-anchor="middle" >time zones</text>
<text x="1175" y="442" font-size="20" font-weight="400" fill="#5B6470" text-anchor="middle" >Set by the railroads</text>
<circle cx="1425" cy="330" r="14" fill="#ADB5BD"/><text x="1425" y="300" font-size="28" font-weight="800" fill="#0D1117" text-anchor="middle" >1916</text>
<text x="1425" y="382" font-size="24" font-weight="700" fill="#0D1117" text-anchor="middle" >Self-service</text>
<text x="1425" y="412" font-size="24" font-weight="700" fill="#0D1117" text-anchor="middle" >grocery</text>
<text x="1425" y="442" font-size="20" font-weight="400" fill="#5B6470" text-anchor="middle" >Shoppers pick for themselves</text>
<text x="80" y="540" font-size="24" font-weight="700" fill="#544AE9" text-anchor="start" >CHEAP COGNITION: reading, deciding, drafting and checking now cost a little per unit</text>
<rect x="80" y="565" width="345" height="130" rx="16" fill="#61D8FE" />
<text x="252" y="612" font-size="24" font-weight="700" fill="#0D1117" text-anchor="middle" >Outcome pricing</text>
<text x="252" y="646" font-size="21" font-weight="400" fill="#0D1117" text-anchor="middle" >Sell the result,</text>
<text x="252" y="672" font-size="21" font-weight="400" fill="#0D1117" text-anchor="middle" >not the hours</text>
<rect x="445" y="565" width="345" height="130" rx="16" fill="#61D8FE" />
<text x="617" y="612" font-size="24" font-weight="700" fill="#0D1117" text-anchor="middle" >Productised services</text>
<text x="617" y="646" font-size="21" font-weight="400" fill="#0D1117" text-anchor="middle" >Fixed scope and price,</text>
<text x="617" y="672" font-size="21" font-weight="400" fill="#0D1117" text-anchor="middle" >machine-run</text>
<rect x="810" y="565" width="345" height="130" rx="16" fill="#61D8FE" />
<text x="982" y="612" font-size="24" font-weight="700" fill="#0D1117" text-anchor="middle" >Know-how as a product</text>
<text x="982" y="646" font-size="21" font-weight="400" fill="#0D1117" text-anchor="middle" >Sell the Skills and</text>
<text x="982" y="672" font-size="21" font-weight="400" fill="#0D1117" text-anchor="middle" >agents you built</text>
<rect x="1175" y="565" width="345" height="130" rx="16" fill="#61D8FE" />
<text x="1347" y="612" font-size="24" font-weight="700" fill="#0D1117" text-anchor="middle" >The too-expensive list</text>
<text x="1347" y="646" font-size="21" font-weight="400" fill="#0D1117" text-anchor="middle" >Work nobody could</text>
<text x="1347" y="672" font-size="21" font-weight="400" fill="#0D1117" text-anchor="middle" >afford to think about</text>
<rect x="80" y="750" width="8" height="52" rx="0" fill="#61D8FE" />
<text x="110" y="786" font-size="30" font-weight="700" fill="#0D1117" text-anchor="start" >Ask what can only exist now, not what you can do cheaper.</text>
<text x="1520" y="866" font-size="22" font-weight="400" fill="#5B6470" text-anchor="end" >The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
