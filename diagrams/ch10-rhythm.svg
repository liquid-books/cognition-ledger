<text x="80" y="100" font-size="48" font-weight="800" fill="#0D1117" text-anchor="start" >Four meetings keep the books open</text>
<text x="80" y="146" font-size="26" font-weight="400" fill="#5B6470" text-anchor="start" >The ledger is not a report you write once. It is a rhythm, from a weekly stand-up to the yearly budget.</text>
