<text x="736" y="249" font-size="28" font-weight="700" fill="#0D1117" text-anchor="start" >Weekly · 30 minutes</text>
<text x="736" y="283" font-size="22" font-weight="700" fill="#5B6470" text-anchor="start" >Value stream owner and builders</text>
<text x="736" y="311" font-size="24" font-weight="400" fill="#333333" text-anchor="start" >Move tickets, clear blockers, hold the WIP limit</text>
<rect x="700" y="345" width="14" height="104" rx="4" fill="#ADB5BD" />
<text x="736" y="379" font-size="28" font-weight="700" fill="#0D1117" text-anchor="start" >Monthly · the leak report</text>
<text x="736" y="413" font-size="22" font-weight="700" fill="#5B6470" text-anchor="start" >Executive sponsor</text>
<text x="736" y="441" font-size="24" font-weight="400" fill="#333333" text-anchor="start" >Hours with no lever, decisions still owed, kills and parks</text>
<rect x="700" y="475" width="14" height="104" rx="4" fill="#544AE9" />
<text x="736" y="509" font-size="28" font-weight="700" fill="#0D1117" text-anchor="start" >Quarterly · verification</text>
<text x="736" y="543" font-size="22" font-weight="700" fill="#5B6470" text-anchor="start" >CFO and executive team</text>
<text x="736" y="571" font-size="24" font-weight="400" fill="#333333" text-anchor="start" >Finance verifies realized lines; the dashboard goes up</text>
<rect x="700" y="605" width="14" height="104" rx="4" fill="#1A184C" />
<text x="736" y="639" font-size="28" font-weight="700" fill="#0D1117" text-anchor="start" >Yearly · re-basing</text>
<text x="736" y="673" font-size="22" font-weight="700" fill="#5B6470" text-anchor="start" >Budget owners and finance</text>
<text x="736" y="701" font-size="24" font-weight="400" fill="#333333" text-anchor="start" >Next year's budgets start from realized value</text>
<rect x="80" y="750" width="8" height="52" rx="0" fill="#61D8FE" />
<text x="110" y="786" font-size="30" font-weight="700" fill="#0D1117" text-anchor="start" >Skip the weekly and tickets stall. Skip the quarterly and the money stays a rumor.</text>
<text x="1520" y="866" font-size="22" font-weight="400" fill="#5B6470" text-anchor="end" >The Cognition Ledger · DrLee.ai</text>
