<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="1200" fill="#FFFFFF"/>
  <text x="80" y="100" font-size="46" font-weight="800" fill="#0D1117">If you can't fill in this card, the agent isn't ready</text>
  <text x="80" y="148" font-size="26" fill="#5B6470">Job description: Brightwater's dispute triage agent (OTC-04)</text>

  <rect x="80" y="185" width="1440" height="850" rx="22" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="2"/>

  <!-- rows: label column 80-420 -->
  <g font-size="26">
    <!-- Goal -->
    <rect x="100" y="205" width="300" height="96" rx="12" fill="#E9ECEF"/>
    <text x="125" y="263" font-weight="800" fill="#0D1117">Goal</text>
    <text x="430" y="245" fill="#333333">Facts gathered, category set and a resolution drafted</text>
    <text x="430" y="283" fill="#333333">for every new dispute within 4 working hours</text>

    <!-- Trigger -->
    <rect x="100" y="316" width="300" height="96" rx="12" fill="#61D8FE"/>
    <text x="125" y="374" font-weight="800" fill="#0D1117">Trigger</text>
    <text x="430" y="356" fill="#333333">A dispute is logged in the AR system, or a</text>
    <text x="430" y="394" fill="#333333">customer email is tagged as a dispute</text>

    <!-- Tools -->
    <rect x="100" y="427" width="300" height="96" rx="12" fill="#61D8FE"/>
    <text x="125" y="485" font-weight="800" fill="#0D1117">Tools</text>
    <text x="430" y="467" fill="#333333">Read invoices, POs, proof of delivery, email thread.</text>
    <text x="430" y="505" fill="#0D1117" font-weight="800">Draft credit memos. Never post them.</text>

    <!-- Steps -->
    <rect x="100" y="538" width="300" height="96" rx="12" fill="#61D8FE"/>
    <text x="125" y="582" font-weight="800" fill="#0D1117">Steps it</text>
    <text x="125" y="614" font-weight="800" fill="#0D1117">may choose</text>
    <text x="430" y="578" fill="#333333">Which documents to pull, which category (price,</text>
    <text x="430" y="616" fill="#333333">quantity, damage, not received, duplicate), what to draft</text>

    <!-- Checkpoint -->
    <rect x="100" y="649" width="300" height="96" rx="12" fill="#FF5CAD"/>
    <text x="125" y="693" font-weight="800" fill="#0D1117">Human</text>
    <text x="125" y="725" font-weight="800" fill="#0D1117">checkpoint</text>
    <text x="430" y="689" fill="#333333">An AR analyst approves every credit before it posts.</text>
    <text x="430" y="727" fill="#333333">Over $2,500, the Controller approves too</text>

    <!-- Stop -->
    <rect x="100" y="760" width="300" height="134" rx="12" fill="#FF5CAD"/>
    <text x="125" y="818" font-weight="800" fill="#0D1117">Stop and</text>
    <text x="125" y="850" font-weight="800" fill="#0D1117">hand over</text>
    <text x="430" y="800" fill="#333333">Documents missing after 2 tries · legal threat ·</text>
    <text x="430" y="838" fill="#333333">dispute over $25,000 · any sign of fraud, such as</text>
    <text x="430" y="876" fill="#333333">changed bank details. Hands a person a summary</text>

    <!-- Measures -->
    <rect x="100" y="909" width="300" height="106" rx="12" fill="#544AE9"/>
    <text x="125" y="972" font-weight="800" fill="#FFFFFF">Measures</text>
    <text x="430" y="954" fill="#333333">Minutes per dispute · error rate on drafted credits</text>
    <text x="430" y="992" fill="#333333">dispute lead time · DSO</text>
  </g>

  <rect x="80" y="1075" width="8" height="52" fill="#61D8FE"/>
  <text x="110" y="1111" font-size="30" font-weight="700" fill="#0D1117">Give an agent the keys to the job, not the keys to the building.</text>
  <text x="1520" y="1170" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
