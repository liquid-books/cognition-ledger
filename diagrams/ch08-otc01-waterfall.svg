<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="100" font-size="46" font-weight="800" fill="#0D1117">10,246 freed hours became money line by line</text>
  <text x="80" y="146" font-size="26" fill="#5B6470">Brightwater's quote builder (OTC-01): its Hour Budget, in hours and dollars</text>

  <!-- baseline y=600; scale 0.0400 px per hour -->
  <line x1="100" y1="600" x2="1040" y2="600" stroke="#ADB5BD" stroke-width="2"/>
  <!-- Freed -->
  <rect x="120" y="190" width="180" height="410" rx="8" fill="#61D8FE"/>
  <text x="210" y="402" font-size="30" font-weight="800" fill="#0D1117" text-anchor="middle">10,246 h</text>
  <!-- Avoid -->
  <rect x="360" y="190" width="180" height="301" rx="8" fill="#544AE9"/>
  <text x="450" y="350" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">7,520 h</text>
  <!-- Grow -->
  <rect x="600" y="491" width="180" height="80" rx="8" fill="#544AE9"/>
  <text x="690" y="541" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">2,000 h</text>
  <!-- Leak -->
  <rect x="840" y="571" width="180" height="29" rx="6" fill="#E9ECEF" stroke="#E5484D" stroke-width="4"/>
  <text x="930" y="555" font-size="28" font-weight="800" fill="#0D1117" text-anchor="middle">726 h</text>

  <!-- connectors -->
  <g stroke="#ADB5BD" stroke-width="2" stroke-dasharray="6 6">
    <line x1="300" y1="190" x2="360" y2="190"/>
    <line x1="540" y1="491" x2="600" y2="491"/>
    <line x1="780" y1="571" x2="840" y2="571"/>
  </g>

  <!-- labels under bars -->
  <g font-size="26" font-weight="800" fill="#0D1117" text-anchor="middle">
    <text x="210" y="640">Freed</text>
    <text x="450" y="640">Avoid</text>
    <text x="690" y="640">Grow</text>
    <text x="930" y="640">Leak</text>
  </g>
  <g font-size="26" font-weight="800" text-anchor="middle">
    <text x="210" y="676" fill="#5B6470">$439,270</text>
    <text x="450" y="676" fill="#544AE9">$322,382</text>
    <text x="690" y="676" fill="#544AE9">$70,000</text>
    <text x="930" y="676" fill="#0D1117">$0</text>
  </g>
  <g font-size="22" fill="#5B6470" text-anchor="middle">
    <text x="210" y="708">theoretical</text>
    <text x="450" y="708">4 hires not made</text>
    <text x="690" y="708">lapsed-account calls</text>
    <text x="930" y="708">no job yet</text>
  </g>

  <!-- right panel: dollars -->
  <rect x="1090" y="190" width="430" height="520" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
  <text x="1115" y="236" font-size="26" font-weight="800" fill="#0D1117">The promise vs the plan</text>
  <text x="1115" y="288" font-size="22" fill="#5B6470">Theoretical (hours × rate)</text>
  <rect x="1115" y="302" width="380" height="56" rx="8" fill="#ADB5BD"/>
  <text x="1135" y="340" font-size="28" font-weight="800" fill="#0D1117">$439,270</text>
  <text x="1115" y="408" font-size="22" fill="#5B6470">Projected banked</text>
  <rect x="1115" y="422" width="339" height="56" rx="8" fill="#544AE9"/>
  <text x="1135" y="460" font-size="28" font-weight="800" fill="#FFFFFF">$392,382</text>
  <text x="1115" y="530" font-size="22" fill="#333333">The gap of about $47,000:</text>
  <text x="1115" y="562" font-size="22" fill="#333333">726 leak hours booked at $0,</text>
  <text x="1115" y="594" font-size="22" fill="#333333">and Grow priced at $35 of</text>
  <text x="1115" y="626" font-size="22" fill="#333333">margin, not $42.87 of cost.</text>
  <text x="1115" y="680" font-size="22" font-weight="800" fill="#0D1117">Still not savings. Not yet.</text>

  <rect x="80" y="760" width="8" height="52" fill="#E5484D"/>
  <text x="110" y="796" font-size="30" font-weight="700" fill="#0D1117">Every hour lands somewhere. The red slice is worth $0 until it gets a job.</text>
  <text x="1520" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
