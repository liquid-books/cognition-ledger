<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="60" y="95" font-size="48" font-weight="800" fill="#0D1117">Today's Skill is tomorrow's agent's tool</text>
  <text x="60" y="140" font-size="26" fill="#5B6470">How Brightwater's quote Skill becomes one step of an order agent later on</text>

  <!-- TODAY -->
  <text x="60" y="225" font-size="24" font-weight="700" fill="#5B6470">TODAY</text>
  <rect x="60" y="245" width="440" height="430" rx="20" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
  <rect x="95" y="280" width="370" height="70" rx="35" fill="#FF5CAD"/>
  <text x="280" y="324" font-size="24" font-weight="700" fill="#0D1117" text-anchor="middle">A rep asks for a quote</text>
  <line x1="280" y1="350" x2="280" y2="385" stroke="#ADB5BD" stroke-width="5"/>
  <rect x="95" y="385" width="370" height="140" rx="16" fill="#61D8FE"/>
  <text x="280" y="440" font-size="32" font-weight="800" fill="#0D1117" text-anchor="middle">Quote Skill</text>
  <text x="280" y="478" font-size="22" fill="#0D1117" text-anchor="middle">drafts it the house way</text>
  <text x="280" y="506" font-size="22" fill="#0D1117" text-anchor="middle">from the price file</text>
  <line x1="280" y1="525" x2="280" y2="560" stroke="#ADB5BD" stroke-width="5"/>
  <rect x="95" y="560" width="370" height="70" rx="35" fill="#FF5CAD"/>
  <text x="280" y="604" font-size="24" font-weight="700" fill="#0D1117" text-anchor="middle">The rep reviews and sends</text>

  <!-- arrow -->
  <line x1="520" y1="460" x2="600" y2="460" stroke="#ADB5BD" stroke-width="8"/>
  <polygon points="600,442 632,460 600,478" fill="#ADB5BD"/>
  <text x="575" y="420" font-size="22" font-weight="700" fill="#5B6470" text-anchor="middle">later</text>

  <!-- LATER -->
  <text x="650" y="225" font-size="24" font-weight="700" fill="#5B6470">LATER</text>
  <rect x="650" y="245" width="890" height="430" rx="20" fill="#F2FCFF" stroke="#61D8FE" stroke-width="4"/>
  <rect x="680" y="280" width="230" height="70" rx="35" fill="#E9ECEF"/>
  <text x="795" y="324" font-size="22" font-weight="700" fill="#0D1117" text-anchor="middle">A PO email lands</text>
  <line x1="910" y1="315" x2="960" y2="315" stroke="#ADB5BD" stroke-width="5"/>
  <polygon points="960,303 980,315 960,327" fill="#ADB5BD"/>
  <text x="995" y="305" font-size="30" font-weight="800" fill="#0D1117">Order agent</text>
  <text x="995" y="338" font-size="22" fill="#333333">chooses which tool to use, and when</text>

  <text x="680" y="400" font-size="22" font-weight="700" fill="#5B6470">ITS TOOLS</text>
  <rect x="680" y="415" width="260" height="110" rx="14" fill="#61D8FE" stroke="#0D1117" stroke-width="4"/>
  <text x="810" y="462" font-size="26" font-weight="800" fill="#0D1117" text-anchor="middle">Quote Skill</text>
  <text x="810" y="495" font-size="21" fill="#0D1117" text-anchor="middle">the same one</text>
  <rect x="960" y="415" width="260" height="110" rx="14" fill="#61D8FE"/>
  <text x="1090" y="462" font-size="26" font-weight="800" fill="#0D1117" text-anchor="middle">Credit Skill</text>
  <text x="1090" y="495" font-size="21" fill="#0D1117" text-anchor="middle">new accounts</text>
  <rect x="1240" y="415" width="270" height="110" rx="14" fill="#61D8FE"/>
  <text x="1375" y="462" font-size="26" font-weight="800" fill="#0D1117" text-anchor="middle">Order entry</text>
  <text x="1375" y="495" font-size="21" fill="#0D1117" text-anchor="middle">keys the sales order</text>

  <rect x="680" y="560" width="830" height="80" rx="40" fill="#FF5CAD"/>
  <text x="1095" y="610" font-size="24" font-weight="700" fill="#0D1117" text-anchor="middle">Human checkpoint: a person approves before it posts</text>

  <rect x="60" y="730" width="8" height="100" fill="#61D8FE"/>
  <text x="90" y="768" font-size="31" font-weight="700" fill="#0D1117">Build Skills first. Every one you write down becomes a part</text>
  <text x="90" y="812" font-size="31" font-weight="700" fill="#0D1117">an agent can pick up later.</text>
  <text x="1540" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
