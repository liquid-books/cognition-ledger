<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#544AE9"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="100" font-size="44" font-weight="800" fill="#0D1117">No evidence, no verification. No verification, no savings.</text>
  <text x="80" y="146" font-size="26" fill="#5B6470">Four gates every Hour Budget line passes before it counts as realized</text>

  <!-- boxes -->
  <rect x="80" y="200" width="210" height="170" rx="16" fill="#E9ECEF"/>
  <g font-size="24" fill="#0D1117" text-anchor="middle">
    <text x="185" y="262" font-weight="800">Hour Budget</text>
    <text x="185" y="294" font-weight="800">line</text>
    <text x="185" y="336" fill="#5B6470" font-size="22">projected</text>
  </g>

  <g fill="#FF5CAD">
    <rect x="330" y="200" width="200" height="170" rx="16"/>
    <rect x="570" y="200" width="200" height="170" rx="16"/>
    <rect x="810" y="200" width="200" height="170" rx="16"/>
    <rect x="1050" y="200" width="200" height="170" rx="16"/>
  </g>
  <g font-size="24" fill="#0D1117" text-anchor="middle">
    <text x="430" y="252" font-weight="800">1 Evidence</text>
    <text x="430" y="290">matches</text><text x="430" y="322">the lever</text>
    <text x="670" y="252" font-weight="800">2 Same</text>
    <text x="670" y="290">months,</text><text x="670" y="322">last year</text>
    <text x="910" y="252" font-weight="800">3 Control</text>
    <text x="910" y="290">group</text><text x="910" y="322">(Grow only)</text>
    <text x="1150" y="252" font-weight="800">4 Finance</text>
    <text x="1150" y="290">partner signs,</text><text x="1150" y="322">with a date</text>
  </g>

  <rect x="1290" y="200" width="230" height="170" rx="16" fill="#544AE9"/>
  <g font-size="24" fill="#FFFFFF" text-anchor="middle">
    <text x="1405" y="262" font-weight="800" font-size="28">Realized</text>
    <text x="1405" y="300">the only</text>
    <text x="1405" y="332">savings number</text>
  </g>

  <!-- lane A -->
  <text x="80" y="460" font-size="26" font-weight="800" fill="#0D1117">OTC-01 Avoid · $161,192</text>
  <line x1="185" y1="490" x2="1395" y2="490" stroke="#544AE9" stroke-width="6" marker-end="url(#ah)"/>
  <g fill="#544AE9"><circle cx="430" cy="490" r="12"/><circle cx="670" cy="490" r="12"/><circle cx="1150" cy="490" r="12"/></g>
  <circle cx="910" cy="490" r="12" fill="#FFFFFF" stroke="#544AE9" stroke-width="4"/>
  <text x="1520" y="460" font-size="24" font-weight="800" fill="#544AE9" text-anchor="end">counted as realized</text>
  <text x="910" y="530" font-size="22" fill="#5B6470" text-anchor="middle">not a Grow line</text>

  <!-- lane B -->
  <text x="80" y="610" font-size="26" font-weight="800" fill="#0D1117">OTC-01 Grow · $33,500 recorded</text>
  <line x1="185" y1="640" x2="880" y2="640" stroke="#ADB5BD" stroke-width="6" stroke-dasharray="14 10"/>
  <g fill="#ADB5BD"><circle cx="430" cy="640" r="12"/><circle cx="670" cy="640" r="12"/></g>
  <rect x="890" y="612" width="40" height="56" rx="6" fill="#E5484D"/>
  <text x="950" y="634" font-size="24" font-weight="800" fill="#0D1117">Stopped: no control comparison yet</text>
  <text x="950" y="666" font-size="22" fill="#333333">Waits at projected. $0 counted until it's done.</text>

  <rect x="80" y="760" width="8" height="52" fill="#FF5CAD"/>
  <text x="110" y="796" font-size="30" font-weight="700" fill="#0D1117">Money that fails a gate isn't lost. It waits, visibly, for its evidence.</text>
  <text x="1520" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
