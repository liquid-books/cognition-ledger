  <text x="790" y="662" font-size="25" font-weight="800" fill="#0D1117">$0. Nothing on the P&amp;L changes.</text>
  <line x1="790" y1="252" x2="790" y2="252" />

  <rect x="80" y="760" width="8" height="52" fill="#61D8FE"/>
  <text x="110" y="796" font-size="30" font-weight="700" fill="#0D1117">Decide where the hours go before you build, or they'll leak after you ship.</text>
  <text x="1520" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
