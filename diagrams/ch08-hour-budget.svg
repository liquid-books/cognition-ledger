  <g font-size="25" fill="#333333">
    <text x="790" y="230">Operating expense: overtime, temps, contractors</text>
    <text x="790" y="302">Personnel expense against the hiring plan</text>
    <text x="790" y="374">Revenue and gross margin</text>
    <text x="790" y="446">Credits, write-offs, bad debt, penalties</text>
    <text x="790" y="518">Interest expense and working capital</text>
