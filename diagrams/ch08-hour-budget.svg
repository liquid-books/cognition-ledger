    <rect x="520" y="190" width="240" height="62" rx="12" fill="#544AE9"/><text x="545" y="231">Cut</text>
    <rect x="520" y="262" width="240" height="62" rx="12" fill="#544AE9"/><text x="545" y="303">Avoid</text>
    <rect x="520" y="334" width="240" height="62" rx="12" fill="#544AE9"/><text x="545" y="375">Grow</text>
    <rect x="520" y="406" width="240" height="62" rx="12" fill="#544AE9"/><text x="545" y="447">Fix</text>
    <rect x="520" y="478" width="240" height="62" rx="12" fill="#544AE9"/><text x="545" y="519">Speed</text>
    <rect x="520" y="550" width="240" height="62" rx="12" fill="#544AE9"/><text x="545" y="591">Invest</text>
