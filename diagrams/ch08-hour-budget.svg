  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="100" font-size="48" font-weight="800" fill="#0D1117">Every freed hour gets a seat, or it leaks</text>
  <text x="80" y="148" font-size="26" fill="#5B6470">The Hour Budget: six destinations, each landing on a line of the P&amp;L</text>

  <rect x="80" y="190" width="300" height="494" rx="20" fill="#61D8FE"/>
  <text x="230" y="410" font-size="36" font-weight="800" fill="#0D1117" text-anchor="middle">Freed</text>
  <text x="230" y="452" font-size="36" font-weight="800" fill="#0D1117" text-anchor="middle">hours</text>
  <text x="230" y="500" font-size="22" fill="#0D1117" text-anchor="middle">after review and</text>
  <text x="230" y="530" font-size="22" fill="#0D1117" text-anchor="middle">oversight time</text>

  <g stroke="#61D8FE" stroke-width="4" fill="none">
    <path d="M382,437 C450,437 450,221 512,221" marker-end="url(#ah)"/>
    <path d="M382,437 C450,437 450,293 512,293" marker-end="url(#ah)"/>
    <path d="M382,437 C450,437 450,365 512,365" marker-end="url(#ah)"/>
