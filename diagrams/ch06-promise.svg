<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="60" y="95" font-size="50" font-weight="800" fill="#0D1117">Theoretical value is a promise, not a payment</text>
  <text x="60" y="140" font-size="26" fill="#5B6470">What Brightwater's $439,270 is, what it isn't, and what it takes to turn it into money</text>

  <!-- the number -->
  <rect x="60" y="190" width="700" height="330" rx="22" fill="#FFFFFF" stroke="#544AE9" stroke-width="5" stroke-dasharray="18 12"/>
  <text x="100" y="250" font-size="24" font-weight="700" fill="#5B6470">THEORETICAL VALUE, OTC-01</text>
  <text x="100" y="345" font-size="96" font-weight="800" fill="#544AE9">$439,270</text>
  <text x="100" y="400" font-size="26" fill="#333333">10,246 hours × $42.87 loaded rate</text>
  <text x="100" y="445" font-size="22" fill="#5B6470">Loaded rate = $62,000 pay × 1.30 for benefits</text>
  <text x="100" y="475" font-size="22" fill="#5B6470">and overhead ÷ 1,880 productive hours</text>

  <!-- it is not -->
  <text x="830" y="225" font-size="24" font-weight="700" fill="#5B6470">IT IS NOT</text>
  <rect x="830" y="245" width="710" height="76" rx="14" fill="#E9ECEF"/>
  <text x="865" y="294" font-size="30" font-weight="700" fill="#5B6470">Savings</text>
  <text x="1505" y="294" font-size="22" fill="#5B6470" text-anchor="end">payroll hasn't moved</text>
  <rect x="830" y="335" width="710" height="76" rx="14" fill="#E9ECEF"/>
  <text x="865" y="384" font-size="30" font-weight="700" fill="#5B6470">A budget cut</text>
  <text x="1505" y="384" font-size="22" fill="#5B6470" text-anchor="end">nobody's line has changed</text>
  <rect x="830" y="425" width="710" height="76" rx="14" fill="#E9ECEF"/>
  <text x="865" y="474" font-size="30" font-weight="700" fill="#5B6470">On the P&amp;L</text>
  <text x="1505" y="474" font-size="22" fill="#5B6470" text-anchor="end">the CFO can't find it</text>

  <line x1="860" y1="284" x2="995" y2="284" stroke="#5B6470" stroke-width="4"/><line x1="860" y1="374" x2="1060" y2="374" stroke="#5B6470" stroke-width="4"/><line x1="860" y1="464" x2="1035" y2="464" stroke="#5B6470" stroke-width="4"/>
  <!-- path to money -->
  <text x="60" y="590" font-size="24" font-weight="700" fill="#5B6470">IT BECOMES MONEY ONLY WHEN THE HOURS GET</text>
  <g font-size="27" font-weight="800">
    <rect x="60" y="610" width="270" height="90" rx="45" fill="#61D8FE"/><text x="195" y="665" fill="#0D1117" text-anchor="middle">a destination</text>
    <rect x="350" y="610" width="270" height="90" rx="45" fill="#61D8FE"/><text x="485" y="665" fill="#0D1117" text-anchor="middle">a P&amp;L line</text>
    <rect x="640" y="610" width="270" height="90" rx="45" fill="#FF5CAD"/><text x="775" y="665" fill="#0D1117" text-anchor="middle">a budget owner</text>
    <rect x="930" y="610" width="270" height="90" rx="45" fill="#FF5CAD"/><text x="1065" y="665" fill="#0D1117" text-anchor="middle">a date</text>
    <rect x="1220" y="610" width="320" height="90" rx="45" fill="#544AE9"/><text x="1380" y="665" fill="#FFFFFF" text-anchor="middle">CFO verification</text>
  </g>

  <rect x="60" y="760" width="8" height="56" fill="#61D8FE"/>
  <text x="90" y="798" font-size="30" font-weight="700" fill="#0D1117">Report it as the size of the opportunity. Never call it savings.</text>
  <text x="1540" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
