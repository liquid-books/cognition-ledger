<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="1200" fill="#FFFFFF"/>
  <text x="60" y="95" font-size="48" font-weight="800" fill="#0D1117">Three questions, in a fixed order, end the argument</text>
  <text x="60" y="140" font-size="26" fill="#5B6470">Score nine questions from 1 to 5, average them into three indexes, then ask in this order</text>

  <!-- start -->
  <rect x="60" y="185" width="600" height="90" rx="16" fill="#1A184C"/>
  <text x="90" y="225" font-size="26" font-weight="800" fill="#FFFFFF">Score it: Cognition (C1 to C3),</text>
  <text x="90" y="257" font-size="26" font-weight="800" fill="#FFFFFF">Autonomy (A1 to A4), Risk (R1, R2)</text>
  <line x1="360" y1="275" x2="360" y2="315" stroke="#ADB5BD" stroke-width="5"/>

  <!-- gate 1 -->
  <rect x="60" y="315" width="600" height="130" rx="16" fill="#FFFFFF" stroke="#0D1117" stroke-width="3"/>
  <text x="90" y="358" font-size="22" font-weight="700" fill="#5B6470">GATE 1 · DOES IT NEED AI AT ALL?</text>
  <text x="90" y="402" font-size="32" font-weight="800" fill="#0D1117">Cognition below 2.0?</text>
  <text x="90" y="432" font-size="22" fill="#333333">Rules on clean data</text>
  <line x1="660" y1="380" x2="800" y2="380" stroke="#ADB5BD" stroke-width="5"/><polygon points="800,366 825,380 800,394" fill="#ADB5BD"/>
  <text x="700" y="365" font-size="24" font-weight="700" fill="#0D1117">yes</text>
  <rect x="840" y="315" width="700" height="130" rx="16" fill="#E9ECEF"/>
  <text x="870" y="365" font-size="32" font-weight="800" fill="#0D1117">Workflow automation</text>
  <text x="870" y="400" font-size="23" fill="#333333">No AI needed. A model would only add cost and risk.</text>
  <text x="870" y="430" font-size="22" font-weight="700" fill="#5B6470">Brightwater: OTC-06 portal bot (1.33)</text>
  <line x1="360" y1="445" x2="360" y2="495" stroke="#ADB5BD" stroke-width="5"/>
  <text x="375" y="478" font-size="24" font-weight="700" fill="#0D1117">no</text>

  <!-- gate 2 -->
  <rect x="60" y="495" width="600" height="130" rx="16" fill="#FFFFFF" stroke="#0D1117" stroke-width="3"/>
  <text x="90" y="538" font-size="22" font-weight="700" fill="#5B6470">GATE 2 · TOO RISKY TO HAND OVER?</text>
  <text x="90" y="582" font-size="32" font-weight="800" fill="#0D1117">Risk 4.5 or higher?</text>
  <text x="90" y="612" font-size="22" fill="#333333">Severe and can't be undone</text>
  <line x1="660" y1="560" x2="800" y2="560" stroke="#ADB5BD" stroke-width="5"/><polygon points="800,546 825,560 800,574" fill="#ADB5BD"/>
  <text x="700" y="545" font-size="24" font-weight="700" fill="#0D1117">yes</text>
  <rect x="840" y="495" width="700" height="130" rx="16" fill="#FF5CAD"/>
  <text x="870" y="545" font-size="32" font-weight="800" fill="#0D1117">Keep human, AI assists</text>
  <text x="870" y="580" font-size="23" fill="#0D1117">AI researches and drafts. A person decides and acts.</text>
  <text x="870" y="610" font-size="22" font-weight="700" fill="#0D1117">Brightwater: none of the seven</text>
  <line x1="360" y1="625" x2="360" y2="675" stroke="#ADB5BD" stroke-width="5"/>
  <text x="375" y="658" font-size="24" font-weight="700" fill="#0D1117">no</text>

  <!-- gate 3 -->
  <rect x="60" y="675" width="600" height="130" rx="16" fill="#FFFFFF" stroke="#0D1117" stroke-width="3"/>
  <text x="90" y="718" font-size="22" font-weight="700" fill="#5B6470">GATE 3 · MUST IT ACT ON ITS OWN?</text>
  <text x="90" y="762" font-size="32" font-weight="800" fill="#0D1117">Autonomy 3.0 or higher?</text>
  <text x="90" y="792" font-size="22" fill="#333333">Event-started, many systems, unwatched</text>
  <line x1="660" y1="740" x2="800" y2="740" stroke="#ADB5BD" stroke-width="5"/><polygon points="800,726 825,740 800,754" fill="#ADB5BD"/>
  <text x="700" y="725" font-size="24" font-weight="700" fill="#0D1117">yes</text>
  <rect x="840" y="675" width="700" height="170" rx="16" fill="#61D8FE"/>
  <text x="870" y="725" font-size="32" font-weight="800" fill="#0D1117">Agent</text>
  <text x="870" y="760" font-size="23" fill="#0D1117">If Risk is 3.0 or higher: + human checkpoint</text>
  <rect x="870" y="778" width="640" height="48" rx="24" fill="#FFFFFF"/>
  <text x="890" y="810" font-size="21" font-weight="700" fill="#0D1117">Brightwater: OTC-02 · checkpoint: OTC-04, OTC-07</text>
  <line x1="360" y1="805" x2="360" y2="875" stroke="#ADB5BD" stroke-width="5"/>
  <text x="375" y="848" font-size="24" font-weight="700" fill="#0D1117">no</text>

  <!-- final -->
  <rect x="60" y="875" width="600" height="110" rx="16" fill="#FFFFFF" stroke="#0D1117" stroke-width="3"/>
  <text x="90" y="918" font-size="22" font-weight="700" fill="#5B6470">OTHERWISE</text>
  <text x="90" y="960" font-size="32" font-weight="800" fill="#0D1117">A person starts it and reviews it</text>
  <line x1="660" y1="930" x2="800" y2="930" stroke="#ADB5BD" stroke-width="5"/><polygon points="800,916 825,930 800,944" fill="#ADB5BD"/>
  <rect x="840" y="875" width="700" height="170" rx="16" fill="#FFFFFF" stroke="#61D8FE" stroke-width="5"/>
  <text x="870" y="925" font-size="32" font-weight="800" fill="#0D1117">Skill</text>
  <text x="870" y="960" font-size="23" fill="#333333">If Risk is 3.0 or higher: + second review</text>
  <rect x="870" y="978" width="640" height="48" rx="24" fill="#E9F9FF"/>
  <text x="890" y="1010" font-size="21" font-weight="700" fill="#0D1117">Brightwater: OTC-01, OTC-05 · review: OTC-03</text>


  <rect x="60" y="1080" width="8" height="54" fill="#61D8FE"/>
  <text x="90" y="1118" font-size="31" font-weight="700" fill="#0D1117">Ask "does it need AI?" before "how much autonomy?", never after.</text>
  <text x="1540" y="1170" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
