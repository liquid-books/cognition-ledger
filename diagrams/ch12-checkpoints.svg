<text x="1200" y="592" font-size="40" font-weight="800" fill="#FFFFFF" text-anchor="middle" >98.5%</text>
<text x="1200" y="628" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle" >clean orders</text>
