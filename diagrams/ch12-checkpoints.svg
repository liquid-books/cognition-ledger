<text x="80" y="712" font-size="22" font-weight="400" fill="#5B6470" text-anchor="start" >Assumes each step is right 95 times in 100 and each review catches 9 of every 10 errors that reach it.</text>
<rect x="80" y="750" width="8" height="52" rx="0" fill="#61D8FE" />
<text x="110" y="786" font-size="30" font-weight="700" fill="#0D1117" text-anchor="start" >Put the human where the errors compound, not where the nerves are.</text>
<text x="1520" y="866" font-size="22" font-weight="400" fill="#5B6470" text-anchor="end" >The Cognition Ledger · DrLee.ai</text>
