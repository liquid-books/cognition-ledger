<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B6470"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#544AE9"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="100" font-size="46" font-weight="800" fill="#0D1117">Most "agents" are one of five simple shapes</text>
  <text x="80" y="146" font-size="26" fill="#5B6470">Each has a physical-world twin, and each shows up at Brightwater</text>

  <!-- cards -->
  <g fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3">
    <rect x="80" y="180" width="272" height="470" rx="18"/>
    <rect x="372" y="180" width="272" height="470" rx="18"/>
    <rect x="664" y="180" width="272" height="470" rx="18"/>
    <rect x="956" y="180" width="272" height="470" rx="18"/>
    <rect x="1248" y="180" width="272" height="470" rx="18"/>
  </g>

  <!-- titles -->
  <g font-size="26" font-weight="800" fill="#0D1117" text-anchor="middle">
    <text x="216" y="226">Prompt</text><text x="216" y="258">chaining</text>
    <text x="508" y="226">Routing</text><text x="508" y="258"> </text>
    <text x="800" y="226">Parallel</text><text x="800" y="258">work</text>
    <text x="1092" y="226">Orchestrator</text><text x="1092" y="258">and workers</text>
    <text x="1384" y="226">Evaluator</text><text x="1384" y="258">and optimizer</text>
  </g>

  <!-- 1 chaining -->
  <g stroke="#5B6470" stroke-width="3" fill="none">
    <line x1="152" y1="380" x2="178" y2="380" marker-end="url(#ah)"/>
    <line x1="254" y1="380" x2="280" y2="380" marker-end="url(#ah)"/>
  </g>
  <circle cx="126" cy="380" r="24" fill="#61D8FE"/>
  <circle cx="216" cy="380" r="24" fill="#61D8FE"/>
  <circle cx="306" cy="380" r="24" fill="#61D8FE"/>
  <rect x="160" y="330" width="12" height="20" fill="#FF5CAD"/>
  <rect x="262" y="330" width="12" height="20" fill="#FF5CAD"/>
  <text x="216" y="450" font-size="22" fill="#5B6470" text-anchor="middle">checks between steps</text>

  <!-- 2 routing -->
  <circle cx="430" cy="380" r="24" fill="#61D8FE"/>
  <circle cx="586" cy="310" r="22" fill="#61D8FE"/>
  <circle cx="586" cy="380" r="22" fill="#61D8FE"/>
  <circle cx="586" cy="450" r="22" fill="#61D8FE"/>
  <g stroke="#5B6470" stroke-width="3" fill="none">
    <line x1="454" y1="372" x2="560" y2="318" marker-end="url(#ah)"/>
    <line x1="454" y1="380" x2="560" y2="380" marker-end="url(#ah)"/>
    <line x1="454" y1="388" x2="560" y2="442" marker-end="url(#ah)"/>
  </g>

  <!-- 3 parallel -->
  <circle cx="700" cy="380" r="20" fill="#E9ECEF" stroke="#ADB5BD" stroke-width="2"/>
  <circle cx="800" cy="310" r="22" fill="#61D8FE"/>
  <circle cx="800" cy="380" r="22" fill="#61D8FE"/>
  <circle cx="800" cy="450" r="22" fill="#61D8FE"/>
  <circle cx="900" cy="380" r="20" fill="#E9ECEF" stroke="#ADB5BD" stroke-width="2"/>
  <g stroke="#5B6470" stroke-width="3" fill="none">
    <line x1="718" y1="372" x2="776" y2="318" marker-end="url(#ah)"/>
    <line x1="720" y1="380" x2="776" y2="380" marker-end="url(#ah)"/>
    <line x1="718" y1="388" x2="776" y2="442" marker-end="url(#ah)"/>
    <line x1="822" y1="318" x2="882" y2="372" marker-end="url(#ah)"/>
    <line x1="824" y1="380" x2="878" y2="380" marker-end="url(#ah)"/>
    <line x1="822" y1="442" x2="882" y2="388" marker-end="url(#ah)"/>
  </g>

  <!-- 4 orchestrator -->
  <circle cx="1092" cy="310" r="28" fill="#544AE9"/>
  <circle cx="1022" cy="450" r="22" fill="#61D8FE"/>
  <circle cx="1092" cy="450" r="22" fill="#61D8FE"/>
  <circle cx="1162" cy="450" r="22" fill="#61D8FE"/>
  <g stroke="#5B6470" stroke-width="3" fill="none">
    <line x1="1078" y1="334" x2="1032" y2="424" marker-end="url(#ah)"/>
    <line x1="1092" y1="340" x2="1092" y2="424" marker-end="url(#ah)"/>
    <line x1="1106" y1="334" x2="1152" y2="424" marker-end="url(#ah)"/>
  </g>
  <text x="1092" y="500" font-size="22" fill="#5B6470" text-anchor="middle">subtasks differ each time</text>

  <!-- 5 evaluator -->
  <circle cx="1322" cy="380" r="28" fill="#61D8FE"/>
  <circle cx="1446" cy="380" r="28" fill="#61D8FE"/>
  <text x="1322" y="388" font-size="22" font-weight="800" fill="#0D1117" text-anchor="middle">W</text>
  <text x="1446" y="388" font-size="22" font-weight="800" fill="#0D1117" text-anchor="middle">E</text>
  <path d="M1338,354 Q1384,296 1426,350" stroke="#5B6470" stroke-width="3" fill="none" marker-end="url(#ah)"/>
  <path d="M1430,406 Q1384,464 1342,410" stroke="#5B6470" stroke-width="3" fill="none" marker-end="url(#ah)"/>
  <text x="1384" y="500" font-size="22" fill="#5B6470" text-anchor="middle">draft, critique, repeat</text>

  <!-- analogy + example -->
  <g font-size="24" font-weight="700" fill="#544AE9" text-anchor="middle">
    <text x="216" y="545">Assembly line</text>
    <text x="508" y="545">Mailroom</text>
    <text x="800" y="545">Team splits a job</text>
    <text x="1092" y="545">General contractor</text>
    <text x="1384" y="545">Writer and editor</text>
  </g>
  <g font-size="22" fill="#333333" text-anchor="middle">
    <text x="216" y="585">Quote: extract,</text><text x="216" y="615">match, price, check</text>
    <text x="508" y="585">Disputes sorted</text><text x="508" y="615">into five kinds</text>
    <text x="800" y="585">Invoice, PO and</text><text x="800" y="615">delivery proof at once</text>
    <text x="1092" y="585">Dispute agent picks</text><text x="1092" y="615">the documents</text>
    <text x="1384" y="585">Collections email</text><text x="1384" y="615">checked for tone</text>
  </g>

  <!-- ladder -->
  <line x1="90" y1="690" x2="1505" y2="690" stroke="#544AE9" stroke-width="5" marker-end="url(#ahb)"/>
  <text x="80" y="728" font-size="24" fill="#5B6470">Fixed path: cheaper, faster, easy to test</text>
  <text x="1520" y="728" font-size="24" fill="#5B6470" text-anchor="end">Model picks the path: flexible, costlier</text>

  <rect x="80" y="770" width="8" height="52" fill="#61D8FE"/>
  <text x="110" y="806" font-size="30" font-weight="700" fill="#0D1117">Start with the simplest shape that works. Add autonomy only when it pays.</text>
  <text x="1520" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
