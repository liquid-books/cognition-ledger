<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="105" font-size="46" font-weight="800" fill="#0D1117">Most firms stop at wave one. The money comes after.</text>
  <text x="80" y="150" font-size="26" fill="#5B6470">Cheap muscle and cheap thinking follow the same three steps</text>

  <rect x="260" y="350" width="400" height="110" rx="16" fill="#E9ECEF"/>
  <text x="290" y="397" font-size="30" font-weight="800" fill="#0D1117">1. Buy the tool</text>
  <text x="290" y="436" font-size="24" fill="#333333">Value: minutes saved</text>

  <rect x="680" y="280" width="400" height="180" rx="16" fill="#61D8FE"/>
  <text x="710" y="327" font-size="30" font-weight="800" fill="#0D1117">2. Redesign the work</text>
  <text x="710" y="366" font-size="24" fill="#0D1117">Value: cost, speed, quality</text>

  <rect x="1100" y="210" width="420" height="250" rx="16" fill="#544AE9"/>
  <text x="1130" y="257" font-size="30" font-weight="800" fill="#FFFFFF">3. New business models</text>
  <text x="1130" y="296" font-size="24" fill="#FFFFFF">Value: revenue that couldn't</text>
  <text x="1130" y="326" font-size="24" fill="#FFFFFF">exist before</text>

  <rect x="290" y="215" width="250" height="50" rx="25" fill="#1A184C"/>
  <text x="415" y="248" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">Brightwater today</text>
  <path d="M415 265 V340" stroke="#1A184C" stroke-width="4"/>
  <path d="M405 328 L415 342 L425 328" stroke="#1A184C" stroke-width="4" fill="none"/>

  <line x1="80" y1="460" x2="1520" y2="460" stroke="#ADB5BD" stroke-width="3"/>
  <text x="80" y="530" font-size="24" font-weight="800" fill="#5B6470" letter-spacing="2">MUSCLE</text>
  <text x="80" y="558" font-size="22" fill="#5B6470">steam, electricity</text>
  <text x="80" y="660" font-size="24" font-weight="800" fill="#5B6470" letter-spacing="2">MIND</text>
  <text x="80" y="688" font-size="22" fill="#5B6470">AI</text>
  <line x1="80" y1="600" x2="1520" y2="600" stroke="#E9ECEF" stroke-width="3"/>
  <g font-size="24" fill="#333333">
    <text x="290" y="525">Motor bolted where the</text><text x="290" y="557">steam engine stood</text>
    <text x="710" y="525">Unit drive: one-story</text><text x="710" y="557">floors laid out for flow</text>
    <text x="1130" y="525">Railroads, mass retail,</text><text x="1130" y="557">the modern factory</text>
    <text x="290" y="655">AI licences on every</text><text x="290" y="687">desk, minutes saved</text>
    <text x="710" y="655">Value streams redesigned</text><text x="710" y="687">around cheap thinking</text>
    <text x="1130" y="655">Outcome pricing, products</text><text x="1130" y="687">with their own analyst</text>
  </g>

  <rect x="80" y="768" width="8" height="56" fill="#61D8FE"/>
  <text x="110" y="806" font-size="32" font-weight="700" fill="#0D1117">The winners never bought the most engines. They redesigned the most work.</text>
  <text x="1520" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
