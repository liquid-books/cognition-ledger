<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="1200" fill="#FFFFFF"/>
  <text x="80" y="100" font-size="48" font-weight="800" fill="#0D1117">The board page: three numbers apart, leak in red</text>
  <text x="80" y="146" font-size="26" fill="#5B6470">Brightwater Order-to-Cash · three quarters in · two quarters verified by the Controller</text>

  <!-- row 1: the three numbers -->
  <rect x="80" y="190" width="466" height="180" rx="18" fill="#E9ECEF"/>
  <text x="110" y="238" font-size="24" fill="#333333">Theoretical value</text>
  <text x="110" y="310" font-size="52" font-weight="800" fill="#0D1117">$1,214,780</text>
  <text x="110" y="348" font-size="22" fill="#5B6470">Hours × rate. The opportunity.</text>

  <rect x="567" y="190" width="466" height="180" rx="18" fill="#FFFFFF" stroke="#544AE9" stroke-width="4"/>
  <text x="597" y="238" font-size="24" fill="#333333">Projected banked value</text>
  <text x="597" y="310" font-size="52" font-weight="800" fill="#544AE9">$1,292,292</text>
  <text x="597" y="348" font-size="22" fill="#5B6470">Lever, owner and date on each line</text>

  <rect x="1054" y="190" width="466" height="180" rx="18" fill="#544AE9"/>
  <text x="1084" y="238" font-size="24" fill="#FFFFFF">Realized and CFO verified</text>
  <text x="1084" y="310" font-size="52" font-weight="800" fill="#FFFFFF">$288,463</text>
  <text x="1084" y="348" font-size="22" fill="#FFFFFF">The only savings number</text>

  <!-- row 2 -->
  <rect x="80" y="395" width="345" height="150" rx="16" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
  <text x="105" y="438" font-size="24" fill="#333333">Realization rate</text>
  <text x="105" y="496" font-size="44" font-weight="800" fill="#544AE9">22.3%</text>
  <text x="105" y="528" font-size="22" fill="#5B6470">realized ÷ projected</text>

  <rect x="445" y="395" width="345" height="150" rx="16" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
  <text x="470" y="438" font-size="24" fill="#333333">Realization gap</text>
  <text x="470" y="496" font-size="44" font-weight="800" fill="#0D1117">$926,317</text>
  <text x="470" y="528" font-size="22" fill="#5B6470">theoretical minus realized</text>

  <rect x="810" y="395" width="345" height="150" rx="16" fill="#FFFFFF" stroke="#E5484D" stroke-width="4"/>
  <text x="835" y="438" font-size="24" fill="#333333">Leak</text>
  <text x="835" y="496" font-size="44" font-weight="800" fill="#0D1117">9,401 h</text>
  <text x="835" y="528" font-size="22" fill="#5B6470">$343,614 at loaded cost</text>

  <rect x="1175" y="395" width="345" height="150" rx="16" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
  <text x="1200" y="438" font-size="24" fill="#333333">Poor quality avoided</text>
  <text x="1200" y="496" font-size="44" font-weight="800" fill="#0D1117">$691,370</text>
  <text x="1200" y="528" font-size="22" fill="#5B6470">errors prevented a year</text>

  <!-- row 3 -->
  <g>
    <rect x="80" y="570" width="345" height="110" rx="16" fill="#E9ECEF"/>
    <text x="105" y="610" font-size="22" fill="#333333">Use cases in the ledger</text>
    <text x="105" y="660" font-size="36" font-weight="800" fill="#0D1117">8</text>
    <rect x="445" y="570" width="345" height="110" rx="16" fill="#E9ECEF"/>
    <text x="470" y="610" font-size="22" fill="#333333">Net hours freed a year</text>
    <text x="470" y="660" font-size="36" font-weight="800" fill="#0D1117">32,301</text>
    <rect x="810" y="570" width="345" height="110" rx="16" fill="#E9ECEF"/>
    <text x="835" y="610" font-size="22" fill="#333333">One-time build cost</text>
    <text x="835" y="660" font-size="36" font-weight="800" fill="#0D1117">$256,000</text>
    <rect x="1175" y="570" width="345" height="110" rx="16" fill="#E9ECEF"/>
    <text x="1200" y="610" font-size="22" fill="#333333">Run cost a year</text>
    <text x="1200" y="660" font-size="36" font-weight="800" fill="#0D1117">$130,000</text>
  </g>

  <!-- red flags -->
  <rect x="80" y="705" width="1440" height="285" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="3"/>
  <text x="110" y="752" font-size="28" font-weight="800" fill="#0D1117">Still owed a decision</text>
  <rect x="110" y="785" width="26" height="40" rx="4" fill="#E5484D"/>
  <text x="155" y="815" font-size="24" fill="#333333"><tspan font-weight="800" fill="#0D1117">OTC-07 Cash application agent</tspan> · 4,026 hours · no Hour Budget, so it can't enter Building</text>
  <rect x="110" y="850" width="26" height="40" rx="4" fill="#E5484D"/>
  <text x="155" y="880" font-size="24" fill="#333333"><tspan font-weight="800" fill="#0D1117">OTC-06 Proof-of-delivery bot</tspan> · 1,363 hours · being built with no Hour Budget</text>
  <rect x="110" y="915" width="26" height="40" rx="4" fill="#ADB5BD"/>
  <text x="155" y="945" font-size="24" fill="#333333"><tspan font-weight="800" fill="#0D1117">OTC-03 Credit memo Skill</tspan> · 1,050 hours leaking · only its Fix line is banked</text>

  <rect x="80" y="1040" width="8" height="52" fill="#544AE9"/>
  <text x="110" y="1076" font-size="30" font-weight="700" fill="#0D1117">A big number invites an audit. A verified number invites a budget.</text>
  <text x="1520" y="1160" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
