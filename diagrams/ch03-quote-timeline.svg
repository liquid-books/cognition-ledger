<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="105" font-size="48" font-weight="800" fill="#0D1117">Two days to the customer. 35 minutes of work.</text>
  <text x="80" y="150" font-size="26" fill="#5B6470">One Brightwater quote, followed from request to reply, in working minutes</text>

  <g fill="#E9ECEF">
    <rect x="80" y="230" width="360" height="110"/>
    <rect x="449" y="230" width="270" height="110"/>
    <rect x="744.5" y="230" width="540" height="110"/>
    <rect x="1298" y="230" width="217.5" height="110"/>
  </g>
  <g fill="#FF5CAD">
    <rect x="440" y="230" width="9" height="110"/>
    <rect x="719" y="230" width="25.5" height="110"/>
    <rect x="1284.5" y="230" width="13.5" height="110"/>
    <rect x="1515.5" y="230" width="4.5" height="110"/>
  </g>
  <g text-anchor="middle">
    <text x="260" y="278" font-size="24" font-weight="700" fill="#333333">In the shared inbox</text>
    <text x="260" y="312" font-size="22" fill="#5B6470">240 min</text>
    <text x="584" y="278" font-size="24" font-weight="700" fill="#333333">Customer fills gaps</text>
    <text x="584" y="312" font-size="22" fill="#5B6470">180 min</text>
    <text x="1014" y="278" font-size="24" font-weight="700" fill="#333333">Pricing approval queue</text>
    <text x="1014" y="312" font-size="22" fill="#5B6470">360 min</text>
    <text x="1406" y="278" font-size="24" font-weight="700" fill="#333333">Waiting to send</text>
    <text x="1406" y="312" font-size="22" fill="#5B6470">145 min</text>
  </g>
  <g stroke="#FF5CAD" stroke-width="3">
    <line x1="444" y1="340" x2="444" y2="380"/><line x1="732" y1="340" x2="732" y2="380"/>
    <line x1="1291" y1="340" x2="1291" y2="380"/><line x1="1518" y1="340" x2="1518" y2="380"/>
  </g>
  <g font-size="22" fill="#333333">
    <text x="444" y="410" text-anchor="middle">Read 6</text>
    <text x="732" y="410" text-anchor="middle">Key 8, look up 9</text>
    <text x="1291" y="410" text-anchor="middle">Approve 2, build 7</text>
    <text x="1520" y="410" text-anchor="end">Send 3</text>
  </g>
  <text x="80" y="210" font-size="22" fill="#5B6470">Tuesday 9:00 a.m.</text>
  <text x="1520" y="210" font-size="22" fill="#5B6470" text-anchor="end">Thursday 9:00 a.m.</text>

  <rect x="80" y="470" width="440" height="200" rx="20" fill="#E9ECEF"/>
  <text x="300" y="560" font-size="72" font-weight="800" fill="#0D1117" text-anchor="middle">960 min</text>
  <text x="300" y="610" font-size="24" fill="#333333" text-anchor="middle">lead time: request to reply</text>
  <rect x="580" y="470" width="440" height="200" rx="20" fill="#FF5CAD"/>
  <text x="800" y="560" font-size="72" font-weight="800" fill="#0D1117" text-anchor="middle">35 min</text>
  <text x="800" y="610" font-size="24" fill="#0D1117" text-anchor="middle">touch time: hands on the work</text>
  <rect x="1080" y="470" width="440" height="200" rx="20" fill="#544AE9"/>
  <text x="1300" y="560" font-size="72" font-weight="800" fill="#FFFFFF" text-anchor="middle">3.6%</text>
  <text x="1300" y="610" font-size="24" fill="#FFFFFF" text-anchor="middle">activity ratio: 35 ÷ 960</text>

  <rect x="80" y="768" width="8" height="56" fill="#61D8FE"/>
  <text x="110" y="806" font-size="34" font-weight="700" fill="#0D1117">In the office, the work isn't slow. It's waiting.</text>
  <text x="1520" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
