<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="60" y="100" font-size="50" font-weight="800" fill="#0D1117">A beautifully automated report nobody reads</text>
  <text x="60" y="165" font-size="50" font-weight="800" fill="#0D1117">is still waste. It's just cheaper waste.</text>

  <!-- before: report made by hand -->
  <text x="60" y="270" font-size="24" font-weight="700" fill="#5B6470">BEFORE</text>
  <rect x="60" y="290" width="330" height="330" rx="20" fill="#E9ECEF"/>
  <rect x="160" y="330" width="130" height="165" rx="8" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="3"/>
  <line x1="180" y1="365" x2="270" y2="365" stroke="#ADB5BD" stroke-width="6"/>
  <line x1="180" y1="395" x2="270" y2="395" stroke="#ADB5BD" stroke-width="6"/>
  <line x1="180" y1="425" x2="250" y2="425" stroke="#ADB5BD" stroke-width="6"/>
  <line x1="180" y1="455" x2="265" y2="455" stroke="#ADB5BD" stroke-width="6"/>
  <text x="225" y="550" font-size="34" font-weight="800" fill="#0D1117" text-anchor="middle">4 hours</text>
  <text x="225" y="588" font-size="24" fill="#333333" text-anchor="middle">by hand, every Monday</text>

  <!-- arrow -->
  <line x1="410" y1="455" x2="560" y2="455" stroke="#61D8FE" stroke-width="10"/>
  <polygon points="560,435 595,455 560,475" fill="#61D8FE"/>

  <!-- after: AI -->
  <text x="615" y="270" font-size="24" font-weight="700" fill="#5B6470">AFTER</text>
  <rect x="615" y="290" width="330" height="330" rx="20" fill="#61D8FE"/>
  <rect x="715" y="330" width="130" height="165" rx="8" fill="#FFFFFF" stroke="#0D1117" stroke-width="3"/>
  <line x1="735" y1="365" x2="825" y2="365" stroke="#0D1117" stroke-width="6"/>
  <line x1="735" y1="395" x2="825" y2="395" stroke="#0D1117" stroke-width="6"/>
  <line x1="735" y1="425" x2="805" y2="425" stroke="#0D1117" stroke-width="6"/>
  <line x1="735" y1="455" x2="820" y2="455" stroke="#0D1117" stroke-width="6"/>
  <text x="780" y="550" font-size="34" font-weight="800" fill="#0D1117" text-anchor="middle">4 minutes</text>
  <text x="780" y="588" font-size="24" fill="#0D1117" text-anchor="middle">by AI, every Monday</text>

  <!-- arrow -->
  <line x1="965" y1="455" x2="1115" y2="455" stroke="#ADB5BD" stroke-width="10"/>
  <polygon points="1115,435 1150,455 1115,475" fill="#ADB5BD"/>

  <!-- read by nobody -->
  <text x="1170" y="270" font-size="24" font-weight="700" fill="#5B6470">READ BY</text>
  <rect x="1170" y="290" width="370" height="330" rx="20" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="4" stroke-dasharray="14 10"/>
  <text x="1355" y="465" font-size="64" font-weight="800" fill="#ADB5BD" text-anchor="middle">nobody</text>
  <text x="1355" y="530" font-size="24" fill="#5B6470" text-anchor="middle">value to the customer:</text>
  <text x="1355" y="565" font-size="24" fill="#5B6470" text-anchor="middle">zero, before and after</text>

  <rect x="60" y="690" width="8" height="100" fill="#61D8FE"/>
  <text x="90" y="728" font-size="31" font-weight="700" fill="#0D1117">Ask who would notice if it stopped. If the answer is nobody,</text>
  <text x="90" y="772" font-size="31" font-weight="700" fill="#0D1117">delete it before anyone builds it.</text>
  <text x="1540" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
