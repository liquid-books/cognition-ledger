<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="105" font-size="46" font-weight="800" fill="#0D1117">Motors arrived first. Productivity came 40 years later.</text>
  <text x="80" y="152" font-size="28" fill="#5B6470">Share of US factory machine power supplied by electric motors, 1899 to 1929</text>

  <rect x="1150" y="200" width="370" height="480" rx="12" fill="#544AE9" fill-opacity="0.09"/>
  <text x="1335" y="240" font-size="26" font-weight="800" fill="#544AE9" text-anchor="middle">1920s: productivity surges</text>
  <text x="1335" y="274" font-size="22" fill="#544AE9" text-anchor="middle">as factories are redesigned</text>

  <line x1="120" y1="680" x2="1520" y2="680" stroke="#ADB5BD" stroke-width="3"/>
  <line x1="214" y1="680" x2="214" y2="330" stroke="#5B6470" stroke-width="3" stroke-dasharray="8 8"/>
  <circle cx="214" cy="680" r="10" fill="#5B6470"/>
  <text x="234" y="420" font-size="24" font-weight="700" fill="#0D1117">Early 1880s</text>
  <text x="234" y="452" font-size="22" fill="#5B6470">First central</text>
  <text x="234" y="480" font-size="22" fill="#5B6470">power stations</text>

  <path d="M214 330 H1140" stroke="#5B6470" stroke-width="3"/>
  <path d="M1128 320 L1142 330 L1128 340" stroke="#5B6470" stroke-width="3" fill="none"/>
  <text x="677" y="314" font-size="26" font-weight="700" fill="#0D1117" text-anchor="middle">About four decades of "everywhere but in the productivity statistics"</text>

  <g fill="#61D8FE">
    <rect x="624" y="659" width="90" height="21" rx="6"/>
    <rect x="892" y="575" width="90" height="105" rx="6"/>
    <rect x="1160" y="457" width="90" height="223" rx="6"/>
    <rect x="1428" y="352" width="90" height="328" rx="6"/>
  </g>
  <g font-size="34" font-weight="800" fill="#0D1117" text-anchor="middle">
    <text x="669" y="640">&lt;5%</text>
    <text x="937" y="558">~25%</text>
    <text x="1205" y="440">53%</text>
    <text x="1473" y="335">78%</text>
  </g>
  <g font-size="26" fill="#333333" text-anchor="middle">
    <text x="214" y="718">1882</text>
    <text x="669" y="718">1899</text>
    <text x="937" y="718">1909</text>
    <text x="1205" y="718">1919</text>
    <text x="1473" y="718">1929</text>
  </g>

  <rect x="80" y="768" width="8" height="56" fill="#61D8FE"/>
  <text x="110" y="806" font-size="32" font-weight="700" fill="#0D1117">The gain didn't arrive with the motors. It arrived with the redesign.</text>
  <text x="80" y="870" font-size="22" fill="#5B6470">Data: Devine (1983); David (1990)</text>
  <text x="1520" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
