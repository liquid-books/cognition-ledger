  <text x="500" y="614" font-size="24" font-weight="800" fill="#0D1117" text-anchor="middle">4 hours, one block, one owner</text>
  <text x="80" y="680" font-size="26" fill="#333333">A block can end a temp contract, replace a planned hire, or fund a call list. A scrap can only be absorbed.</text>

