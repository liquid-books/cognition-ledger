<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6470"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#61D8FE"/></marker></defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="80" y="100" font-size="48" font-weight="800" fill="#0D1117" text-anchor="start" >Six ways digital workers team up, in business terms</text>
<text x="80" y="146" font-size="26" font-weight="400" fill="#5B6470" text-anchor="start" >Builders' names for the patterns, with the job each one is like and a Brightwater example.</text>
<rect x="80" y="190" width="460" height="225" rx="16" fill="#E9ECEF" />
<text x="106" y="236" font-size="28" font-weight="700" fill="#0D1117" text-anchor="start" >Chain</text>
<text x="106" y="270" font-size="24" font-weight="700" fill="#544AE9" text-anchor="start" >An assembly line</text>
<text x="106" y="310" font-size="22" font-weight="400" fill="#333333" text-anchor="start" >Each step hands to the next, with a</text>
<text x="106" y="338" font-size="22" font-weight="400" fill="#333333" text-anchor="start" >check in between.</text>
<text x="106" y="390" font-size="22" font-weight="600" fill="#5B6470" text-anchor="start" >Quote: read the email, price it, draft it.</text>
<rect x="570" y="190" width="460" height="225" rx="16" fill="#E9ECEF" />
<text x="596" y="236" font-size="28" font-weight="700" fill="#0D1117" text-anchor="start" >Routing</text>
<text x="596" y="270" font-size="24" font-weight="700" fill="#544AE9" text-anchor="start" >A triage desk</text>
<text x="596" y="310" font-size="22" font-weight="400" fill="#333333" text-anchor="start" >Sort each case to the right</text>
<text x="596" y="338" font-size="22" font-weight="400" fill="#333333" text-anchor="start" >specialist.</text>
<text x="596" y="390" font-size="22" font-weight="600" fill="#5B6470" text-anchor="start" >Disputes: pricing, shortage or damage.</text>
<rect x="1060" y="190" width="460" height="225" rx="16" fill="#E9ECEF" />
<text x="1086" y="236" font-size="28" font-weight="700" fill="#0D1117" text-anchor="start" >Parallel work</text>
<text x="1086" y="270" font-size="24" font-weight="700" fill="#544AE9" text-anchor="start" >Several readers at once</text>
<text x="1086" y="310" font-size="22" font-weight="400" fill="#333333" text-anchor="start" >Split a big job, or get several</text>
<text x="1086" y="338" font-size="22" font-weight="400" fill="#333333" text-anchor="start" >opinions.</text>
<text x="1086" y="390" font-size="22" font-weight="600" fill="#5B6470" text-anchor="start" >Cash: one payment vs. many invoices.</text>
<rect x="80" y="440" width="460" height="225" rx="16" fill="#61D8FE" />
<text x="106" y="486" font-size="28" font-weight="700" fill="#0D1117" text-anchor="start" >Orchestrator and workers</text>
<text x="106" y="520" font-size="24" font-weight="700" fill="#544AE9" text-anchor="start" >A project lead</text>
<text x="106" y="560" font-size="22" font-weight="400" fill="#333333" text-anchor="start" >One planner splits the job and hands</text>
<text x="106" y="588" font-size="22" font-weight="400" fill="#333333" text-anchor="start" >out the pieces.</text>
<text x="106" y="640" font-size="22" font-weight="600" fill="#5B6470" text-anchor="start" >Order: credit, stock, shipping at once.</text>
<rect x="570" y="440" width="460" height="225" rx="16" fill="#61D8FE" />
<text x="596" y="486" font-size="28" font-weight="700" fill="#0D1117" text-anchor="start" >Evaluator and optimizer</text>
<text x="596" y="520" font-size="24" font-weight="700" fill="#544AE9" text-anchor="start" >A writer and an editor</text>
<text x="596" y="560" font-size="22" font-weight="400" fill="#333333" text-anchor="start" >Draft, critique, redraft until it</text>
<text x="596" y="588" font-size="22" font-weight="400" fill="#333333" text-anchor="start" >passes.</text>
<text x="596" y="640" font-size="22" font-weight="600" fill="#5B6470" text-anchor="start" >Collections: draft, then check policy.</text>
<rect x="1060" y="440" width="460" height="225" rx="16" fill="#61D8FE" />
<text x="1086" y="486" font-size="28" font-weight="700" fill="#0D1117" text-anchor="start" >Autonomous agent</text>
<text x="1086" y="520" font-size="24" font-weight="700" fill="#544AE9" text-anchor="start" >A trusted field rep</text>
<text x="1086" y="560" font-size="22" font-weight="400" fill="#333333" text-anchor="start" >A goal, tools and limits; it picks</text>
<text x="1086" y="588" font-size="22" font-weight="400" fill="#333333" text-anchor="start" >the path.</text>
<text x="1086" y="640" font-size="22" font-weight="600" fill="#5B6470" text-anchor="start" >PO intake: read, key, ask if unsure.</text>
<line x1="80" y1="722" x2="1500" y2="722" stroke="#5B6470" stroke-width="4" marker-end="url(#ah)"/><text x="80" y="708" font-size="22" font-weight="700" fill="#5B6470" text-anchor="start" >Fixed path, cheaper, easier to check</text>
<text x="1490" y="708" font-size="22" font-weight="700" fill="#5B6470" text-anchor="end" >Model picks the path: more flexible, more cost, more risk</text>
<rect x="80" y="750" width="8" height="52" rx="0" fill="#61D8FE" />
<text x="110" y="786" font-size="30" font-weight="700" fill="#0D1117" text-anchor="start" >Start at the top left. Move right only when the simpler pattern can't do the job.</text>
<text x="1520" y="866" font-size="22" font-weight="400" fill="#5B6470" text-anchor="end" >The Cognition Ledger · DrLee.ai</text>
