<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="80" y="110" font-size="54" font-weight="800" fill="#0D1117">The Cognition Ledger Manifesto</text>
  <text x="80" y="160" font-size="28" fill="#5B6470">We value the things on the left more than the things on the right.</text>
  <g font-size="40" font-weight="700">
    <rect x="80" y="215" width="640" height="110" rx="18" fill="#544AE9"/>
    <text x="400" y="284" fill="#FFFFFF" text-anchor="middle">Banked hours</text>
    <text x="800" y="284" fill="#ADB5BD" text-anchor="middle" font-size="30" font-weight="500">over</text>
    <rect x="880" y="215" width="640" height="110" rx="18" fill="#E9ECEF"/>
    <text x="1200" y="284" fill="#5B6470" text-anchor="middle" font-weight="500">saved hours</text>

    <rect x="80" y="345" width="640" height="110" rx="18" fill="#544AE9"/>
    <text x="400" y="414" fill="#FFFFFF" text-anchor="middle">Redesigned work</text>
    <text x="800" y="414" fill="#ADB5BD" text-anchor="middle" font-size="30" font-weight="500">over</text>
    <rect x="880" y="345" width="640" height="110" rx="18" fill="#E9ECEF"/>
    <text x="1200" y="414" fill="#5B6470" text-anchor="middle" font-weight="500">automated tasks</text>

    <rect x="80" y="475" width="640" height="110" rx="18" fill="#544AE9"/>
    <text x="400" y="544" fill="#FFFFFF" text-anchor="middle">Verified value</text>
    <text x="800" y="544" fill="#ADB5BD" text-anchor="middle" font-size="30" font-weight="500">over</text>
    <rect x="880" y="475" width="640" height="110" rx="18" fill="#E9ECEF"/>
    <text x="1200" y="544" fill="#5B6470" text-anchor="middle" font-weight="500">projected value</text>

    <rect x="80" y="605" width="640" height="110" rx="18" fill="#544AE9"/>
    <text x="400" y="674" fill="#FFFFFF" text-anchor="middle">Decisions</text>
    <text x="800" y="674" fill="#ADB5BD" text-anchor="middle" font-size="30" font-weight="500">over</text>
    <rect x="880" y="605" width="640" height="110" rx="18" fill="#E9ECEF"/>
    <text x="1200" y="674" fill="#5B6470" text-anchor="middle" font-weight="500">tools</text>
  </g>
  <rect x="80" y="760" width="8" height="56" fill="#61D8FE"/>
  <text x="110" y="798" font-size="32" font-weight="700" fill="#0D1117">The right side has value. The left side is what shows up on the P&amp;L.</text>
  <text x="1520" y="870" font-size="22" fill="#5B6470" text-anchor="end">The Cognition Ledger · DrLee.ai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
