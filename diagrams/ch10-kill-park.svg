<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" font-family="Mona Sans, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6470"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#61D8FE"/></marker></defs>
<rect width="1600" height="1200" fill="#FFFFFF"/>
<text x="80" y="100" font-size="48" font-weight="800" fill="#0D1117" text-anchor="start" >Kill it, park it or keep it, but never let it drift</text>
<text x="80" y="146" font-size="26" font-weight="400" fill="#5B6470" text-anchor="start" >Four questions the AI Value Office asks of every ticket that stops moving.</text>
<rect x="80" y="200" width="860" height="110" rx="16" fill="#FFFFFF" stroke="#0D1117" stroke-width="3"/>
<text x="110" y="248" font-size="28" font-weight="700" fill="#0D1117" text-anchor="start" >Did mapping delete or simplify the step this</text>
<text x="110" y="286" font-size="28" font-weight="700" fill="#0D1117" text-anchor="start" >automates?</text>
<line x1="940" y1="255" x2="1050" y2="255" stroke="#5B6470" stroke-width="4" marker-end="url(#ah)"/><text x="995" y="243" font-size="24" font-weight="700" fill="#5B6470" text-anchor="middle" >Yes</text>
<rect x="1060" y="200" width="460" height="110" rx="16" fill="#ADB5BD" />
<text x="1090" y="246" font-size="32" font-weight="800" fill="#0D1117" text-anchor="start" >KILL</text>
<text x="1090" y="286" font-size="22" font-weight="400" fill="#333333" text-anchor="start" >The best kill: the work is gone.</text>
<line x1="300" y1="310" x2="300" y2="366" stroke="#5B6470" stroke-width="4" marker-end="url(#ah)"/><text x="320" y="346" font-size="24" font-weight="700" fill="#5B6470" text-anchor="start" >No</text>
<rect x="80" y="370" width="860" height="110" rx="16" fill="#FFFFFF" stroke="#0D1117" stroke-width="3"/>
<text x="110" y="418" font-size="28" font-weight="700" fill="#0D1117" text-anchor="start" >Will a budget owner sign a draft Hour Budget?</text>
<text x="110" y="456" font-size="28" font-weight="700" fill="#0D1117" text-anchor="start" ></text>
<line x1="940" y1="425" x2="1050" y2="425" stroke="#5B6470" stroke-width="4" marker-end="url(#ah)"/><text x="995" y="413" font-size="24" font-weight="700" fill="#5B6470" text-anchor="middle" >No</text>
<rect x="1060" y="370" width="460" height="110" rx="16" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="3" stroke-dasharray="10 8"/>
<text x="1090" y="416" font-size="32" font-weight="800" fill="#0D1117" text-anchor="start" >PARK</text>
<text x="1090" y="456" font-size="22" font-weight="400" fill="#333333" text-anchor="start" >Until someone owns the hours.</text>
<line x1="300" y1="480" x2="300" y2="536" stroke="#5B6470" stroke-width="4" marker-end="url(#ah)"/><text x="320" y="516" font-size="24" font-weight="700" fill="#5B6470" text-anchor="start" >Yes</text>
<rect x="80" y="540" width="860" height="110" rx="16" fill="#FFFFFF" stroke="#0D1117" stroke-width="3"/>
<text x="110" y="588" font-size="28" font-weight="700" fill="#0D1117" text-anchor="start" >After two pilot rounds, does it hit its minutes</text>
<text x="110" y="626" font-size="28" font-weight="700" fill="#0D1117" text-anchor="start" >and error targets?</text>
<line x1="940" y1="595" x2="1050" y2="595" stroke="#5B6470" stroke-width="4" marker-end="url(#ah)"/><text x="995" y="583" font-size="24" font-weight="700" fill="#5B6470" text-anchor="middle" >No</text>
<rect x="1060" y="540" width="460" height="110" rx="16" fill="#ADB5BD" />
<text x="1090" y="586" font-size="32" font-weight="800" fill="#0D1117" text-anchor="start" >KILL</text>
<text x="1090" y="626" font-size="22" font-weight="400" fill="#333333" text-anchor="start" >Write down what you learned.</text>
<line x1="300" y1="650" x2="300" y2="706" stroke="#5B6470" stroke-width="4" marker-end="url(#ah)"/><text x="320" y="686" font-size="24" font-weight="700" fill="#5B6470" text-anchor="start" >Yes</text>
<rect x="80" y="710" width="860" height="110" rx="16" fill="#FFFFFF" stroke="#0D1117" stroke-width="3"/>
<text x="110" y="758" font-size="28" font-weight="700" fill="#0D1117" text-anchor="start" >Are the data, the system access and a WIP slot</text>
<text x="110" y="796" font-size="28" font-weight="700" fill="#0D1117" text-anchor="start" >ready now?</text>
<line x1="940" y1="765" x2="1050" y2="765" stroke="#5B6470" stroke-width="4" marker-end="url(#ah)"/><text x="995" y="753" font-size="24" font-weight="700" fill="#5B6470" text-anchor="middle" >No</text>
<rect x="1060" y="710" width="460" height="110" rx="16" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="3" stroke-dasharray="10 8"/>
<text x="1090" y="756" font-size="32" font-weight="800" fill="#0D1117" text-anchor="start" >PARK</text>
<text x="1090" y="796" font-size="22" font-weight="400" fill="#333333" text-anchor="start" >Name an owner and a revisit date.</text>
<line x1="300" y1="820" x2="300" y2="886" stroke="#5B6470" stroke-width="4" marker-end="url(#ah)"/><text x="320" y="862" font-size="24" font-weight="700" fill="#5B6470" text-anchor="start" >Yes</text>
<rect x="80" y="890" width="860" height="90" rx="16" fill="#544AE9" />
<text x="110" y="947" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="start" >KEEP: move it to the next column</text>
<rect x="80" y="1050" width="8" height="52" rx="0" fill="#61D8FE" />
<text x="110" y="1086" font-size="30" font-weight="700" fill="#0D1117" text-anchor="start" >Killing a build is a decision. Letting it drift is a cost nobody signed for.</text>
<text x="1520" y="1166" font-size="22" font-weight="400" fill="#5B6470" text-anchor="end" >The Cognition Ledger · DrLee.ai</text>
