# MyST project configuration — https://mystmd.org/guide/configuration
version: 1
project:
  title: "The Cognition Ledger"
  subtitle: "Why AI Saves Time, Not Money, and How Leaders Bank the Difference"
  authors:
    - name: Dr. Ernesto Lee
      affiliations:
        - BeHmn.com
        - DrLee.ai
    - name: Alex Schwartz
      affiliation: BeHmn.com
  description: "Why AI saves time, not money, and how leaders bank the difference: a masterclass for CEOs, CFOs, managers and data scientists on turning freed hours into verified value on the P&L."
  keywords: [artificial intelligence, AI value, value stream mapping, productivity, P&L, AI agents, Claude Skills, leadership]
  license: CC-BY-4.0
  open_access: true
  github: https://github.com/liquid-books/cognition-ledger
  numbering:
    figure: false
    table: true
    equation: true
    headings: false
  exports:
    # Typst, not LaTeX: the runner installs Typst only (LaTeX/latexmk is not available there)
    - format: typst
      id: book-pdf
      output: _build/exports/cognition-ledger.pdf
  toc:
