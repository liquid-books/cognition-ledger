# Generated by the book-writer skill.
# Builds the MyST book (HTML + per-book PDF) and deploys to GitHub Pages.
name: MyST GitHub Pages Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install Typst (for PDF export)
        uses: typst-community/setup-typst@v3
      - name: Install MyST Markdown
        run: npm install -g mystmd@1.10.1
      - name: Build HTML and PDF assets
        run: |
          myst build --html
          myst build --pdf --typst --all || echo "PDF export skipped"
          mkdir -p _build/html/exports
          find _build/exports -name "*.pdf" -exec cp {} _build/html/exports/ \; || true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
